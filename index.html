<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Emberfall: My Lord</title>
<style>
@font-face{font-family:'Pixelify Sans';src:url('fonts/PixelifySans.ttf') format('truetype');font-weight:400 700;font-display:block}
@font-face{font-family:'Cinzel';src:url('fonts/Cinzel.ttf') format('truetype');font-weight:400 900;font-display:block}
@font-face{font-family:'Alegreya';src:url('fonts/Alegreya.ttf') format('truetype');font-weight:400 900;font-display:block}
@font-face{font-family:'Alegreya';src:url('fonts/Alegreya-Italic.ttf') format('truetype');font-weight:400 900;font-style:italic;font-display:block}
:root{--pixel:'Pixelify Sans',monospace;--display:'Cinzel',Georgia,serif;--book:'Alegreya',Georgia,serif;--ink:#2a1810;--parch:#efdcb2;--parch2:#e2c896;--gold:#f2c14e;--blood:#8a1f2a;--night:#0b0710}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--night);font-family:var(--book);overflow:hidden;color:var(--ink)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.px{image-rendering:pixelated}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:#120b16;overflow:hidden}
/* HUD */
#hud{background:#1a1220;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;border-bottom:3px solid #000;box-shadow:inset 0 -2px 0 #5a4020;z-index:2}
#stats{display:flex;justify-content:space-between}
.stat{font-family:var(--pixel);display:flex;align-items:center;gap:5px;color:#f4e2c0;font-size:20px;font-weight:700;position:relative;min-width:64px}
.stat img{width:24px;height:24px}
.stat small{display:block;font-size:10px;font-weight:400;color:#b8a080;letter-spacing:1px;line-height:1}
.stat b{line-height:1;display:inline-block;font-family:var(--book);font-weight:800;font-size:22px;font-variant-numeric:lining-nums tabular-nums}
.stat.bump b{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.45)}}
.float{font-family:var(--book);font-variant-numeric:lining-nums;position:absolute;left:28px;top:-2px;font-weight:700;font-size:16px;pointer-events:none;animation:up 1.4s forwards;text-shadow:2px 2px 0 #000}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
#hudrow{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
#daylbl{font-family:var(--pixel);color:var(--gold);font-size:14px;letter-spacing:2px;line-height:1.15}#daylbl small{display:block;color:#ff8a6a;font-size:11px;letter-spacing:1px}
.council{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:420px;margin:-4px 0 10px}.council span{font-size:13px;color:#c8b498;background:#1e1424;border:2px solid #000;padding:3px 8px}.council b{font-family:var(--display);color:#f2c14e;font-size:12px;margin-right:4px}.council span.away{opacity:.5}
.ch .cost.agent{color:#3a5a8a}
.hb{font-family:var(--pixel);background:#2e2234;color:#f4e2c0;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;font-size:13px;padding:3px 9px;margin-left:6px;cursor:pointer}
/* scene */
#scene{display:none}
#sceneWide{display:block;width:100%;aspect-ratio:192/120;height:auto;background:#000}
/* dialog */
#dialog{flex:1;margin:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--parch);border:4px solid var(--ink);
 box-shadow:inset 0 0 0 3px #c9a46a,inset 0 0 30px rgba(140,90,30,.35),0 4px 0 #000;padding:12px 12px 10px;overflow-y:auto;position:relative}
.head{display:flex;gap:10px;align-items:center}
#pbox{width:84px;height:84px;flex:none;background:#2a1d2e;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #6a4a2a;position:relative;overflow:hidden}
#pbox::after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(0,0,0,.35))}
#portrait{width:78px;height:78px}
#who{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;color:var(--blood);line-height:1.1}
#role{font-style:italic;font-size:16px;color:#6a4a2a;margin-top:2px}
#txt{font-size:20px;line-height:1.38;margin:10px 2px 8px;min-height:4.2em;white-space:pre-line}
#txt.wait{color:#8a6a4a;font-style:italic}
#choices{display:flex;flex-direction:column;gap:9px;padding-bottom:4px}
.ch{font-family:var(--book);font-size:18.5px;line-height:1.25;text-align:left;padding:10px 12px 10px 28px;background:#fff4dc;color:var(--ink);border:3px solid var(--ink);
 box-shadow:0 4px 0 var(--ink);cursor:pointer;position:relative;animation:slide .3s backwards}
.ch::before{content:"▸";position:absolute;left:10px;color:#a03020}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ch:disabled{opacity:.45}
.ch .cost{font-variant-numeric:lining-nums;display:flex;gap:8px;font-size:13px;color:#7a4a2a;margin-top:3px;align-items:center}
.ch .cost img{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.ch.go{font-family:var(--display);font-size:17px;background:#a8322a;color:#fff4dc;text-align:center;padding-left:12px;font-weight:700;letter-spacing:1px}
.ch.go::before{content:""}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
/* overlays */
#overlay,#modal{position:absolute;inset:0;display:none;flex-direction:column;background:var(--night);z-index:10;overflow-y:auto}
#modal{z-index:20;background:rgba(5,3,8,.82);align-items:center;justify-content:center;padding:20px}
.cwrap{position:relative;flex:none}
#castle{width:100%;height:auto}
.logo{position:absolute;left:0;right:0;top:3%;text-align:center;pointer-events:none;animation:fade 1.6s}
.logo h1{font-family:var(--pixel);margin:0;font-size:min(13vw,62px);font-weight:700;color:var(--gold);letter-spacing:3px;
 text-shadow:3px 0 #3a1408,-3px 0 #3a1408,0 3px #3a1408,0 -3px #3a1408,3px 3px #3a1408,-3px 3px #3a1408,3px -3px #3a1408,-3px -3px #3a1408,0 7px #7a2a10,0 0 30px rgba(255,140,40,.5)}
.logo h2{font-family:var(--pixel);margin:4px 0 0;color:#f4e2c0;letter-spacing:9px;font-size:18px;text-shadow:2px 2px 0 #000}
.ovb{flex:1;padding:18px 22px calc(env(safe-area-inset-bottom) + 20px);text-align:center;color:#f4e2c0;display:flex;flex-direction:column;align-items:center;animation:fade .8s}
.ovb h3{font-family:var(--display);font-weight:700;font-size:26px;color:var(--gold);margin:4px 0 8px;text-shadow:3px 3px 0 #000}
.ovb p{font-size:19px;line-height:1.4;max-width:440px;margin:6px 0}
.ovb .dim{opacity:.65;font-size:15px}
.pb{font-family:var(--display);font-size:17px;font-weight:700;min-width:240px;margin:6px;padding:11px 16px;background:#a8322a;color:#fff4dc;border:3px solid #000;
 box-shadow:inset 0 0 0 2px #e0705a,0 4px 0 #000;cursor:pointer;letter-spacing:1px}
.pb.alt{background:#3a2c40;box-shadow:inset 0 0 0 2px #6a5070,0 4px 0 #000}
.pb:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #e0705a,0 1px 0 #000}
.sumrow{font-variant-numeric:lining-nums tabular-nums;display:flex;justify-content:space-between;width:250px;font-size:18px;margin:3px 0}
.sumrow img{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.box{background:#1e1424;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a4020;padding:18px;color:#f4e2c0;max-width:420px;width:100%;max-height:85%;overflow:auto;text-align:center;animation:fade .3s}
.box h3{font-family:var(--display);color:var(--gold);margin:0 0 12px;font-size:24px}
.box ul{text-align:left;padding-left:18px;font-size:16px;line-height:1.45}
.elist div{padding:7px 4px;border-bottom:1px dashed #4a3a50;font-size:16px;text-align:left}
.elist .lock{opacity:.4}
.bld{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:400px;background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 10px;margin:4px 0;text-align:left}
.bld b{font-family:var(--display);color:#f2c14e;font-size:16px}.bld small{display:block;color:#b8a488;font-size:13px}
.bld button{font-family:var(--book);font-variant-numeric:lining-nums;font-size:16px;font-size:14px;font-weight:700;background:#a8322a;color:#fff4dc;border:2px solid #000;padding:6px 10px;cursor:pointer;white-space:nowrap}
.bld button:disabled{opacity:.4}.bld.done{opacity:.55}
.resbar{display:flex;justify-content:space-between;width:100%;max-width:420px;background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 14px;margin:0 0 12px;position:sticky;top:0;z-index:2}
.resbar div{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;color:#f4e2c0;font-variant-numeric:lining-nums tabular-nums}
.resbar img{width:20px;height:20px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;margin:6px 0}
.room{font-family:var(--book);text-align:left;background:#2a1d2e;color:#f4e2c0;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a4020,0 4px 0 #000;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:100px;position:relative}
.room:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #5a4020,0 1px 0 #000}
.room .rh{display:flex;align-items:center;gap:8px}.room img{width:26px;height:26px}
.room b{font-family:var(--display);color:#f2c14e;font-size:15px;line-height:1.1}
.room small{color:#c8b498;font-size:15px;line-height:1.25}
.room em{position:absolute;top:6px;right:8px;font-style:normal;color:#9ef08a;font-weight:800}
.room em.bang{color:#fff4dc;background:#a8322a;border:2px solid #000;width:22px;height:22px;display:flex;align-items:center;justify-content:center;animation:bob 1s infinite alternate}
.room.story{box-shadow:inset 0 0 0 2px #f2c14e,0 4px 0 #000}.room em.bang.gold{background:#f2c14e;color:#2a1810}.must{color:#f2c14e!important;font-weight:700}
.evc.story{box-shadow:inset 0 0 0 2px #f2c14e}.evc .sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.evc .sh canvas{width:48px;height:48px;background:#2a1d2e;border:2px solid #000}.evc .sh b{font-family:var(--display);color:var(--blood);font-size:18px}.evc p{white-space:pre-line}
.pb:disabled{opacity:.45}
.panel{display:flex;flex-direction:column;align-items:center;width:100%}.panel .dim{color:#b8a488;font-size:15px;margin:0 0 8px}.panel h3.sm{font-size:19px;margin:14px 0 6px}
#castle.map{cursor:pointer}
.room.done{box-shadow:inset 0 0 0 2px #3e8a34,0 4px 0 #000}.room.ev{box-shadow:inset 0 0 0 2px #e0705a,0 4px 0 #000}
@keyframes bob{to{transform:translateY(-3px)}}
.ovb h3.sm{font-size:19px;margin:14px 0 6px}
.ledger{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.taxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin-bottom:10px}
.tx{font-family:var(--book);background:#2a1d2e;color:#f4e2c0;border:3px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tx b{font-family:var(--display);color:#f2c14e}.tx small{font-size:13px;color:#b8a488;line-height:1.2}
.tx.on{background:#5a2420;box-shadow:inset 0 0 0 2px #f2c14e}
.bld .gain{color:#9ec88a!important}.btns.sq{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.btns.sq button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;font-family:var(--book);line-height:1.15}
.btns.sq button b{font-family:var(--display);font-size:12px;color:#fff4dc}.btns.sq button span{font-size:13px;color:#f4d8c0}
.btns.sq em{font-style:normal;font-size:12px;font-weight:700;margin-top:2px}.btns.sq em.good{color:#b8f0a0}.btns.sq em.ok{color:#f2d080}.btns.sq em.meh{color:#f0a860}.btns.sq em.bad{color:#ffb0a0}
.bld.col{flex-direction:column;align-items:stretch}.bld .btns{display:flex;gap:6px;flex-wrap:wrap}
.fam{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;margin:8px 0}
.famb{background:#2a1d2e;border:3px solid #000;box-shadow:inset 0 0 0 1px #5a4020,0 4px 0 #000;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#f2c14e;font-family:var(--display)}
.famb canvas{width:72px;height:72px;background:#1c1420}
.famtxt,.evc{width:100%;max-width:420px;background:var(--parch);color:var(--ink);border:3px solid #000;box-shadow:inset 0 0 0 2px #c9a46a;padding:12px 14px;margin:6px 0 10px;text-align:left}
.famtxt p,.evc p{color:var(--ink)!important;margin:0 0 8px}.famtxt .dim{color:#7a4a2a!important;font-style:italic;opacity:1}
.evc .ch{width:100%;margin-top:8px}.evc.done{opacity:.85}
.summary{width:100%;max-width:420px;text-align:left}.summary h3.sm{text-align:center}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nums div{background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 4px;text-align:center}.nums b{display:block;font-size:24px;color:#f2c14e;font-variant-numeric:lining-nums}.nums small{font-size:13px;color:#b8a488;line-height:1.15;display:block}.summary ul{font-size:16px;line-height:1.4;color:#d8c8a8;padding-left:20px}
.elist .lock small{display:block;font-size:14px;font-style:italic;opacity:.9}
.siege p{opacity:0;animation:appear 1s forwards}
@keyframes appear{to{opacity:1}}
#tip{position:absolute;inset:0;z-index:35;background:rgba(5,3,8,.7);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s}#tip .box{text-align:left}#tip h3{text-align:center}#tip p{font-size:17px;line-height:1.45}#tip .pb{display:block;margin:12px auto 0}
.stat{cursor:pointer}
.bigtext #txt{font-size:23px}.bigtext .ch{font-size:20.5px}.bigtext .ovb p,.bigtext .box p{font-size:20px}.bigtext #role{font-size:17px}.bigtext .room small{font-size:16px}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);background:#1a1220;color:#f4e2c0;border:2px solid #000;box-shadow:inset 0 0 0 1px #c9a46a;padding:10px 14px;font-size:16px;z-index:40;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
#card{font-family:var(--pixel);position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,3,8,.85);color:var(--gold);pointer-events:none}
#card b{font-size:54px;text-shadow:4px 4px 0 #3a1408;animation:pop .6s}
#pips{display:flex;gap:4px;margin-top:16px}#pips i{width:14px;height:14px;border:2px solid #000;display:block}#pips i.now{outline:2px solid #fff4dc;transform:scale(1.25)}#pips i.past{opacity:.35}
#card span{color:#f4e2c0;font-size:16px;letter-spacing:4px;margin-top:6px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}}
@keyframes fade{from{opacity:0}}
/* ---------- Landscape: the hall fills the screen, a text box runs along the bottom with the choices on its right ---------- */
@media (orientation:landscape) and (min-aspect-ratio:5/4){
 #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 34%}
 #hud{grid-row:1;grid-column:1;display:flex;align-items:center;gap:20px;padding:calc(env(safe-area-inset-top) + 5px) max(14px,env(safe-area-inset-right)) 5px max(14px,env(safe-area-inset-left))}
 #stats{flex:1;justify-content:flex-start;gap:clamp(14px,3vw,34px)}
 .stat{min-width:0}.stat img{width:22px;height:22px}.stat b{font-size:20px}
 #hudrow{margin-top:0;gap:14px}
 #daylbl{font-size:13px}#daylbl small{font-size:10px}
 #scene{display:none}
 #sceneWide{display:block;grid-row:2;grid-column:1;align-self:start;width:100%;height:calc(100% + 30px);z-index:1}
 #dialog{grid-row:3;grid-column:1;z-index:2;min-height:0;overflow:hidden;margin:0 max(12px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(12px,env(safe-area-inset-left));
  padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1.35fr) minmax(230px,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:12px;opacity:.97}
 #dialog .head{display:contents}
 #pbox{grid-column:1;grid-row:1/3;align-self:start}
 #dialog .head>div:last-child{grid-column:2;grid-row:1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
 #pbox{width:50px;height:50px}#portrait{width:44px;height:44px}
 #who{font-size:17px}#role{font-size:13.5px;margin-top:0}
 #txt{grid-column:2;grid-row:2;font-size:17px;line-height:1.32;margin:6px 0 0;min-height:0;overflow:hidden}
 #choices{grid-column:3;grid-row:1/3;min-height:0;overflow-y:auto;justify-content:center;gap:7px;padding:2px 2px 6px;border-left:2px dashed rgba(42,24,16,.25);padding-left:14px}
 .ch{font-size:15.5px;padding:7px 10px 7px 26px;line-height:1.2;box-shadow:0 3px 0 var(--ink)}.ch .cost{font-size:12px;margin-top:1px}
 #overlay{flex-direction:row;overflow:hidden}
 .cwrap{flex:1.45 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;padding-left:env(safe-area-inset-left);background:#05030a}
 #castle{width:min(100%,calc(100dvh * 4 / 3));height:auto}
 .ovb{flex:1 1 0;min-width:0;height:100%;overflow-y:auto;justify-content:flex-start;padding:16px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) 18px}
 .ovb h3{font-size:22px}.ovb p{font-size:16.5px}
 .logo{top:5%}.logo h1{font-size:min(7vw,58px)}
 .pb{min-width:200px;font-size:15px;padding:9px 14px}
 .rooms{gap:8px}.room{min-height:78px;padding:8px}.room small{font-size:13.5px}
 #card b{font-size:46px}
 #tip .box,#modal .box{max-width:min(660px,92vw);max-height:92%;padding:14px 20px}
 #tip h3{margin-bottom:6px}#tip p{font-size:15.5px;line-height:1.4;margin:4px 0}#tip .pb{margin-top:8px}
 .bigtext #txt{font-size:19.5px}.bigtext .ch{font-size:17.5px}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4) and (max-height:440px){
 #sceneWide{height:calc(100% + 24px)}
 #dialog{padding:8px 12px;grid-template-columns:auto minmax(0,1.3fr) minmax(205px,1fr)}
 #pbox{width:42px;height:42px}#portrait{width:36px;height:36px}
 #who{font-size:15.5px}#role{font-size:12.5px}
 #txt{font-size:15.5px;line-height:1.28;margin-top:4px}
 .ch{font-size:14.5px;padding:6px 8px 6px 24px}#choices{gap:6px}
}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
 /* title: the castle fills the screen, logo on top, the menu along the bottom */
 #overlay.ts,#overlay.fb{display:block;overflow:hidden}
 #overlay.ts .cwrap,#overlay.fb .cwrap{position:absolute;inset:0;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
 #overlay.ts #castle,#overlay.fb #castle{width:max(100%,calc(100dvh * 4 / 3));height:auto;flex:none}
 #overlay.ts .logo{top:max(5%,env(safe-area-inset-top))}
 #overlay.ts .logo h1{font-size:min(9vw,76px)}#overlay.ts .logo h2{font-size:20px}
 #overlay.ts .ovb{position:absolute;left:0;right:0;bottom:0;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 12px;
  padding:40px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(18px,env(safe-area-inset-left));background:linear-gradient(rgba(5,3,8,0),rgba(5,3,8,.85) 45%)}
 #overlay.ts .ovb p.dim{flex-basis:auto;width:100%;margin:0 0 10px;font-size:15px;opacity:.85;text-shadow:0 2px 0 #000;text-align:center}
 #overlay.ts .pb{min-width:0;width:auto;margin:0;padding:10px 18px;flex:0 0 auto}

{m:5,who:"merchant",req:()=>has("loan"),text:"Midsummer, my lord! Eighty gold, as agreed.",
 choices:[{t:"Repay 80 gold",cost:{gold:80},go:()=>{fx({gold:-80});delete S.f.loan;return "\"A pleasure, as always.\""}},
  {t:"Default",go:()=>{set("guildEnemy");fx({favor:-6,food:-10});note("Defaulted on the Guild.");return "The Guild seizes grain wagons on the road. Prices in Emberfall double."}}]},
{m:5,who:"eastlord",req:()=>has("marenBetrothed"),text:"Our houses are one now, Emberfall. When Vex comes, my riders will come too. Forty lances.",
 choices:[{t:"\"Emberfall is grateful.\"",go:()=>{set("harwinAlly");fx({favor:3});note("Lord Harwin pledged his lances.");return "He clasps your arm. \"Family is family.\""}}]},
{m:5,who:"eastlord",req:()=>has("refusedHarwin"),text:"You refused my son. The Marches will remember the insult.",
 choices:[{t:"Offer gold as apology",cost:{gold:20},go:()=>{fx({gold:-20});return "\"Gold mends pride, if not friendship.\""}},
  {t:"\"So be it.\"",go:()=>{set("harwinEnemy");return "He rides out without a backward look."}}]},
{m:5,who:"herald",text:"Hear the word of King Osmund! The crown is aware of strife between Emberfall and Vex. The King will favor whichever lord keeps the King's peace... or wins.",
 choices:[{t:"Send the King a gift",cost:{gold:15},go:()=>{fx({gold:-15});set("kingFavor");return "\"His Majesty will hear of Emberfall's loyalty.\""}},
  {t:"Ask the King for aid",go:()=>"\"The King's armies are in the north. You stand alone.\""}]},
{m:5,who:"morwen",req:()=>has("witchPact")&&!has("knelt"),text:"Later has come, little lord. My price: when the fire comes, you'll let me burn Baron Vex myself. And afterwards, the fen is mine. No priests. No laws.",
 choices:[{t:"Honor the pact",go:()=>{set("witchFire");note("Honored the witch's pact.");return "\"Good. The river will run red... with his blood, not yours.\""}},
  {t:"Break it",go:()=>{set("witchCurse");fx({food:-15,favor:-5});note("Broke the witch's pact.");return "Your granary rots overnight. Her laughter echoes in the walls."}}]},
{m:5,who:"tobin",req:()=>has("tobinRides")&&!has("knelt"),text:"Father! We ambushed Vex's scouts at the mill! I... I've never seen a real fight before.",
 choices:[{t:"Hold him",go:()=>{set("tobinHardened");return "He shakes. Then he stops shaking. He's not a boy anymore."}},
  {t:"\"You did well.\"",go:()=>{set("tobinProud");fx({men:3});return "The men cheer him. He looks back at you for a long time."}}]},
{m:5,who:"tobin",req:()=>has("tobinStudy")&&!has("knelt"),text:"Father, I went through the old ledgers with Aldric. There's a tunnel under the east wall. Grandfather used it for smuggling!",
 choices:[{t:"Use it to raid Vex's supplies",go:()=>{set("tunnelRaid");fx({food:15});note("Raided Vex's camp through the tunnel.");return "Your men return with three wagons of Vex's grain."}},
  {t:"Keep it as an escape route",go:()=>{set("tunnel");return "If the walls fall, your family can live."}}]},
{m:5,who:"elinor",req:()=>!has("knelt"),text:"Whatever happens when Vex comes... I want you to know. You were a better lord than your father. Kinder.",
 choices:[{t:"\"Take the children and leave.\"",go:()=>{set("familySafe");return "\"I'll stay until the last moment. Then I'll go.\""}},
  {t:"\"We stand together.\"",go:()=>{set("familyStays");fx({favor:5});return "She takes your hand. It doesn't tremble."}}]},
{m:5,who:"aldric",req:()=>has("knelt"),text:"My lord... Vex's banners on the river. He hasn't come to fight. He's come to take your oath in person, in front of the whole city.",
 choices:[{t:"Kneel with your head high",go:()=>{fx({favor:3});return "You kneel in the square like a man doing a hard job well. Some of your people bow their heads with you."}},
  {t:"Kneel and say nothing",go:()=>"The words of the oath are short. The silence afterwards is very long."}]},
{m:5,who:"aldric",req:()=>!has("knelt"),text:"My lord... Vex's banners on the river. He's come at last. Every soul in Emberfall is looking at you now.",
 choices:[{t:"Hold the walls",go:()=>{set("plan_wall");return "Stones stacked, oil boiled. Let him come."}},
  {t:"Ride out and attack",go:()=>{set("plan_attack");return "\"For Emberfall!\" The gates open."}},
  {t:"Parley with Vex",go:()=>{set("plan_parley");return "You ride out under a white banner."}},
  {t:"Flee through the tunnel",req:()=>has("tunnel"),go:()=>{set("plan_flee");return "In the dark, you lead your family away from Emberfall."}}]},
/* ================= CHAPTER TWO: August to February ================= */
/* ---- AUGUST: after the battle ---- */
{m:6,who:"aldric",text:()=>has("vassal")?"My lord. Vex's banner flies over the gate. We are alive, and we are his. The people are waiting to see what kind of lord you'll be now.":has("vexWounded")?"My lord. We held, but the bells haven't stopped ringing for the dead. Vex limped home across the river. He'll be back.":"My lord. The bells are ringing for the dead and for the living. Emberfall is still yours. Now we must hold it through the winter.",
 choices:[{t:"Hold a feast for the fallen",cost:{food:10},go:()=>{fx({food:-10,favor:6});return "Long tables in the square. They drink to the dead until the candles gutter."}},
  {t:"Pay the widows a pension",cost:{gold:15},go:()=>{fx({gold:-15,favor:8});note("Paid pensions to the widows of the battle.");return "Aldric writes their names into the ledger himself."}},
  {t:"\"Back to work. Winter won't wait.\"",go:()=>{fx({favor:-2});return "The city goes back to work. Quietly."}}]},
{m:6,who:"vexenvoy",req:()=>has("vexDead")&&!has("vassal"),text:"Sir Gerrit kneels in the dust of your hall, his helm in his hands. \"My master is dead, my lord. His men are leaderless and hungry on the far bank. What will you do with us?\"",
 choices:[{t:"Take them into your service",go:()=>{fx({men:15,favor:-3});set("vexMenSworn");note("Vex's soldiers swore to Emberfall.");return "Fifteen of Vex's soldiers swear on your banner. Your own soldiers watch them closely."}},
  {t:"Let them go home",go:()=>{fx({favor:4});return "They cross the river in silence. On the far bank, one of them raises a hand in thanks."}},
  {t:"Ransom them to their families",go:()=>{fx({gold:30,favor:-2});return "Thirty gold, paid in copper and tears."}}]},
{m:6,who:"vexenvoy",req:()=>has("vexWounded")&&!has("vexDead"),text:"Sir Gerrit, his arm in a sling. \"The Baron lives, my lord, and he remembers. He offers a truce until spring. Forty gold, and he stays on his side of the river.\"",
 choices:[{t:"Pay for the truce",cost:{gold:40},go:()=>{fx({gold:-40});set("vexTruce");note("Bought a truce from Vex until spring.");return "\"A wise purchase.\" He bows a little lower than last time."}},
  {t:"Send the Whisper across the river",agent:"spy",go:()=>{send("spy");set("vexRevenge");set("intel");return "The Whisper comes back with Vex's plans for winter, and a scar of his own."}},
  {t:"\"Tell him to come back and finish it.\"",go:()=>{set("vexRevenge");fx({favor:4});note("Refused Vex's truce.");return "\"He will. When the river freezes.\""}}]},
{m:6,who:"vexenvoy",req:()=>has("vassal"),text:"Sir Gerrit sits beside your throne now, on a chair he brought himself. \"By the Baron's command, three of every ten coins in Emberfall's taxes go across the river. Starting this month.\"",
 choices:[{t:"\"As the Baron commands.\"",go:()=>{fx({favor:-3});return "Gerrit smiles. Your people don't."}},
  {t:"Smile, and start planning",go:()=>{set("rebelSeed");note("Began quietly planning against Vex.");return "You smile back. Aldric catches your eye across the hall, and nods."}}]},
{m:6,who:"morwen",req:()=>has("witchCourt"),text:"Morwen has taken the east tower. Green light burns in its windows all night. \"Tell your priest to stop crying, little lord. I saved your city. Now I'm staying.\"",
 choices:[{t:"Welcome her to court",go:()=>{set("morwenCourt");fx({favor:-3});note("Gave Morwen a place at court.");return "She curtsies, badly, on purpose. Cuthbert walks out of the hall."}},
  {t:"Give her the fen, and nothing more",go:()=>{set("fenOnly");return "\"The fen, then. For now.\" She takes the stairs down two at a time."}},
  {t:"Order her gone",go:()=>{set("morwenBanished");set("witchCurse");note("Banished Morwen from Emberfall.");return "She laughs all the way to the gate. That night, the milk sours in every house in the city."}}]},
{m:6,who:"herald",req:()=>has("kingFavor")&&has("vexDead")&&!has("vassal"),text:"Hear the word of King Osmund! For breaking Baron Vex, the lands across the river are granted to the lord of Emberfall.",
 choices:[{t:"Rule them gently",go:()=>{set("vexLands");fx({favor:3});note("King Osmund granted you Vex's lands.");return "Vex's old villages send a cart of apples and a cautious welcome. (+10 gold a month)"}},
  {t:"Tax them hard. They followed Vex.",go:()=>{set("vexLands");set("landsHarsh");fx({gold:20,favor:-3});note("King Osmund granted you Vex's lands.");return "Gold flows across the river. So does resentment. (+16 gold a month)"}}]},
{m:6,who:"elinor",req:()=>has("marenBetrothed")&&has("harwinAlly"),text:"Elinor spreads a list across your lap. \"Harwin wants the wedding at harvest. Maren and Edric. The question is how much of the treasury you'd like to spend on it.\"",
 choices:[{t:"A grand wedding",cost:{gold:40},go:()=>{fx({gold:-40,favor:8});set("weddingSet");set("weddingGrand");return "Minstrels from three cities, and a cake taller than Tobin."}},
  {t:"A modest wedding",cost:{gold:15},go:()=>{fx({gold:-15,favor:3});set("weddingSet");return "\"Modest,\" Elinor repeats, unconvinced. \"Maren will understand.\""}},
  {t:"Delay it until spring",go:()=>{set("weddingDelay");return "Harwin's reply is short and very polite. Too polite."}}]},
/* ---- SEPTEMBER: harvest ---- */
{m:7,who:"peasant",text:()=>has("fedThornby")?"M'lord! The seed you gave us in the spring came up gold. Best harvest Thornby's seen in ten years. The barns are bursting!":has("refusedThornby")?"The harvest's in, m'lord. What there is of it. Half our fields lay bare without seed. We remember why.":"The harvest's in, m'lord. Not the best year, not the worst. How much will the castle take?",
 choices:[{t:"Take a double share",go:()=>{fx({food:15,favor:-6});return "The castle granary fills. Thornby's doesn't."}},
  {t:"Take the usual share",go:()=>{fx({food:6});return "\"Fair's fair, m'lord.\""}},
  {t:"Leave them extra this year",go:()=>{fx({favor:6});return "Hob grins all the way back to Thornby."}}]},
{m:7,who:"cuthbert",text:"The abbey asks for its tenth of the harvest, my lord, as it has for two hundred years. The poor will eat from it all winter.",
 choices:[{t:"Give the abbey its tenth",cost:{food:12},go:()=>{fx({food:-12,favor:4});set("church");return "\"Bless you, my lord. The soup kitchens will open at first frost.\""}},
  {t:"Give half",cost:{food:6},go:()=>{fx({food:-6,favor:1});return "Cuthbert thanks you, a little stiffly."}},
  {t:"\"The castle needs every grain.\"",go:()=>{fx({favor:-4});set("churchAngry");return "Cuthbert preaches about greedy lords on Sunday. He doesn't name names. He doesn't need to."}}]},
{m:7,who:"merchant",req:()=>has("loanAutumn"),text:"Harvest time, my lord! One hundred gold, as we agreed in the spring.",
 choices:[{t:"Repay 100 gold",cost:{gold:100},go:()=>{fx({gold:-100});delete S.f.loanAutumn;return "\"Always a pleasure doing business with Emberfall.\""}},
  {t:"Pay in grain instead",cost:{food:40},go:()=>{fx({food:-40});delete S.f.loanAutumn;return "Osric sniffs the grain sacks. \"Acceptable.\" His wagons leave heavy."}},
  {t:"Default",go:()=>{delete S.f.loanAutumn;set("guildEnemy");fx({favor:-6,food:-10});note("Defaulted on the Guild's harvest loan.");return "The Guild seizes grain wagons on the road. Prices in Emberfall double."}}]},
{m:7,who:"vexenvoy",req:()=>has("vassal"),text:"\"The Baron would like your son at his court, my lord. As a ward. To learn proper manners.\" Gerrit doesn't bother pretending it isn't a hostage.",
 choices:[{t:"Send Tobin",go:()=>{set("tobinHostage");S.bond.tobin=0;fx({favor:-5});note("Sent Tobin to Vex's court as a hostage.");return "Tobin doesn't cry until he's out of sight of the gate. Elinor doesn't stop."}},
  {t:"Refuse",go:()=>{set("rebelSeed");set("vexAngry");return "Gerrit's smile goes thin. \"The Baron will hear of this.\""}}]},
{m:7,who:"cuthbert",req:()=>has("morwenCourt"),text:"\"My lord, the witch is teaching children in the market to talk to crows. The abbey or the fen. You cannot keep both.\"",
 choices:[{t:"Choose the abbey",go:()=>{delete S.f.morwenCourt;set("morwenBanished");set("witchCurse");fx({favor:4});note("Sent Morwen away at the abbey's demand.");return "Morwen leaves at dawn. The crows follow her. So does a curse on your granary."}},
  {t:"Choose the fen",go:()=>{set("witchRealm");set("churchAngry");fx({favor:-6});note("Sided with Morwen against the abbey.");return "Cuthbert takes off his abbot's ring and leaves it on your throne."}},
  {t:"\"Learn to live with each other.\"",go:()=>{fx({favor:-2});return "Neither of them speaks to you for a week."}}]},
/* ---- OCTOBER: the cousin and the King ---- */
{m:8,who:"tobin",req:()=>!has("tobinHostage"),text:"\"Father, I'll be of age at Midwinter. Will you knight me? I've been practicing. Ask anyone. Well, don't ask Pip.\"",
 choices:[{t:"\"At Midwinter. I promise.\"",go:()=>{set("tobinPromise");S.bond.tobin++;return "He hugs you so hard your crown slips."}},
  {t:"\"Earn it first.\"",go:()=>{S.bond.tobin++;set("tobinEarn");return "\"I will!\" He's in the yard with a sword before you've finished your sentence."}}]},
{m:8,who:"eastlord",req:()=>has("weddingSet"),text:"Lord Harwin, in his finest, with tears in his beard. \"Maren and my Edric are wed, my friend. Our houses are one blood now.\"",
 choices:[{t:"Toast the couple",go:()=>{S.f.lanterns=S.month+1;set("marenWed");fx({favor:5});note("Maren married Edric of the Marches.");return "The whole hall drinks. Edric reads a poem. It's terrible. Maren laughs until she cries."}},
  {t:"Give them a dowry of 20 gold",cost:{gold:20},go:()=>{set("marenWed");set("harwinBound");fx({gold:-20,favor:3});note("Maren married Edric of the Marches.");return "Harwin clasps both your hands. \"Whatever comes, the Marches stand with Emberfall.\""}}]},
{m:8,who:"elinor",req:()=>has("marenBitter")&&!has("marenWed"),text:"Elinor's face is white. \"Maren's gone. Her room is empty, and the minstrel who played at harvest is gone too.\"",
 choices:[{t:"Send riders after her",go:()=>{fx({men:-3});set("marenReturned");return "They bring her back three days later, furious, muddy, and safe."}},
  {t:"Let her go",go:()=>{set("marenGone");fx({favor:-3});note("Maren ran away from Emberfall.");return "\"She'll write,\" Elinor says. She says it every day after."}}]},
/* ---- NOVEMBER ---- */
{m:9,who:"whisper",req:()=>has("spy")&&has("corvinClaim"),text:"\"Your cousin's will was written by a clerk in Greymarch, my lord. For a price. I can bring you the clerk before the council... for 20 gold.\"",
 choices:[{t:"Pay The Whisper",cost:{gold:20},go:()=>{fx({gold:-20});set("corvinSecret");note("The Whisper found the clerk who forged Corvin's will.");return "\"He'll be in your dungeon by Midwinter. Singing.\""}},
  {t:"Decline",go:()=>"\"Your throne, my lord. Your gamble.\""}]},
{m:9,who:"aldric",text:"Winter is coming, my lord. We'll need firewood for four months, or we'll be burning furniture by February.",
 choices:[{t:"Buy firewood now",cost:{gold:15},go:()=>{fx({gold:-15});set("firewood");return "Wagons of oak stacked to the rafters. (No firewood costs this winter.)"}},
  {t:"Cut the Ashwood",go:()=>{set("firewood");fx({favor:-4});return "The royal forest rings with axes. The hunters are not pleased. (No firewood costs this winter.)"}},
  {t:"\"We'll manage.\"",go:()=>"Aldric writes \"firewood: 4 gold a month\" in the ledger, and underlines it."}]},
{m:9,who:"vexenvoy",req:()=>has("vexRevenge")&&!has("vexDead"),text:"Gerrit again, thinner than before. \"The Baron is gathering men. He'll cross when the river freezes. I'm told to say that this is your last chance: fifty gold, and he stays home.\"",
 choices:[{t:"Pay fifty gold",cost:{gold:50},go:()=>{fx({gold:-50});set("vexTruce");delete S.f.vexRevenge;return "\"Wise,\" Gerrit says, and sounds relieved."}},
  {t:"\"Let him come.\"",go:()=>{fx({favor:3});return "Brannoc's replacement starts doubling the watches on the river."}}]},
{m:9,who:"eastlord",req:()=>has("vassal")&&has("rebelSeed")&&has("harwinAlly"),text:"Harwin, cloaked, at night. \"The Marches are tired of Vex's taxes too. Raise your banner at midwinter and forty lances will ride with you.\"",
 choices:[{t:"\"We rise in December.\"",go:()=>{set("rebellion");note("Agreed with Harwin to rise against Vex.");return "Harwin grips your hand. \"December, then. Sharpen everything.\""}},
  {t:"\"Not yet.\"",go:()=>"\"Don't wait too long. Chains get comfortable.\""}]},
{m:9,who:"aldric",req:()=>has("vassal")&&has("rebelSeed")&&!has("harwinAlly"),text:"Aldric closes the door behind him. \"My lord, the guild masters, the abbey and half the guard are sick of Vex. If you raise the banner at midwinter, they'll follow.\"",
 choices:[{t:"\"We rise in December.\"",go:()=>{set("rebellion");note("Planned an uprising against Vex.");return "Aldric bows. His hands are shaking, and he's smiling."}},
  {t:"\"Not yet.\"",go:()=>"\"As you say, my lord.\" He looks older than yesterday."}]},
/* ---- DECEMBER ---- */
{m:10,who:"aldric",req:()=>has("vexRevenge")&&!has("vexDead")&&!has("vexTruce"),text:"My lord! Vex's banners on the ice! He's crossing the frozen river with everything he has left!",
 choices:[{t:"Hold the walls",go:()=>{if(strength()>=45){set("vexDead");fx({favor:8});note("Vex died on the frozen river.");return "The ice cracks under his heavy horse. Baron Vex goes into the black water and doesn't come up. It's over."}
   fx({men:-10,gold:-20,favor:-8});set("vexRaided2");note("Vex burned Thornby before retreating.");return "You hold the castle, but Vex burns Thornby before the ice turns him back."}},
  {t:"Pay him to turn back",cost:{gold:40},go:()=>{fx({gold:-40,favor:-6});set("vexTruce");return "He takes the gold and goes. Your soldiers won't meet your eyes."}}]},
{m:10,who:"eastlord",req:()=>has("rebellion")&&has("harwinAlly"),text:"Harwin's lances at your gate, steam rising from the horses. \"It's December, my friend. Is Emberfall still with us?\"",
 choices:[{t:"Raise the banner",go:()=>rebel()},{t:"Call it off",go:()=>{delete S.f.rebellion;fx({favor:-6});return "Harwin turns his horse without a word."}}]},
{m:10,who:"aldric",req:()=>has("rebellion")&&!has("harwinAlly"),text:"\"The guild masters are armed, the abbey bells are ready. Say the word, my lord.\"",
 choices:[{t:"Raise the banner",go:()=>rebel()},{t:"Call it off",go:()=>{delete S.f.rebellion;fx({favor:-6});return "The bells stay silent. People stop looking you in the eye."}}]},
{m:10,who:"cuthbert",req:()=>!has("witchRealm"),text:"The Feast of the Longest Night is upon us, my lord. The darkest night of the year. Emberfall has always lit every window.",
 choices:[{t:"A great feast for the whole city",cost:{food:15,gold:10},go:()=>{S.f.lanterns=S.month+1;fx({food:-15,gold:-10,favor:10});note("Held a great Midwinter feast.");return "Every window burns. You dance with Elinor in the square, badly. Nobody minds."}},
  {t:"A simple feast in the hall",cost:{food:5},go:()=>{fx({food:-5,favor:3});return "Candles, bread, and the old songs."}},
  {t:"\"We can't afford it this year.\"",go:()=>{fx({favor:-5});return "The windows stay dark. It's a very long night."}}]},
/* ---- JANUARY ---- */
{m:11,who:"herald",req:()=>has("sentKing"),text:"Hear the word of King Osmund! The northern raiders are broken. The soldiers of Emberfall held the line at Saltmere, and the King names their lord a Champion of the Realm.",
 choices:[{t:"\"Bring my soldiers home.\"",go:()=>{fx({men:16,gold:30,favor:6});set("kingChampion");set("kingFavor");note("Named Champion of the Realm by King Osmund.");return "Sixteen of the twenty march back through the gate with royal silver in their packs."}}]},
{m:11,who:"herald",req:()=>has("kingAngry"),text:"The King's tax collector stands in your hall with a ledger and six guards. \"For refusing the King's call: thirty gold.\"",
 choices:[{t:"Pay",cost:{gold:30},go:()=>{fx({gold:-30});delete S.f.kingAngry;return "He counts every coin twice."}},
  {t:"\"Tell the King to come and collect it.\"",go:()=>{set("kingEnemy");fx({favor:4});note("Defied King Osmund's tax collector.");return "The hall cheers. Somewhere, a royal clerk writes your name on a list."}}]},
{m:11,who:"tobin",req:()=>(has("tobinPromise")||has("tobinEarn"))&&!has("tobinHostage"),text:"Tobin kneels in the cold chapel in his first real armor. It's too big. \"I'm ready, Father.\"",
 choices:[{t:"Knight him yourself",go:()=>{set("tobinKnight");fx({favor:4});note("Knighted Sir Tobin of Emberfall.");return "Your sword touches each shoulder. \"Rise, Sir Tobin.\" Elinor is crying. So, it turns out, are you."}},
  {t:"Ask Lord Harwin to knight him",req:()=>has("harwinAlly"),go:()=>{set("tobinKnight");set("harwinBound");note("Lord Harwin knighted Sir Tobin.");return "Harwin's old sword, Harwin's booming voice. \"Rise, Sir Tobin, friend of the Marches!\""}},
  {t:"\"Not this year.\"",go:()=>{S.bond.tobin=0;return "He stands up slowly, and walks out without a word."}}]},
{m:11,who:"vexenvoy",req:()=>has("tobinHostage")&&!has("freed"),text:"Gerrit, almost kindly. \"Your son is well, my lord. He's learning to read Vex's ledgers. He asks about you.\"",
 choices:[{t:"Send him a letter",go:()=>{S.bond.tobin++;return "You write three pages. Gerrit promises to deliver them unopened. You almost believe him."}}]},
{m:11,who:"peasant",text:"The winter cough is back, m'lord, worse in the cold. Children first, then the old folk.",
 choices:[{t:"Pay the physicians",cost:{gold:15},go:()=>{fx({gold:-15,favor:5});return "Hot broth, willow bark and clean blankets. Most of them pull through."}},
  {t:"Send for Morwen",agent:"witch",go:()=>{send("witch");fx({favor:3});set("witchHealed");return "Morwen walks through Thornby in the snow. The coughing stops behind her."}},
  {t:"Open the castle stores",cost:{food:10},go:()=>{fx({food:-10,favor:4});return "Warm bellies fight the cold better than prayers."}}]},
{m:11,who:"corvin",req:()=>has("corvinFight"),text:"\"The lords arrive for the council next month, cousin. Some of them are already drinking my wine.\" Corvin raises his cup to you.",
 choices:[{t:"Host a feast for the visiting lords",cost:{gold:30},go:()=>{fx({gold:-30});set("lordsFeasted");return "Your wine is better than his. The lords notice."}},
  {t:"Ride out to each lord yourself",cost:{food:8},go:()=>{fx({food:-8});set("lordsVisited");return "Two weeks in the snow, eleven halls, eleven handshakes."}},
  {t:"\"My year speaks for itself.\"",go:()=>"Corvin laughs. \"We'll see what it says.\""}]},
/* ---- FEBRUARY: the last month ---- */
{m:12,who:"aldric",text:"The last month of your first year, my lord. When the snow breaks, the lords gather for the Midwinter Council. Whatever they think of you, they'll say it then.",
 choices:[{t:"\"Then let's finish strong.\"",go:()=>{fx({favor:2});return "Aldric smiles. \"Your father used to say that. He rarely did.\""}},
  {t:"\"I need a drink first.\"",go:()=>"Aldric pours two."}]},
{m:12,who:"elinor",text:"Elinor finds you on the battlements, watching the snow. \"A year ago you told Aldric you never wanted this throne. Do you still feel that way?\"",
 choices:[{t:"\"I was wrong. I want it.\"",go:()=>{set("wantsThrone");fx({favor:2});return "She takes your arm. \"Good. So do they.\""}},
  {t:"\"Every single day.\"",go:()=>{S.bond.elinor++;return "\"That's why you're good at it,\" she says."}}]},
{m:12,who:"maren",req:()=>has("marenWed"),text:"A letter from the Marches, in Maren's hand. \"Edric's poems are getting better. Slightly. I'm happy, Father. Truly. Tell Tobin I can still beat him at chess.\"",
 choices:[{t:"Read it twice",go:()=>{fx({favor:2});return "You read it three times, actually."}}]},
{m:12,who:"morwen",req:()=>has("witchRealm")||has("morwenCourt"),text:"Morwen sits on your throne when you come in. She doesn't get up. \"The fen wants a lord, little lord. Give Emberfall to the green, and you'll rule a hundred years.\"",
 choices:[{t:"\"Then let it be the fen's.\"",go:()=>{set("witchThrone");note("Gave Emberfall to the fen.");return "She smiles, and the candles turn green, one by one."}},
  {t:"\"Get off my throne.\"",go:()=>{delete S.f.witchRealm;delete S.f.morwenCourt;set("morwenBanished");fx({favor:5});return "She does, slowly. \"You'll miss me, little lord.\""}}]},
/* ---- CHAPTER TWO: the Midwinter Crown ---- */
{m:6,who:"corvin",text:"\"Cousin! Corvin of Greymarch. I rode the moment I heard about the battle. And about dear Roderick, of course.\" He unrolls a parchment with a flourish. \"His will. He named me his heir. At Midwinter the eleven lords of the river meet here, as the old law says, to confirm a new lord's first year. Let them decide which of us it should be.\"",
 choices:[{t:"Welcome him as family",go:()=>{set("corvinGuest");set("corvinClaim");set("corvinFight");note("Lord Corvin arrived with a will naming him heir. The lords will decide at Midwinter.");setTimeout(()=>showTip("council"),600);return "He takes the best guest room, praises the wine, and writes eleven letters before supper. Aldric counts the silverware."}},
  {t:"Demand to see the will",go:()=>{set("willSeen");set("corvinClaim");set("corvinFight");note("Lord Corvin arrived with a will naming him heir. The lords will decide at Midwinter.");setTimeout(()=>showTip("council"),600);return "You read every line. It's your father's seal. You're almost sure it's not your father's hand."}},
  {t:"Throw him out of Emberfall",go:()=>{set("corvinEnemy");set("corvinClaim");set("corvinFight");fx({favor:2});S.lords=S.lords||{};note("Turned Lord Corvin away from the gate. The lords will decide at Midwinter.");setTimeout(()=>showTip("council"),600);return "\"As you wish, cousin.\" He smiles all the way to the gate. \"I'll tell the lords how warmly Emberfall greets its family.\""}}]},
{m:6,who:"wynn",req:()=>(has("vexDead")||has("vexWounded"))&&!hasClue("vexLetters"),text:"Sergeant Wynn drops a muddy chest at your feet. \"Vex's war chest, my lord, dragged out of the river. Silver, maps... and these.\" A bundle of letters, all sealed with a single letter: C.",
 choices:[{t:"Read every one",go:()=>{addClue("vexLetters");return "\"Strike before the harvest, and the ford is yours. The boy will not last the summer.\" No name. Just C. Someone wanted Vex to ruin you."}},
  {t:"Keep the silver, burn the rest",go:()=>{fx({gold:20});return "The letters curl in the fire. The silver goes in the strongbox. Aldric watches the ashes for a long time."}}]},
{m:6,who:"brannoc",req:()=>has("brannocTrap")&&!hasClue("brannoc"),text:"Brannoc, in chains, his face bruised from the night of the battle. \"You let me open that gate onto your spears. Clever boy. Go on, then. Ask me.\"",
 choices:[{t:"\"Who paid you to kill my father?\"",go:()=>{set("brannocJailed");addClue("brannoc");return "He laughs, then stops. \"Vex paid for the gate. Someone else paid for the old lord's wine. Rings from Greymarch on every finger. I never saw his face.\""}},
  {t:"Hang him at dawn",go:()=>{set("brannocExiled");fx({favor:3});return "He walks to the rope without a word. Whatever he knew, he takes with him."}}]},
/* ---- SEPTEMBER ---- */
{m:7,who:"herald",text:"Hear the word of King Osmund! Raiders burn the northern coast at Saltmere. Every lord owes the King soldiers or silver. What does Emberfall send?",
 choices:[{t:"Send 15 soldiers north",cost:{men:20},go:()=>{fx({men:-15});set("sentKing");note("Sent 15 soldiers to the King's war.");return "Fifteen soldiers march north under your banner. They'll be back by midwinter, if they come back."}},
  {t:"Pay 35 gold instead",cost:{gold:35},go:()=>{fx({gold:-35});set("kingPaid");set("kingFavor");return "\"The King will remember Emberfall's silver.\""}},
  {t:"Refuse",go:()=>{set("kingAngry");fx({favor:2});return "The herald writes your answer down very carefully."}}]},
{m:7,who:"ysolde",text:"Lady Ysolde of Saltmere, salt on her cloak. \"The raiders burned half my harbor. The King's men are slow. My people need grain to get through the winter, my lord, and I'll remember who sent it. At Midwinter, I mean.\"",
 choices:[{t:"Send 15 grain",cost:{food:15},go:()=>{fx({food:-15});set("ysoldeCharmed");note("Sent grain to Saltmere.");return "\"Emberfall feeds Saltmere,\" she says, and kisses both your cheeks. \"I won't forget it.\""}},
  {t:"\"Emberfall has its own winter coming.\"",go:()=>{set("ysoldeSnubbed");return "\"Of course.\" She is very polite on her way out. Too polite."}}]},
{m:7,who:"teague",text:"Lord Teague of the Coast Road, all rings and smiles. \"I'll be frank, my lord. My vote at Midwinter is a ship. It sails where the wind blows, and Corvin's wind smells of gold. Thirty gold would turn it around.\"",
 choices:[{t:"Pay him 30 gold",cost:{gold:30},go:()=>{fx({gold:-30});set("teaguePaid");note("Bought Lord Teague's vote.");return "\"A pleasure doing business.\" He bites one of the coins. You suspect he bites everything."}},
  {t:"\"I don't buy lords.\"",go:()=>{fx({favor:3});return "\"Then you'll lose them, my lord.\" Word of your answer gets around the market, and people like it."}}]},
/* ---- OCTOBER: the harvest feast ---- */
{m:8,who:"aldric",text:()=>`The harvest feast. Halfway through the toasts, ${has("boyPage")||has("pipSquire")?"Pip, your cupbearer, sips from your cup as a joke, and drops":"your cupbearer tastes your wine and drops"} like a stone. Purple lips. Aldric is white. "My lord... that's how your father looked."`,
 choices:[{t:"\"Seal the gates. No one leaves.\"",go:()=>{set("poisonHunt");fx({favor:-2});note("Someone tried to poison you at the harvest feast.");return has("boyPage")||has("pipSquire")?"Pip lives, barely: he only sipped. The guests grumble all night behind locked gates. Corvin grumbles loudest.":"The cupbearer lives, barely. The guests grumble all night behind locked gates. Corvin grumbles loudest."}},
  {t:"Hush it up. Carry on with the feast.",go:()=>{set("poisonQuiet");note("Someone tried to poison you at the harvest feast.");return "The music starts again. You don't drink anything else that night. Somebody in your hall is very disappointed."}}]},
{m:8,who:"corvin",req:()=>has("corvinClaim")&&!has("marenWed")&&!has("marenGone")&&famHere("maren"),text:"\"Cousin, let's be sensible. Marry Maren to my son Aldous. Join our claims, and I'll burn this will in your own fireplace. No vote, no council, no unpleasantness.\"",
 choices:[{t:"Agree",go:()=>{set("corvinPact");delete S.f.corvinFight;S.bond.maren=0;note("Promised Maren to Corvin's son to end his claim.");return "Corvin beams. Maren hears the news from a servant and doesn't come down to dinner."}},
  {t:"\"Never.\"",go:()=>"\"Then the lords will decide.\" He leaves smiling. He's always smiling."}]},
/* ---- NOVEMBER ---- */
{m:9,who:"rhun",text:"Lord Rhun of the Hills, old and broad, leaning on a sword he no longer needs. \"I fought beside your father at Saltmere. Forty years. Tell me true, boy: did Roderick die in his sleep?\"",
 choices:[{t:"\"No. He was murdered.\"",go:()=>{if(clueCount()>=2){set("rhunTold");note("Told Lord Rhun the truth about your father.");return "You show him what you've found. He reads it twice, very slowly. \"Then I know how I'll vote. And I'll be watching your cousin.\""}return "\"Murdered? By whom?\" You have suspicions, not proof. \"Find me proof, and you'll have my vote.\""}},
  {t:"\"So they tell me.\"",go:()=>"He looks at you for a long moment. \"Your father would have looked harder.\""}]},
{m:9,who:"anselm",text:"Bishop Anselm, in purple, with Brother Cuthbert one step behind. \"The church will vote at Midwinter with its conscience, my lord. My conscience is troubled by the state of the abbey bell tower.\"",
 choices:[{t:"Pay for the bell tower",cost:{gold:25},go:()=>{fx({gold:-25,favor:3});set("anselmWon");return "The bells ring for an hour the day the scaffolding comes down. The Bishop's conscience is greatly eased."}},
  {t:"\"The church shouldn't sell its vote.\"",go:()=>{if(has("church")&&!has("churchAngry"))return "\"Quite right,\" says the Bishop, unexpectedly. \"You've already been generous to the abbey. I simply wanted to see if you'd say it.\"";set("churchAngry");return "Cuthbert winces. The Bishop's smile doesn't move at all."}}]},
/* ---- DECEMBER ---- */
{m:10,who:"corvin",req:()=>has("corvinClaim")&&!has("corvinPact"),text:"\"The Longest Night is nearly here, cousin, and the lords arrive soon after. My honor guard has ridden in from Greymarch. Forty good men. Surely they can sleep inside the walls? It's so very cold.\"",
 choices:[{t:"Let them in",go:()=>{set("corvinGuardIn");return "Forty men in Greymarch grey file through your gate. Wynn counts them twice. They count your soldiers too."}},
  {t:"\"They can camp by the river.\"",go:()=>{fx({favor:1});return "\"How hospitable.\" Corvin's men pitch their tents in the snow below the walls, and glare at the gate all night."}}]},
{m:10,who:"ulric",req:()=>!hasClue("apothecary")&&(clueCount()>=3||has("spy")),text:"A thin, shaking man in a Greymarch apothecary's apron, smuggled in under a cart of turnips. \"Master Ulric, my lord. Lord Corvin bought nightshade from me twice: once before your father died, and once this autumn. He'll kill me next. Please.\"",
 choices:[{t:"Grant him sanctuary",go:()=>{set("ulricSafe");addClue("apothecary");note("Master Ulric, Corvin's apothecary, asked for sanctuary.");return "Aldric hides him in the treasury vault, with a candle, a blanket and a very large guard."}},
  {t:"\"Why should I trust you?\"",go:()=>{if(has("spy")){addClue("apothecary");set("ulricSafe");return "The Whisper steps out of the shadows. \"He's telling the truth, my lord. I've watched his shop for a month.\""}return "He weeps and swears on everything he can think of. By morning he's fled. You'll never know."}}]},
/* ---- JANUARY ---- */
{m:11,who:"garrick",req:()=>has("corvinClaim")&&!has("garrickTurned")&&(has("corvinCaught")||has("coupFoiled")),text:"Lord Garrick of the North Road, gruff and uneasy. \"Corvin's been my friend for thirty years. But I hear he was caught creeping about your castle at night. Tell me what's going on in this house, my lord.\"",
 choices:[{t:"Tell him everything you know",go:()=>{if(clueCount()>=3){set("garrickTurned");return "He listens to every word, and goes grey. \"Thirty years,\" he says. \"Thirty years I called that man my friend.\""}return "He listens. \"That's a lot of suspicion and not much proof, my lord.\" He leaves unconvinced."}},
  {t:"\"Ask your friend.\"",go:()=>"\"I will,\" he says, and you can see that he will."}]},
/* ---- The Fox: what happens to the bread thief you had flogged in May ---- */
{m:6,who:"peasant",req:()=>has("harsh"),text:"Bandits hit the Thornby road last week, m'lord. Folk say their leader's a skinny lad with flogging scars on his back. Calls himself the Fox.",
 choices:[{t:"Send the Marshal after him",agent:"general",go:()=>{send("general");if(roll(.5)){set("foxCaught");fx({favor:5});note("The Marshal caught the Fox.");return "Your Marshal drags him back in chains. It's Pip. The boy who stole bread in May. He doesn't say a word."}set("foxBold");return "Your Marshal finds an empty camp and a rude message scratched into a tree."}},
  {t:"Post a bounty",cost:{gold:10},go:()=>{fx({gold:-10});set("foxBounty");return "Wanted posters go up on every tavern door. Someone draws a moustache on his."}},
  {t:"\"Bandits come and go.\"",go:()=>{set("foxBold");fx({favor:-3});return "Hob looks at his boots. \"If you say so, m'lord.\""}}]},
{m:8,who:"merchant",req:()=>has("harsh")&&!has("foxCaught"),text:"My lord! The Fox has blockaded the salt road with forty men. My wagons sit idle in the rain. He'll let them pass for 30 gold. Every month.",
 choices:[{t:"Pay him this once",cost:{gold:30},go:()=>{fx({gold:-30});set("foxPaid");return "The wagons roll. Osric glares at you as if this were your fault. It is, a little."}},
  {t:"Send the Whisper to find his camp",agent:"spy",go:()=>{send("spy");set("foxFound");return "\"Old mill on the Ashwood creek,\" the Whisper reports. \"Forty men, two cooks, and one very nervous boy.\""}},
  {t:"Send the Marshal to break the blockade",agent:"general",go:()=>{send("general");if(roll(.4)){set("foxCaught");fx({men:-2,favor:4});note("Broke the Fox's blockade.");return "A hard fight in the rain. The blockade breaks, and the Fox is taken alive."}fx({men:-5});set("foxBlockade");return "The Fox melts into the forest. Five of your soldiers don't come back. The road stays shut. (−5 gold a month)"}},
  {t:"Refuse to deal with bandits",go:()=>{set("foxBlockade");return "The salt road stays closed. Trade withers. (−5 gold a month until it's settled)"}}]},
{m:10,who:"pip",req:()=>has("harsh")&&!has("foxCaught"),text:"A thin young man walks into your hall under a white rag. The scars on his back show through his shirt. \"Remember me, my lord? You had me flogged for a loaf of bread. I'm the Fox now. I want a pardon. And a job. Or the castle granary burns this winter.\"",
 choices:[{t:"Pardon him and make him a scout",go:()=>{set("foxPardoned");delete S.f.foxBlockade;fx({men:6,favor:-2});note("Pardoned the Fox and took his men into service.");return "He kneels. His forty become your scouts. Brannoc's old guards mutter about it for weeks."}},
  {t:"Arrest him, here and now",go:()=>{if(has("foxFound")){set("foxCaught");delete S.f.foxBlockade;fx({favor:5});return "His camp was already surrounded, thanks to the Whisper. The Fox's men surrender without a fight."}set("foxCaught");delete S.f.foxBlockade;fx({food:-20,favor:2});return "You have him. That night, his men burn half the castle granary in revenge."}},
  {t:"Apologize, and pay him to go",cost:{gold:25},go:()=>{fx({gold:-25,favor:2});delete S.f.foxBlockade;set("foxGone");return "\"An apology,\" he says, \"from a lord.\" He takes the gold, and something else you can't name, and goes."}}]},
];
/* everyday petitions: s = season ("any" fits all). One or two are mixed into each month. */
const R=[
 {s:"any",who:"widow",text:"Wolves took my goats, m'lord. Will you send hunters?",choices:[
  {t:"Send hunters",cost:{men:2},go:()=>{fx({favor:4});return "The pelts hang in the square by nightfall."}},{t:"Send the Marshal",agent:"general",go:()=>{send("general");fx({favor:6});return "Your Marshal rides out personally. The widow tells everyone in Thornby for a year."}},{t:"\"Buy a dog.\"",go:()=>{fx({favor:-2});return "She mutters something unrepeatable."}}]},
 {s:"any",who:"merchant",text:"A shipment of fine southern wine, my lord. For the lord's table. 10 gold.",choices:[
  {t:"Buy it",cost:{gold:10},go:()=>{fx({gold:-10,favor:2});return "The feast is merrier."}},{t:"Pass",go:()=>"\"Your loss.\""}]},
 {s:"any",who:"peasant",text:"The bridge at Thornby is rotting. Wagons can't cross to market.",choices:[
  {t:"Repair it",cost:{gold:12},go:()=>{fx({gold:-12,food:8});return "Trade flows again."}},{t:"Later",go:()=>{fx({favor:-2});return "Hob nods, unconvinced."}}]},
 {s:"any",who:"brannoc",req:()=>warHost()==="brannoc",text:"Two of the guards were drunk on watch. What punishment?",choices:[
  {t:"Extra night watches",go:()=>{fx({favor:-1});return "Nobody drinks on watch again."}},{t:"Dock their pay",go:()=>{fx({gold:3});return "Grumbles, but they understand."}}]},
 {s:"spring",who:"peasant",text:"Lambing's come early, m'lord, and half the ewes are sickly. Buy healthy stock from the Marches?",choices:[
  {t:"Buy the flock",cost:{gold:12},go:()=>{fx({gold:-12,food:10});return "Fat lambs by summer."}},{t:"Make do",go:()=>"\"We'll say a word over 'em, then.\""}]},
 {s:"spring",who:"cuthbert",text:"Pilgrims are coming for the spring blessing, my lord. They'll need beds and bread.",choices:[
  {t:"Host them",cost:{food:6},go:()=>{fx({food:-6,favor:5,gold:4});return "They leave coins in the abbey box, and good words on the road."}},{t:"Send them on",go:()=>{fx({favor:-2});return "\"The next town will be glad of them, I'm sure.\""}}]},
 {s:"summer",who:"widow",text:"The well in Thornby's gone dry in the heat, m'lord.",choices:[
  {t:"Dig a new well",cost:{gold:10},go:()=>{fx({gold:-10,favor:5});return "Cold water, and a blessing on your name."}},{t:"\"Haul it from the river.\"",go:()=>{fx({favor:-4});return "It's a long walk with a bucket."}}]},
 {s:"summer",who:"merchant",text:"A spice caravan wants to trade, my lord. Grain for silver, at a fair price.",choices:[
  {t:"Sell 10 grain",cost:{food:10},go:()=>{fx({food:-10,gold:18});return "Silver jingles in the treasury."}},{t:"Keep our grain",go:()=>"\"Grain doesn't jingle, my lord.\""}]},
 {s:"summer",who:"cuthbert",text:"The Feast of Embers approaches, my lord. The people would love a festival.",choices:[
  {t:"Hold a festival",cost:{food:8},go:()=>{S.f.lanterns=S.month+1;fx({food:-8,favor:7});return "Lanterns fill the square. There is dancing until dawn."}},{t:"No",go:()=>"\"A quiet feast, then.\""}]},
 {s:"autumn",who:"peasant",text:"The apple orchards are groaning, m'lord. If the castle buys our cider, we'll press it all.",choices:[
  {t:"Buy the cider",cost:{gold:8},go:()=>{fx({gold:-8,favor:5});return "The whole city smells of apples for a month."}},{t:"No thank you",go:()=>"\"The pigs will enjoy it, then.\""}]},
 {s:"autumn",who:"widow",text:"Travelers from the south say there's sickness on the roads, m'lord. Should we close the gates to strangers?",choices:[
  {t:"Close the gates",go:()=>{fx({gold:-4,favor:2});return "Trade slows. So does the sickness."}},{t:"Send Morwen to meet the travelers",agent:"witch",go:()=>{send("witch");fx({favor:4});return "She checks every traveler at the gate with a sprig of rue. Nobody gets sick. Nobody asks how."}},{t:"Keep them open",go:()=>{fx({gold:4});return "Business as usual. Fingers crossed."}}]},
 {s:"autumn",who:"merchant",text:"Grain prices are high in the cities this autumn, my lord. I'll buy 15 sacks for 25 gold.",choices:[
  {t:"Sell 15 grain",cost:{food:15},go:()=>{fx({food:-15,gold:25});return "\"A pleasure, as ever.\" You hope you won't miss it in February."}},{t:"Keep the grain",go:()=>"\"Winter is long, I suppose.\""}]},
 {s:"winter",who:"widow",text:"The wolves came down from the hills last night, m'lord. Two sheep and a dog.",choices:[
  {t:"Send soldiers",cost:{men:4},go:()=>{fx({favor:5});return "Four wolf pelts by the end of the week."}},{t:"Offer a bounty",cost:{gold:8},go:()=>{fx({gold:-8,favor:3});return "Every boy in Thornby is suddenly a wolf hunter."}}]},
 {s:"winter",who:"peasant",text:"The cold's cracked the mill wheel, m'lord. No flour till it's mended.",choices:[
  {t:"Pay for a new wheel",cost:{gold:12},go:()=>{fx({gold:-12,food:6});return "The mill turns again by the end of the week."}},{t:"\"Grind by hand.\"",go:()=>{fx({favor:-3,food:-4});return "Sore arms and short tempers all winter."}}]},
 {s:"winter",who:"cuthbert",req:()=>!has("witchRealm"),text:"The poor are freezing in the lower town, my lord. The abbey can take them in, if the castle sends firewood.",choices:[
  {t:"Send firewood",cost:{gold:8},go:()=>{fx({gold:-8,favor:6});return "The abbey floor is covered in sleeping families, warm for the first time in weeks."}},{t:"\"We need it ourselves.\"",go:()=>{fx({favor:-4});return "Cuthbert opens the abbey anyway, and burns the pews."}}]},
 {s:"spring",who:"mason",text:"The thaw has cracked the east wall, my lord. I can mend it now, or wait for summer when stone is cheaper.",choices:[
  {t:"Mend it now",cost:{gold:10},go:()=>{fx({gold:-10,favor:2});return "\"Done before the rains. You'll thank me.\""}},{t:"Wait for summer",go:()=>{if(roll(.5)){fx({gold:-4,favor:-3});return "The April rain brings down a whole section onto the cobbler's shed. Hildra says nothing, very loudly."}return "It holds. Hildra sniffs, as if the wall has let her down."}}]},
 {s:"spring",who:"tobin",req:()=>famHere("tobin"),text:"Father, I found a hawk chick under the east tower. Its wing is broken. Can I keep it? I'll feed it myself, I swear!",choices:[
  {t:"\"Keep it. It's your hawk.\"",go:()=>{S.bond.tobin++;note("Tobin raised a hawk.");return "He names it Thunder. It's mostly feathers and fury, and it follows him everywhere by midsummer."}},{t:"\"Give it to the falconer.\"",go:()=>{fx({favor:1});return "The falconer is delighted. Tobin is not."}}]},
 {s:"spring",who:"peasant",text:"Thornby wants to hold a spring fair, m'lord. We'd need a charter from the castle, and a little bread for the poor.",choices:[
  {t:"Grant the charter",cost:{food:4},go:()=>{fx({food:-4,gold:6,favor:3});return "Ribbons, pies, a greased pig and three fistfights. Everyone agrees it was the best fair in years."}},{t:"Not this year",go:()=>{fx({favor:-2});return "\"Next year, then,\" Hob says, to his hat."}}]},
 {s:"summer",who:"maren",req:()=>famHere("maren"),text:"Father, a painter from the south wants to paint my portrait. For the suitors, he says. It's 15 gold, but it would be beautiful.",choices:[
  {t:"Pay the painter",cost:{gold:15},go:()=>{S.bond.maren++;fx({gold:-15,favor:1});return "The painting is too flattering by half. Maren hangs it in the hall where every visitor has to walk past it."}},{t:"\"A sketch will do.\"",go:()=>"She rolls her eyes so hard you can almost hear it."}]},
 {s:"summer",who:"cuthbert",text:"Hail flattened the abbey's barley, my lord. The brothers will go hungry until harvest.",choices:[
  {t:"Send them grain",cost:{food:8},go:()=>{fx({food:-8,favor:4});return "The abbey bells ring an extra hour in your honor."}},{t:"\"Pray harder.\"",go:()=>{fx({favor:-3});set("churchAngry");return "Brother Cuthbert's sermon on Sunday is about the camel and the eye of the needle. Everyone knows who it's about."}}]},
 {s:"summer",who:"merchant",text:"A travelling menagerie wants to perform in the square, my lord. A real bear! They'll pay the crown 6 gold.",choices:[
  {t:"Let them perform",go:()=>{if(roll(.25)){fx({gold:2,favor:-3});return "The bear gets loose and eats the mayor's prize cabbages. It's very funny for everyone except the mayor."}fx({gold:6,favor:3});return "Children follow the bear around for days. So do several adults."}},{t:"No bears",go:()=>"\"Your loss, my lord. It dances.\""}]},
 {s:"autumn",who:"peasant",text:"The harvest's ripe, m'lord, but there aren't enough hands to bring it in before the rain. Can your soldiers help?",choices:[
  {t:"Send the soldiers",go:()=>{fx({food:12,favor:3});return "Soldiers with scythes. The sheaves are in before the first drop falls."}},{t:"\"Soldiers aren't farmhands.\"",go:()=>{fx({food:4,favor:-2});return "Half the barley rots in the fields."}}]},
 {s:"autumn",who:"elinor",req:()=>famHere("tobin"),text:"A scholar from the Royal College is passing through. He'd stay the winter and teach Tobin his letters, for 12 gold.",choices:[
  {t:"Hire him",cost:{gold:12},go:()=>{S.bond.tobin++;S.bond.elinor++;fx({gold:-12});return "Tobin complains bitterly, then starts reading everything in the library. Elinor is smug about it."}},{t:"\"He can learn swordplay instead.\"",go:()=>"Elinor gives you a long look and says nothing at all."}]},
 {s:"winter",who:"cuthbert",text:"The poor of Thornby are freezing, my lord. Open the great hall to them on the coldest nights?",choices:[
  {t:"Open the hall",cost:{food:6},go:()=>{fx({food:-6,favor:6});return "Straw on the floor, soup in the pot, and forty people singing around your fire."}},{t:"\"The hall is for guests.\"",go:()=>{fx({favor:-4});return "Two old men are found frozen behind the tannery. People remember."}}]},
 {s:"winter",who:"aldric",text:"My lord, I've found a hole in the ledgers. A clerk has been skimming. Nine gold, at least.",choices:[
  {t:"Dismiss him",go:()=>{fx({gold:5});return "He leaves in disgrace, and leaves most of the money behind."}},{t:"Send the Whisper to dig deeper",agent:"spy",go:()=>{send("spy");fx({gold:14});return "The clerk had a partner in the Guild. Between them, they give back fourteen gold, quite quickly."}},{t:"Forgive him",go:()=>{fx({favor:1});return "He weeps and promises. Aldric watches him like a hawk."}}]},
 {s:"any",who:"widow",text:"My boy wants to join your guard, m'lord. He's fifteen and strong as an ox, and he eats like one too.",choices:[

 S.queue=E.map((e,i)=>i).filter(i=>E[i].m===S.month);
 if(S.month!==BATTLE_MONTH&&S.month!==12){const se=SEASON(S.month);const pool=R.map((r,i)=>i).filter(i=>(R[i].s===se||R[i].s==="any")&&!S.usedR.includes(i));
  for(let k=0;k<(S.month<=4?3:2)&&pool.length;k++){const j=pool.splice(Math.floor(Math.random()*pool.length),1)[0];if(R[j].req&&!R[j].req()){k--;continue}S.usedR.push(j);S.queue.splice(Math.min(S.queue.length,1+k*2),0,"r"+j)}}
 {const isAg=q=>typeof q==="number"&&WHO_AGENT[E[q].who];S.queue=[...S.queue.filter(isAg),...S.queue.filter(q=>!isAg(q))]}
 if((S.unrest||0)>=2&&S.month!==BATTLE_MONTH)S.queue.unshift("riot");
 S.qi=0}

function next(){

 const burst=(col,n,up)=>{for(let i=0;i<n;i++)part({x:px+(Math.random()-.5)*10,y:84,vx:(Math.random()-.5)*1.2,vy:up?-.6-Math.random():-1.4-Math.random(),grav:up?0:.06,life:50,max:50,col,sz:Math.random()<.4?2:1})};

let TY=null;
/* Text never scrolls: a long speech is split into pages that fit the box. Tap to finish a page, tap again for the next. */
let MEAS=null;
function pageHeight(){const el=$("txt");if(LANDSCAPE.matches)return el.clientHeight;const d=$("dialog");return Math.max(90,d.clientHeight-150)}
function paginate(str){const el=$("txt"),H=pageHeight();if(!(H>24)||!el.clientWidth)return[str];
 if(!MEAS){MEAS=document.createElement("div");MEAS.setAttribute("aria-hidden","true");document.body.appendChild(MEAS)}
 const cs=getComputedStyle(el);MEAS.style.cssText=`position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre-line;width:${el.clientWidth}px;font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};letter-spacing:${cs.letterSpacing};font-weight:${cs.fontWeight};font-style:${cs.fontStyle};padding:${cs.paddingTop} ${cs.paddingRight} ${cs.paddingBottom} ${cs.paddingLeft}`;
 const fits=t=>{MEAS.textContent=t.trimEnd()+" ▼";return MEAS.offsetHeight<=H+1};
 if(fits(str))return[str];
 const words=str.match(/\S+\s*/g)||[str],pages=[];let cur="";
 for(const w of words){if(cur&&!fits(cur+w)){
   // prefer to break after the last full sentence on this page
   const m=cur.match(/^([\s\S]*[.!?…]["”’)]?\s+)(\S[\s\S]*)$/);
   if(m&&m[1].length>cur.length*.45){pages.push(m[1].trimEnd());cur=m[2]+w}else{pages.push(cur.trimEnd());cur=w}}
  else cur+=w}
 if(cur.trim())pages.push(cur.trimEnd());return pages}
function typeText(str,voice,done){const el=$("txt");el.classList.remove("tight","tight2","more");
 if(LANDSCAPE.matches)str=str.replace(/\n\n+/g,"\n");
 if(TY)clearTimeout(TY.to);TY={str,done,voice,pages:paginate(str),pi:0,waiting:false};
 if(FAST||PREF.speed==="instant")return showPage(true);
 typePage()}
function typePage(){const T=TY;if(!T)return;const el=$("txt"),page=T.pages[T.pi],SP=SPEEDS[PREF.speed]||1;let i=0;
 el.classList.remove("more");el.textContent="";SC.talk=true;T.waiting=false;T.typing=true;
 const step=()=>{if(TY!==T)return;i++;el.textContent=page.slice(0,i);const ch=page[i-1];
  if(i%2===0&&/\w/.test(ch))SFX.blip(T.voice);
  if(i>=page.length)return showPage();
  T.to=setTimeout(step,(/[.!?]/.test(ch)&&page[i]===" "?160:/[,;:]/.test(ch)?70:17)*SP)};
 step()}
/* show the whole current page; on the last page hand over to the choices */
function showPage(instant){const T=TY;if(!T)return;clearTimeout(T.to);T.typing=false;const el=$("txt");el.textContent=T.pages[T.pi];SC.talk=false;
 if(T.pi<T.pages.length-1){T.waiting=true;el.classList.add("more");if(instant&&FAST){T.pi++;return showPage(true)}return}
 el.classList.remove("more");const d=T.done;TY=null;d&&d()}
function advanceType(){const T=TY;if(!T)return;if(T.typing)return showPage();if(T.waiting){SFX.page&&SFX.page();T.pi++;typePage()}}
/* jump straight to the end (used when skipping) */
function finishType(){const T=TY;if(!T)return;T.pi=T.pages.length-1;showPage()}

function ensureState(){S.doneScenes=S.doneScenes||[];S.tax=S.tax||"normal";S.bond=S.bond||{elinor:0,maren:0,tobin:0};S.night=S.night||{};S.done=S.done||[];S.b=S.b||{};S.usedR=S.usedR||[]}
function leader(){return has("tobinKnight")&&!has("tobinHostage")?"Sir Tobin":has("brannocJailed")||has("brannocExiled")||has("brannocAway")?"Sergeant Wynn":"Captain Brannoc"}
function chance(id,n){const M=MISSIONS[id];return Math.max(5,Math.min(95,M.base+n*M.per+(has("tobinKnight")?10:0)-(agentFree("general")?0:10)))}
function ledgerRows(){ensureState();const b=S.b,se=SEASON(S.month),T=TAX[S.tax],au=se==="autumn",wi=se==="winter";
 const tax=Math.round((5+S.favor/6)*T.mult)+(b.market?7:0)-(has("guildEnemy")?4:0);
 const fox=has("foxBlockade")?5:0,lands=has("vexLands")?(has("landsHarsh")?16:10):0,tithe=has("vassal")&&!has("freed")?Math.round(tax*.3):0,wood=wi&&!has("firewood")?4:0;
 const wages=Math.ceil(S.men/10)*3;
 const crops={spring:4,summer:7,autumn:28,winter:0}[se]+(has("fedThornby")?(au?12:3):has("halfThornby")?(au?5:1):0)-(has("refusedThornby")&&au?6:0)+(b.granary?5:0)-(has("witchCurse")?3:0);
 const eat=Math.ceil(S.men/6)+4+(wi?2:0),mood=(b.chapel?2:0)+(b.infirmary?1:0)+T.fav-(has("landsHarsh")?1:0)-(S.favor>80?4:S.favor>60?2:0)-(S.month>=3?1:0)-(wi?1:0);
 return{tax,lands,tithe,wood,wages,crops,eat,mood,fox,gold:tax+lands-tithe-wood-wages-fox,food:crops-eat}}
function endMonth(){
 ensureState();
 if(S.month===BATTLE_MONTH)return siege();
 if(S.month===12){const L=ledgerRows();LAST={};fx({gold:L.gold,food:L.food,favor:L.mood});render();save();if(fail())return;return finale()}
 const L=ledgerRows();LAST={};fx({gold:L.gold,food:L.food,favor:L.mood});render();
 S.unrest=Math.max(0,Math.min(3,(S.unrest||0)+(S.favor<30?1:-1)+(S.tax==="high"?1:0)));
 S.lastLedger=L;S.night={};S.usedN=S.usedN||[];
 S.night.req=SCENES.filter(sc=>(!sc.m||sc.m.includes(S.month))&&(!sc.when||sc.when())&&!speakerAway(sc.who)&&!S.doneScenes.includes(sc.id)).slice(0,3).map(sc=>sc.id);S.night.reqDone={};
 const busy=new Set(S.night.req.map(id=>SCENES.find(x=>x.id===id).room));S.night.evs=[];S.night.evDone={};
 const want=Math.random()<.5?1:2;for(let k=0;k<want;k++){const pool=NIGHT_EVENTS.map((_,i)=>i).filter(i=>(!NIGHT_EVENTS[i].when||NIGHT_EVENTS[i].when())&&!speakerAway(NIGHT_EVENTS[i].who)&&!S.usedN.includes(i)&&!busy.has(NIGHT_EVENTS[i].room));
  if(!pool.length)break;const i=pool[Math.floor(Math.random()*pool.length)];S.usedN.push(i);S.night.evs.push(i);busy.add(NIGHT_EVENTS[i].room)}
 CS.season=SEASON(S.month);setPhase("night");Music.play("night");SFX.toll();
 showNight("hub");
}
function resBar(){return `<div class="resbar">${["gold","food","men","favor"].map(k=>`<div><img class="px" src="${ICONURL[k]}" alt="">${S[k]}</div>`).join("")}</div>`}
function money(v){return (v>=0?"+":"−")+Math.abs(v)}
function roomStatus(id){const N=S.night||{};
 if((N.req||[]).some(k=>!N.reqDone[k]&&SCENES.find(x=>x.id===k).room===id))return"req";
 if((N.evs||[]).some(i=>NIGHT_EVENTS[i].room===id&&!N.evDone[i]))return"ev";
 if(id==="family"&&!N.visited&&famHasNews())return"ev";
 return(N.seen&&N.seen[id])||{war:!!S.mission,mason:!!N.built,family:!!N.visited}[id]?"done":""}
function showNight(){
 ensureState();const N=S.night,req=(N.req||[]).map(id=>SCENES.find(x=>x.id===id)),left=req.filter(sc=>!N.reqDone[sc.id]),leftRooms=[...new Set(left.map(sc=>sc.room))],mis=S.mission;
 SC.room=null;SC.cast=[];SC.walker=null;SC.speaker=null;SC.emote=null;clearDialog();setCastle("map");
 const tiles=[
  ["treasury",ICONURL.gold,"Treasury",S.food<25?"Grain is running low. The Guild sells grain here.":`Taxes: ${TAX[S.tax].n}. Next month ${money(ledgerRows().gold)} gold.`],
  ["war",ICONURL.men,"War Room",mis?`${mis.n} soldiers out: ${MISSIONS[mis.id].n.toLowerCase()}.`:`${leader()} awaits orders.`],
  ["mason",HAMMERURL,"Mason's Yard",N.built?`Building the ${BUILD[N.built].n}.`:"Hildra is ready to build."],
  ["family",ICONURL.favor,"Family Quarters",N.visited?`You spent the evening with ${C[N.visited].n.replace("Lady ","")}.`:"Your family is still awake."]];
 if(has("brannocJailed"))tiles.push(["dungeon",KEYURL,"Dungeon",has("brannocExiled")?"An empty cell.":"Brannoc waits in chains."]);
 const body=`<h3>Night falls on Emberfall</h3><p class="dim" style="margin-top:0">The end of ${MONTHS[S.month-1]}. ${req.length?`${["","One matter needs","Two matters need","Three matters need"][req.length]} you tonight. Tap a room to go there.`:"Nothing urgent tonight. Wander the castle, or go straight to bed."}</p>
   <div class="rooms">${tiles.map(([id,ic,n,st])=>{const k=roomStatus(id);return `<button class="room${k==="done"?" done":k==="req"?" story":k==="ev"?" ev":""}" onclick="enterRoom('${id}')"><span class="rh"><img class="px" src="${ic}" alt=""><b>${n}</b>${k==="req"?'<em class="bang gold">!</em>':k==="ev"?'<em class="bang">!</em>':k==="done"?'<em>✓</em>':""}</span><small>${k==="req"?"<b class='must'>A matter that can't wait.</b>":k==="ev"?"Something is happening here tonight.":st}</small></button>`}).join("")}</div>
   <p class="dim">${S.food<15?"The granary is nearly empty, my lord.":S.gold<10?"The treasury is nearly bare, my lord.":S.favor<20||(S.unrest||0)>=1?"There is angry muttering in the taverns.":S.month===4?(has("knelt")?"Vex's riders are coming to collect your oath.":"Scouts say Vex's army is on the march."):"Emberfall sleeps."}</p>
   ${left.length?`<p class="must">Before you sleep: ${leftRooms.map(r=>ROOMNAME[r]).join(", ")}.</p>`:""}<button class="pb" id="nextBtn" ${left.length?"disabled":""}>Sleep until ${MONTHS[S.month]}</button>`;
 overlay(`${castleHTML()}</div><div class="ovb">${resBar()}${councilHTML()}${body}</div>`);
 setTimeout(()=>showTip("night"),300);
 const cv=$("castle");cv.classList.add("map");cv.onclick=mapTap;
 $("nextBtn").onclick=()=>{if((S.night.req||[]).some(id=>!S.night.reqDone[id]))return;if(S.month>=FREE_MONTHS&&!PRO)return paywall(()=>{showNight();setTimeout(()=>$("nextBtn").click(),FAST?0:300)});SFX.click();closeOverlay();if(fail())return;S.month++;S.night={};const war=S.month===BATTLE_MONTH;
  setPhase(war?"dusk":"day",SEASON(S.month));Music.play(war?"battle":dayTrack());monthCard(()=>missionReport(()=>{buildMonth();next()}))};
}
