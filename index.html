function clearDialog(){PCHAR=null;$("pbox").style.display="";$("who").textContent="";$("role").textContent="";$("choices").innerHTML="";$("txt").className="";$("txt").textContent=""}
function roomCast(id){const N=S.night,list=ROOMS[id].cast();
 const add=k=>{if(!list.some(m=>m[0]===k))list.unshift([k,(list.length?Math.min(...list.map(m=>m[1])):134)-22])};
 (N.req||[]).map(k=>SCENES.find(x=>x.id===k)).filter(sc=>sc.room===id&&!N.reqDone[sc.id]).forEach(sc=>{add(sc.who);(sc.with||[]).forEach(add)});
 return list.map(([k,x])=>({k,x,dir:-1}))}
function enterRoom(id){
 const N=S.night;if(!N||!N.reqDone||(id==="dungeon"&&!has("brannocJailed")))return;
 SFX.click();closeOverlay();N.seen=N.seen||{};N.seen[id]=1;save();
 SC.room=id;SC.fade=1;SC.emote=null;SC.parts=[];SC.speaker=null;SC.cast=roomCast(id);
 clearDialog();$("txt").className="wait";$("txt").textContent=`You make your way to ${ROOMS[id].title}...`;
 SC.door=0;SC.doorT=1;SFX.door();
 SC.walker={c:C.lord,x:14,dir:1,target:ROOMS[id].stand||58,frame:0,dist:0,waitDoor:true,arrive:()=>{SC.doorT=0;setTimeout(()=>SFX.thud(),150);roomStep()}};
}
function speak(k,text,done){if(typeof text==="function")text=text();const c=k?C[k]:null;SC.speaker=k;PCHAR=c;$("pbox").style.display=c?"":"none";
 $("who").textContent=c?c.n:ROOMNAME[SC.room];$("role").textContent=c?c.r:"Tonight";$("txt").className="";$("choices").innerHTML="";
 typeText(text,c?c.voice:190,done)}
function choiceBtn(o,i,fn){const b=document.createElement("button");b.className="ch";b.style.animationDelay=i*70+"ms";
 b.innerHTML=o.t+(o.cost?`<span class="cost">${Object.entries(o.cost).map(([k,v])=>`<span><img class="px" src="${ICONURL[k]}">−${v}</span>`).join("")}${can(o)?"":"<span>(not enough)</span>"}</span>`:"")+(o.agent?(setTimeout(()=>showTip("agents"),400),"")+`<span class="cost agent">${agentFree(o.agent)?`${AGENTS[o.agent].role}: ${AGENTS[o.agent].name()} · away until next month`:`${AGENTS[o.agent].name()} is away`}</span>`:"");
 b.disabled=!can(o)||!!o.off;b.onclick=fn;return b}
function goBtn(label,fn){const b=document.createElement("button");b.className="ch go";b.textContent=label;b.onclick=()=>{SFX.click();$("choices").innerHTML="";fn()};$("choices").appendChild(b)}
function roomStep(){
 const id=SC.room,N=S.night;if(!id)return;
 const sc=(N.req||[]).map(k=>SCENES.find(x=>x.id===k)).find(sc=>sc.room===id&&!N.reqDone[sc.id]);
 if(sc)return matter(sc.who,sc.text,sc.choices,c=>{N.reqDone[sc.id]=c.go();S.doneScenes.push(sc.id);return N.reqDone[sc.id]});
 const i=(N.evs||[]).find(i=>NIGHT_EVENTS[i].room===id&&!N.evDone[i]);
 if(i!==undefined)return matter(null,NIGHT_EVENTS[i].text,NIGHT_EVENTS[i].choices,c=>N.evDone[i]=c.go());
 roomIdle()}
function matter(k,text,choices,apply){
 speak(k,text,()=>{const ch=$("choices");
  choices.forEach((o,i)=>{if(o.req&&!o.req())return;if(o.agent&&!agentKnown(o.agent))return;ch.appendChild(choiceBtn(o,i,()=>{if(!can(o))return;SFX.click();ch.innerHTML="";LAST={};
   const reply=apply(o);render();countChoice();save();react();
   typeText(reply,k?C[k].voice:190,()=>goBtn("Continue",()=>{if(fail())return;roomStep()}))}))})})}

  acts:[{t:"Plan a mission",go:()=>panel("war"),off:!!mis}]}},

 dungeon:()=>({k:null,text:!has("brannocExiled")?"Brannoc doesn't look up when you pass. Somewhere, water drips onto stone.":SC.cast.length?"The guards are already unlocking his chains. He'll be across the river by dawn.":"The cell is empty. Only the straw remembers him.",acts:[]}),

   <button class="pb" style="opacity:0;animation:appear 1s ${FAST?0:2}s forwards" id="fateBtn">Face your fate</button></div>`);

  [{t:"\"For Emberfall, and every home behind this wall!\"",go:()=>{const m=S.favor>=55?14:7;BSCORE+=m;return S.favor>=55?"They roar it back at you. They love this city, and they'd die for it. Some of them will.":"A ragged cheer. They're fighting for their homes, if not quite for you."}},

   {t:"\"Fire the ford!\"",req:()=>has("pitch"),go:()=>{BT.fire=1;BSCORE+=26;SC.shake=4;SFX.doom();return "Pitch, oil, torches. The river itself catches fire. Vex's vanguard breaks and flounders back through the flames, screaming."}},

function finishBattle(force){

 if(!k){const s=BSCORE;
  if(s>=125||has("bt_slew")&&s>=100)k=has("kingFavor")?"crowned":"victory";

  else k=has("familySafe")||has("witchCharm")?"lastStandSafe":"fallen"}
 ["bt_traitor","bt_witch","bt_keep"].forEach(f=>delete S.f[f]);
 if(has("bt_slew")&&k!=="fallen"&&k!=="lastStandSafe")set("vexDead");
 battleEnd();OUTCOMES[k]?aftermath(k):ending(k)}

function finalEnding(){
 if(has("rebelCrushed"))return"chained";
 if(has("vassal")&&!has("freed"))return"vassalForever";
 if(has("witchThrone"))return"fenThrone";
 if(has("corvinExposed"))return"emberCrown";
 if(has("corvinFight")&&councilVotes().final<6)return"usurped";
 if(has("corvinPact"))return"pricePeace";
 if(has("freed"))return"brokenChain";
 if(has("vexLands")&&S.favor>=55)return"twoBanks";
 if(has("kingChampion")&&S.favor>=45)return"kingsHand";
 if(has("marenWed")&&has("harwinAlly")&&S.favor>=45)return"twoHouses";
 if(S.favor>=80)return"emberLord";
 if(S.men>=45&&S.favor<45)return"ironYear";
 return"longYear"}

  return bSay("The Midwinter Council",null,"The snow breaks. Eleven lords ride through your gate for the Midwinter Council.\n\n"+lines,[{t:"The end of your first year",go:()=>""}],()=>ending(finalEnding()))}

  <div class="nums"><div><b>${Math.min(12,S.month)}</b><small>months ruled</small></div><div><b>${st.choices}</b><small>decisions made</small></div><div><b>${st.helped}</b><small>times the people cheered</small></div><div><b>${st.gold}</b><small>gold earned</small></div><div><b>${st.lost}</b><small>soldiers lost</small></div><div><b>${S.favor}</b><small>favor at the end</small></div></div>
  ${picks.length?`<h3 class="sm">Moments they'll remember</h3><ul>${picks.map(c=>`<li>${c}</li>`).join("")}</ul>`:""}</div>`}
function dayTrack(){const se=S&&S.month?SEASON(S.month):"spring";return se==="autumn"?"autumn":se==="winter"?"winter":"hall"}
function buzz(kind){if(typeof PREF!=="undefined"&&!PREF.haptics)return;try{const Cap=window.Capacitor,H=Cap&&Cap.Plugins&&Cap.Plugins.Haptics;
 if(H){kind==="heavy"?H.impact({style:"HEAVY"}):kind==="warn"?H.notification({type:"WARNING"}):kind==="good"?H.notification({type:"SUCCESS"}):H.impact({style:"LIGHT"})}
 else if(navigator.vibrate)navigator.vibrate(kind==="heavy"?60:kind==="warn"?[30,40,30]:15)}catch(e){}}
/* the throne room reacts to how the year is going */
function greenFire(){return S&&S.f&&(has("morwenCourt")||has("witchRealm")||has("witchThrone"))}
function throneDecor(x){if(!S||!S.f)return;const t=SC.t;
 if(has("vassal")&&!has("freed")){[[78,4,12,32],[167,2,16,24]].forEach(([bx,by,bw,bh])=>{x.fillStyle="#1d1d22";x.fillRect(bx,by,bw,bh);x.fillStyle="#9a1f1f";x.fillRect(bx,by+2,bw,1);x.fillRect(bx,by+bh-3,bw,1);
  const cx=bx+Math.floor(bw/2);x.fillRect(cx-3,by+bh/2-4,1,3);x.fillRect(cx-2,by+bh/2-1,1,2);x.fillRect(cx-1,by+bh/2+1,2,1);x.fillRect(cx+1,by+bh/2-1,1,2);x.fillRect(cx+2,by+bh/2-4,1,3)})}
 else if(S.month===6&&(has("outcome_pyrrhic")||has("outcome_victory")||has("outcome_crowned"))){x.fillStyle="#141016";[[78,4,12],[167,2,16]].forEach(([bx,by,bw])=>{for(let i=0;i<bw;i++)x.fillRect(bx+i,by+8+i,2,2)})}
 if((S.f.lanterns||0)>=S.month){const cols=["#e0413a","#f2c14e","#6ac05a","#4ac0e0"];x.fillStyle="#3a2a1a";
  for(let lx=26;lx<160;lx++){const ly=Math.round(9+Math.sin((lx-26)/134*Math.PI)*6);x.fillRect(lx,ly,1,1)}
  for(let k=0,lx=32;lx<158;lx+=14,k++){const ly=Math.round(9+Math.sin((lx-26)/134*Math.PI)*6)+1;x.fillStyle=cols[k%4];x.fillRect(lx-1,ly,3,4);x.globalAlpha=.25+.15*Math.sin(t/9+k);x.fillRect(lx-2,ly-1,5,6);x.globalAlpha=1}}}
function fail(){if(S.food<0)return ending("famine");if(S.favor<=0)return ending("revolt");if(S.gold<-20)return ending("debt");return false}
const ENDINGS={
 famine:["The Hungry Winter","The granaries ran empty. By midwinter your people ate the seed grain, then the horses. In spring, Emberfall was a city of ghosts."],
 revolt:["The Pitchfork Crown","Your people had enough. They broke down the doors of the hall. Hob the Miller rules Emberfall now, and he is not kind."],
 debt:["Owned by the Guild","The Merchant Guild bought your debts and then your castle. You still sit on the throne, but Osric Fairweather tells you when to stand."],
 exile:["The Lord in Exile","You escaped through grandfather's tunnel with your family. Emberfall burned behind you. Somewhere far away, you raise your children in peace, and in shame."],
 fallen:["The Fall of Emberfall","The gates broke. Vex found you on your father's throne. The chronicles forget your name."],
 lastStandSafe:["The Last Stand","You fell at the gate, sword in hand. Elinor and the children reached the Marches safely. Maren tells her children of you."],
 witchFall:["Fire Without End","Morwen's fire did not stop at Vex's army. It took the ford, the city, the abbey. You won, and there is nothing left to rule."],
 chained:["Vex's Chains","The uprising failed. Vex hanged the guild masters in the square and took your crown for his hall. You live, in a tower, looking at a river you used to rule."],
 vassalForever:["The Baron's Steward","A year passed, and you never rose. Emberfall is quiet, well fed and owned. Sir Gerrit sends your taxes across the river every month, and thanks you every time."],
 fenThrone:["The Fen Throne","The green came up through the flagstones in spring. Emberfall is Morwen's now, and yours, in a way. The crows bow when you pass. The priests are long gone."],
 usurped:["The Cousin's Crown","The lords voted, and the vote was Corvin's. You ride out of Emberfall with your family and a single cart. Behind you, your cousin is already measuring the throne."],
 pricePeace:["The Price of Peace","Corvin burned his will, and Maren married his son. You kept your throne. At the wedding, Maren smiled for the guests and never once looked at you."],
 brokenChain:["The Broken Chain","Vex's banner burned in the square on the first day of spring. Emberfall bent the knee once, and stood back up. Songs about the uprising are already too long."],
 twoBanks:["Lord of Both Banks","Your banner flies on both sides of the river now. The lord who never wanted a throne ends his first year with two, and a people who mostly like him."],
 kingsHand:["The King's Right Hand","King Osmund summons you to court in spring, to sit at his right hand. Emberfall's soldiers held the north. Now Emberfall's lord will help hold the realm."],
 twoHouses:["Two Houses, One Blood","Emberfall and the Marches are family now. When the snow melts, Harwin's riders and yours hunt together in the Ashwood, and Maren's letters come every week."],
 emberLord:["The Ember Lord","They light every window in Emberfall on the anniversary of your crowning. Ask anyone in the city about their lord, and they'll talk for an hour. All of it good."],
 ironYear:["The Iron Year","Your soldiers fill the walls and your people fill the churches, praying you never turn your army on them. Emberfall is safe. It is not happy."],
 emberCrown:["The Ember Crown","Corvin left the great hall in chains, and the eleven lords knelt to you one by one. On the first day of spring they set your father's old crown on your head, and you swore, in front of everyone, to rule better than the men who wanted it. The bells of Saint Ember rang for a whole day."],
 longYear:["The Long Year","You made it. Not every choice was right, and not every winter night was warm, but spring comes to Emberfall, and it is still yours."]
};
const GOOD=["emberCrown","brokenChain","twoBanks","kingsHand","twoHouses","emberLord","longYear"],BAD=["revolt","fallen","witchFall","debt","chained","usurped"];
function gotEndings(){try{return JSON.parse(localStorage.getItem("ef_end")||"[]").filter(k=>ENDINGS[k])}catch(e){return[]}}
function ending(k){
 const[t,d]=ENDINGS[k];const got=gotEndings();if(!got.includes(k))got.push(k);
 try{localStorage.setItem("ef_end",JSON.stringify(got));localStorage.removeItem("ef_save3")}catch(e){}
 setCastle(k==="famine"?"snow":GOOD.includes(k)?"dawn":BAD.includes(k)?"burn":"night");
 Music.play(GOOD.includes(k)?"hall":"night");GOOD.includes(k)?SFX.fanfare():SFX.doom();
 overlay(`${castleHTML()}</div><div class="ovb ending"><div class="dim">— AN ENDING —</div><h3>${t}</h3><p>${d}</p>
  ${reignSummary()}
  <p class="dim">Endings discovered: ${got.length} / ${Object.keys(ENDINGS).length}</p>
  <button class="pb" onclick="newGame()">Begin a New Reign</button><button class="pb alt" onclick="openChron()">Read the Chronicle</button><button class="pb alt" onclick="showTitle()">Title Screen</button></div>`);
 return true}
function overlay(h){const o=$("overlay");o.className=/class="rooms"/.test(h)?"nt":/class="logo"/.test(h)?"ts":/class="ovb prolog/.test(h)?"pl":/class="ovb (siege|ending)/.test(h)?"fb":"";o.innerHTML=h;o.style.display="flex";o.scrollTop=0}
function closeOverlay(){$("overlay").style.display="none";$("overlay").innerHTML=""}
function modal(h,cls=""){const m=$("modal");m.innerHTML=`<div class="box ${cls}">${h}</div>`;m.style.display="flex"}
function closeModal(){const m=$("modal");m.style.display="none";m.innerHTML=""}
function openChron(){SFX.page();modal(`<h3>The Chronicle of Emberfall</h3><ul>${(S&&S.chron||[]).map(c=>`<li>${c}</li>`).join("")||"<li>Nothing yet written.</li>"}</ul><button class="pb" onclick="closeModal()">Close</button>`)}
function savePrefs(){try{localStorage.setItem("ef_prefs",JSON.stringify({m:AU.musicOn,s:AU.sfxOn,sp:PREF.speed,bt:PREF.big,hp:PREF.haptics}))}catch(e){}applyPrefs()}
function tg(label,on,fn){return `<button class="tg ${on?"on":""}" onclick="${fn};openSettings(true)"><span>${label}</span><i></i></button>`}
function setSpeed(k){PREF.speed=k;savePrefs();openSettings(true)}
function openSettings(quiet){if(!quiet)SFX.click();else SFX.blip&&SFX.blip(700);modal(`<div class="phead"><div><h3>Settings</h3></div><button class="pb done" onclick="closeModal()">Back</button></div>
 <div class="pbody t3 set">
 <section><h4>Sound</h4>
  ${tg("Music",AU.musicOn,"AU.musicOn=!AU.musicOn;if(AU.mg)AU.mg.gain.value=AU.musicOn?.5:0;savePrefs()")}
  ${tg("Sound effects",AU.sfxOn,"AU.sfxOn=!AU.sfxOn;if(AU.sg)AU.sg.gain.value=AU.sfxOn?.6:0;savePrefs()")}
  ${tg("Vibration",PREF.haptics,"PREF.haptics=!PREF.haptics;savePrefs()")}</section>
 <section><h4>Reading</h4><p class="lbl">Text speed</p>
  <div class="seg">${Object.keys(SPEEDS).map(k=>`<button class="${PREF.speed===k?"on":""}" onclick="setSpeed('${k}')"><b>${SPEEDNAME[k]}</b></button>`).join("")}</div>
  ${tg("Larger text",PREF.big,"PREF.big=!PREF.big;savePrefs()")}</section>
 <section><h4>Your reign</h4>
  <button class="act" onclick="resetTips()">Show tips again</button>
  ${S&&!document.querySelector("#overlay .logo")?`<button class="act" onclick="closeModal();showTitle()">Save &amp; quit to title</button>`:""}
  ${PRO?'<p class="note">The full year is unlocked. Thank you!</p>':`<button class="act gold" onclick="closeModal();unlockFull()">Unlock the full year · ${STORE.price}</button>`}
  <button class="act" onclick="restoreFull()">Restore purchase</button><p class="note" style="margin-top:auto;opacity:.6">Build ${window.EF_BUILD||"preview"}</p></section>
 </div>`,"pnl")}
function openEndings(){SFX.page();const got=gotEndings();modal(`<h3>Endings ${got.length} / ${Object.keys(ENDINGS).length}</h3><div class="elist">${Object.keys(ENDINGS).map(k=>got.includes(k)?`<div>👑 ${ENDINGS[k][0]}</div>`:`<div class="lock">??? <small>Hint: ${HINTS[k]||"Keep ruling."}</small></div>`).join("")}</div><br><button class="pb" onclick="closeModal()">Close</button>`)}
function save(){try{localStorage.setItem("ef_save3",JSON.stringify(S))}catch(e){}}
/* ---------------- Prologue: who you are, what happened, and who is coming ---------------- */
const PROLOGUE=[
 {mode:"title",h:"Emberfall",t:"A proud little city on the river Ember, at the far edge of King Osmund's realm. Its old stone ford is the only crossing for fifty miles. Whoever holds Emberfall holds the road east."},
 {mode:"snow",h:"The Old Lord Is Dead",t:"This winter your father, Lord Roderick, died in his sleep. The villages loved him and the lords across the river feared him. He left you a cracked wall, a thin treasury, and a hall full of people who aren't sure you're ready."},
 {mode:"burn",h:"Baron Vex",t:"Across the river waits Baron Vex. For twenty years he has wanted the ford, and only your father kept him on his own bank. Now Vex smells weakness. He is gathering men, and by midsummer he will come."},
 {mode:"spring",h:"Your Family",faces:["elinor","maren","tobin"],t:"You don't rule alone. Lady Elinor, your wife, sharp and steady. Maren, your eldest, old enough to be married off for an alliance. Young Tobin, who dreams of becoming a knight. Every choice you make, they will feel."},
 {mode:"dawn",h:"Your First Year",t:"Each day, petitioners will climb the carpet to your throne. Each night, you may walk the castle. Keep the gold, the grain, the army and the people's favor from collapsing, and in the deep of winter the great lords will meet to judge your reign."},
];
function prologue(done,i=0){
 const P=PROLOGUE[i];if(!P){closeOverlay();return done()}
 setCastle(P.mode);if(i===0)Music.play("title");SFX.page();
 overlay(`${castleHTML()}</div><div class="ovb prolog"><div class="pl-in">
  <div class="pl-k">Prologue · ${i+1} of ${PROLOGUE.length}</div><h3>${P.h}</h3>
  ${P.faces?`<div class="pl-faces">${P.faces.map(k=>`<figure><canvas width="64" height="64" data-k="${k}"></canvas><figcaption>${C[k].n.replace("Lady ","")}</figcaption></figure>`).join("")}</div>`:""}
  <p>${P.t}</p></div>
  <div class="pl-btns">${i<PROLOGUE.length-1?'<button class="pb alt" id="plSkip">Skip</button>':""}<button class="pb" id="plNext">${i===PROLOGUE.length-1?"Take the throne":"Continue"}</button></div></div>`);
 document.querySelectorAll(".pl-faces canvas").forEach(c=>drawPortrait(c.getContext("2d"),C[c.dataset.k],{}));
 $("plNext").onclick=()=>{SFX.click();prologue(done,i+1)};
 if($("plSkip"))$("plSkip").onclick=()=>{SFX.click();closeOverlay();done()};
}
function newGame(){AU.init();SFX.click();closeModal();S=fresh();SC.room=null;SC.cast=[];setPhase("day","spring");SC.walker=null;render();
 prologue(()=>{Music.play("hall");monthCard(()=>{buildMonth();next()})})}
function cont(){AU.init();SFX.click();let s=null;try{s=JSON.parse(localStorage.getItem("ef_save3"))}catch(e){}if(!s)return newGame();if(!s.month)return newGame();S=s;ensureState();if(S.month>FREE_MONTHS&&!PRO){return paywall(()=>cont())}closeOverlay();SC.room=null;SC.cast=[];if(S.night&&S.night.reqDone){CS.season=SEASON(S.month);setPhase("night",CS.season);Music.play("night");render();return showNight()}const war=S.month===BATTLE_MONTH;setPhase(war?"dusk":"day",SEASON(S.month));SC.walker=null;Music.play(war?"battle":dayTrack());render();next()}
function showTitle(){
 if(TY){clearTimeout(TY.to);TY=null}SC.walker=null;SC.talk=false;SC.room=null;SC.cast=[];
 let hasSave=false;try{hasSave=!!localStorage.getItem("ef_save3")}catch(e){}
 setCastle("title");Music.play("title");
 overlay(`${castleHTML()}<div class="logo"><h1>EMBERFALL</h1><h2>MY LORD</h2></div></div><div class="ovb">
  <p class="dim">The throne is yours. So is everything that follows.</p>
  <div class="tbtns">${hasSave?'<button class="pb" onclick="cont()">Continue Reign</button>':""}<button class="pb ${hasSave?"alt":""}" onclick="${hasSave?"confirmNew()":"newGame()"}">New Reign</button>
  <button class="pb alt" onclick="openEndings()">Endings (${gotEndings().length}/${Object.keys(ENDINGS).length})</button>
  <button class="pb alt" onclick="openSettings()">Settings</button></div></div>`)}

storeInit().then(()=>{if(document.querySelector(".logo"))showTitle()});
applyPrefs();buildStats();S=fresh();render();setPhase("day","spring");showTitle();loop();
</script>
