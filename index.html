  choices:[{t:"Build them a playground",cost:{gold:6},go:()=>{fx({gold:-6,favor:5});return "A rope swing and a wooden tower by the market. The scaffolds are left alone."}},{t:"Post a guard",go:()=>{fx({favor:-1});return "The children find somewhere else to climb. Probably somewhere worse."}}]},
 {room:"family",when:()=>famHere("maren")&&famHere("tobin"),text:"Maren and Tobin are shouting over the last honey cake in the kitchens.",
  choices:[{t:"Split it fairly",go:()=>{S.bond.maren++;return "Two halves, exactly. Both of them complain anyway."}},{t:"Eat it yourself",go:()=>{S.bond.tobin++;return "They stare at you. Then Tobin laughs so hard he falls off the bench."}}]},
 {room:"treasury",text:"Mice got into the tax rolls. Half of Thornby's names are now mouse nests.",
  choices:[{t:"Pay clerks to rewrite them",cost:{gold:5},go:()=>{fx({gold:-5});return "Fresh rolls by morning, in very tired handwriting."}},{t:"\"Guess.\"",go:()=>{fx({gold:4,favor:-3});return "Aldric's guesses are generous to the treasury."}}]},
 {room:"war",text:"Two of your soldiers ask for leave to get married. To each other. They've already asked the abbey.",
  choices:[{t:"Grant leave, and send a cask of wine",go:()=>{fx({favor:4});return "The whole garrison is invited. Half of them are hungover at muster."}},{t:"\"Not this season.\"",go:()=>"They salute, disappointed."}]},
 {room:"mason",text:"A wandering painter offers to paint a mural of your reign on the great hall wall. Eight gold.",
  choices:[{t:"Commission it",cost:{gold:8},go:()=>{fx({gold:-8,favor:4});return "Your nose is too large in it. The people love it."}},{t:"Not today",go:()=>"He paints a small rude cartoon on the stable door instead, and leaves."}]},
 {room:"family",text:"Elinor finds your first grey hair and holds it up to the candle like a trophy.",
  choices:[{t:"Laugh about it",go:()=>{S.bond.elinor++;return "\"One for every petitioner,\" she says. You're going to need a lot of hair."}},{t:"Demand it be destroyed",go:()=>"She keeps it in a locket. Of course she does."}]},
 {room:"war",when:()=>S.month<BATTLE_MONTH&&!has("knelt"),text:"The castle hound has caught a pigeon with a message tied to its leg. The seal isn't yours.",
  choices:[{t:"Read the message",go:()=>{set("intel");return "Troop counts and river crossings, written for someone across the water. Now they're written for you."}},{t:"Give the hound his prize",go:()=>"Best day of the hound's life."}]},
 {room:"treasury",text:"A soldier's widow offers her late husband's armor and swords for sale. Twelve gold for the lot.",
  choices:[{t:"Buy them",cost:{gold:12},go:()=>{fx({gold:-12,men:3,favor:2});return "Three more soldiers armed, and a widow who can eat this winter."}},{t:"Send her to the abbey",go:()=>"The abbey finds her a bed. You find you can't stop thinking about her."}]},
 {room:"mason",text:"Hildra's apprentice carved a statue of you for the courtyard. It is... not flattering.",
  choices:[{t:"Put it up anyway",go:()=>{fx({favor:3});return "Children leave flowers at its feet. Pilgrims ask which saint it is."}},{t:"Quietly lose it in the river",go:()=>"The apprentice is heartbroken. The river doesn't care."}]},
 {room:"family",when:()=>famHere("tobin"),text:"Tobin can't sleep. He asks you to tell the story of how Grandfather lost his front teeth.",
  choices:[{t:"Tell it, with sound effects",go:()=>{S.bond.tobin++;return "By the end, Elinor is laughing in the doorway too."}},{t:"\"Another night.\"",go:()=>"He turns over, disappointed."}]},
];
/* story scenes at night: one per month, must be seen before sleeping */
/* Required night scenes. Each night, up to 3 that fit (month + your past choices) must be seen before sleeping.
   m = months it can happen in (none = any month), when = condition, room = where it happens. Each happens once. */
const SCENES=[
 {id:"elinorAsks",m:[2],room:"family",who:"elinor",text:"Elinor is waiting up for you, a list of names on her lap. \"The servants who were in the castle the week your father died. I want to ask them questions. Quietly. Somebody saw something, love. Will you let me?\"",
  choices:[{t:"\"We'll do it together.\"",go:()=>{set("elinorSleuth");S.bond.elinor++;note("Elinor began asking questions about Roderick's death.");return "She smiles for the first time in a week. \"Together, then. I'll start with the kitchens. Cooks see everything.\""}},
   {t:"\"It isn't safe. Leave it to me.\"",go:()=>"\"Of course,\" she says, and folds the list very small, and keeps it."}]},
 {id:"cellarRing",m:[3],room:"family",who:"elinor",when:()=>has("elinorSleuth")&&!hasClue("ring"),text:"Elinor comes up from the wine cellar with cobwebs in her hair and something in her fist. \"Under the last cask, where your father's wine was kept.\" A heavy gold ring with a grey stone. The Greymarch crest.",
  choices:[{t:"\"Someone from Greymarch was in our cellar.\"",go:()=>{addClue("ring");return "\"Someone from Greymarch was in our cellar the week he died,\" Elinor says, \"and lost a ring they couldn't ask about.\""}},
   {t:"Keep it close. Tell no one.",go:()=>{addClue("ring");S.bond.elinor++;return "You put it on a cord around your neck, under your shirt, where it sits cold all summer."}}]},
 {id:"aldricRing",m:[4],room:"treasury",who:"aldric",when:()=>!has("elinorSleuth")&&!hasClue("ring"),text:"Aldric sets a ring on the ledger: heavy gold, a grey stone. \"The cellar boys found it under the old casks, my lord. That's the Greymarch crest. I can't think why it would be in your father's cellar.\"",
  choices:[{t:"\"Nor can I. Keep it safe.\"",go:()=>{addClue("ring");return "Aldric locks it in the strongbox. He looks at it for a long time before he closes the lid."}}]},
 {id:"edmund",m:[4],room:"war",who:"wynn",when:()=>!hasClue("edmund"),text:"\"Old Edmund is gone, my lord. The cupbearer. He poured your father's wine for twenty years, and nobody has seen him in a week.\"",
  choices:[{t:"\"Search the river road.\"",go:()=>{addClue("edmund");note("Old Edmund the cupbearer was found drowned.");return "They find him in the reeds below the mill. Drowned, they say. There are three Greymarch silver marks sewn into his coat, and Greymarch coin is rare this far downriver."}},
   {t:"\"He was old. He wandered.\"",go:()=>{if(has("elinorSleuth")){addClue("edmund");return "Wynn nods. But Elinor sends her own men down the river road anyway, and they find him in the reeds below the mill, with Greymarch silver sewn into his coat."}return "Wynn nods slowly. A week later a fisherman finds Edmund in the reeds. Nobody asks how he got there."}}]},
 {id:"elinorMaud",m:[8],room:"family",who:"elinor",when:()=>has("elinorSleuth")&&has("corvinClaim")&&!hasClue("apothecary"),text:"\"I wrote to my cousin, Lady Maud of Wexley,\" Elinor says quietly. \"Last winter, she saw Corvin buying nightshade in Greymarch. 'For rats,' he said. She remembered the apothecary's name: Ulric.\"",
  choices:[{t:"\"Then we find Ulric.\"",go:()=>{set("ulricLead");S.bond.elinor++;return "\"Already done,\" Elinor says. \"Maud's people are looking. If he's alive, he'll come to us.\""}}]},
 {id:"elinorThreat",m:[9],room:"family",who:"elinor",when:()=>has("elinorSleuth")&&has("corvinClaim")&&!has("corvinPact"),text:"Elinor's door was forced while she was at chapel. Nothing was taken. On her pillow, someone left a sprig of nightshade, tied with grey thread.",
  choices:[{t:"\"Then we're close. We don't stop.\"",go:()=>{set("elinorBrave");S.bond.elinor++;return "She takes your hand. Hers is shaking. Her voice isn't. \"No. We don't.\""}},
   {t:"\"We stop. I won't lose you too.\"",go:()=>{delete S.f.elinorSleuth;return "\"Fine,\" she says. She doesn't sleep that night. Neither do you."}},
   {t:"Put Wynn's best men on her door",go:()=>{fx({men:-2});set("elinorBrave");return "Two guards on her door, day and night. She hates it. She keeps asking questions anyway."}}]},
 /* the old wrong: why Corvin hated Roderick */
 {id:"oldRuling",m:[10],room:"family",who:"elinor",when:()=>has("corvinClaim")&&!has("corvinPact")&&!has("roderickSin"),text:"Elinor has your father's old strongbox open on the bed. \"I finally found the key, love. You need to read this.\" A judgment, thirty years old, in your father's hand: the lower valley of Greymarch, taken from Corvin's father over a debt that was never real. Corvin's father died poor the next winter.",
  choices:[{t:"\"My father was a thief.\"",go:()=>{set("roderickSin");note("Found Roderick's judgment against Corvin's father.");return "\"Your father was a lord,\" Elinor says. \"Sometimes that's the same thing. Corvin's had thirty years to hate him for it.\""}},
   {t:"\"It doesn't excuse poison.\"",go:()=>{set("roderickSin");note("Found Roderick's judgment against Corvin's father.");return "\"No,\" Elinor says. \"But it explains it. And if we know, Corvin will make sure the lords know too.\""}}]},
 {id:"aldricConfess",m:[10,11],room:"treasury",who:"aldric",when:()=>has("roderickSin")&&!has("aldricConfessed"),text:"Aldric won't meet your eyes. \"I drew up that judgment, my lord. I was young, and your father was my lord. Every year since, I've wondered when Corvin would come for it. I should have told you.\"",
  choices:[{t:"\"Yes. You should have.\"",go:()=>{set("aldricConfessed");return "He bows his head. \"I know.\" He stays late over the ledgers that night, and every night after."}},
   {t:"\"You did what he asked. So would I.\"",go:()=>{set("aldricConfessed");return "The old man's shoulders shake once. Then he straightens, and goes back to work."}}]},
 /* 4. Brannoc's last bargain */
 {id:"brannocLast",m:[11],room:"dungeon",who:"brannoc",when:()=>has("corvinFight")&&!has("corvinPact")&&has("brannocJailed")&&!has("brannocExiled")&&!has("brannocPardoned"),text:"Brannoc is sitting very straight in his cell. \"They say you ride to Kingsreach. Take me. I'll tell the King everything, the gate, the money, the man with the Greymarch rings, in front of every lord. In return, I don't hang.\"",
  choices:[{t:"\"Agreed. Tell the King.\"",go:()=>{set("brannocWitness");addClue("brannoc");note("Brannoc agreed to testify at Kingsreach.");return "He nods once, like a soldier taking an order. \"I'll wash first,\" he says. \"The King deserves that much.\""}},
   {t:"\"You'll hang either way.\"",go:()=>{set("brannocExiled");note("Brannoc was hanged at dawn.");return "He laughs, short and ugly. \"Then you'll never know the rest.\" They hang him at dawn. He doesn't say another word."}}]},

 {id:"letter",m:[1],room:"family",who:"elinor",text:"Elinor is waiting in your chambers with a sealed letter. \"It was in your father's desk. His hand, the night before he died.\"\n\nIt reads: \"Trust Aldric. Pay Vex nothing. Watch the man who keeps the postern keys. And if I die suddenly, my son, it was not God's will.\"",
  choices:[{t:"Read it aloud to the court",go:()=>{fx({favor:4});set("letterRead");addClue("letter");note("Read your father's last letter to the court.");return "The hall goes silent. Whoever keeps those keys now knows you are watching."}},
   {t:"Keep it secret and investigate",go:()=>{set("letterClue");addClue("letter");note("Kept your father's letter secret.");return "You lock it in your desk. Aldric can check the postern keys against the guard rosters."}},
   {t:"Burn it. The dead shouldn't rule.",go:()=>{set("letterBurned");return "The wax hisses in the fire. Elinor says nothing, which says a great deal."}}]},
 {id:"vial",m:[2],room:"family",who:"elinor",text:"Elinor closes the door behind you and opens her hand. A tiny green vial. \"I was clearing your father's chamber. It was inside the hollow bedpost, where he kept his rings.\"\n\nYou uncork it. Bitter. Like almonds and old flowers.",
  choices:[{t:"Show it to Brother Cuthbert",go:()=>{set("vialSeen");addClue("vial");return "Cuthbert goes pale. \"Nightshade, my lord. And this glass was blown in Greymarch. Nobody in Emberfall makes that green.\""}},
   {t:"Keep it hidden. Trust no one.",go:()=>{addClue("vial");S.bond.elinor++;return "You hide it with your father's letter. \"Whoever did this,\" Elinor says quietly, \"may still be under our roof.\""}},
   {t:"\"He was old. Let him rest.\"",go:()=>{set("vialSeen");S.bond.elinor=Math.max(0,S.bond.elinor-1);return "Elinor stares at you. Then she puts the vial in her own pocket and says nothing more about it."}}]},

 {id:"debts",m:[1],room:"treasury",who:"aldric",text:"Aldric opens a dusty ledger. \"Your father owed the abbey 20 gold, my lord. Brother Cuthbert is too polite to ask. The city is not too polite to gossip.\"",
  choices:[{t:"Pay the debt",cost:{gold:20},go:()=>{fx({gold:-20,favor:5});set("debtPaid");return "Cuthbert blesses your name from the pulpit on Sunday."}},
   {t:"Ask the abbey to forgive it",go:()=>{fx({favor:-2});return "Cuthbert agrees, sweetly. Everyone hears that you asked."}},
   {t:"\"It was my father's debt, not mine.\"",go:()=>{fx({favor:-6});set("churchAngry");return "Aldric closes the ledger very slowly."}}]},
 {id:"quarrel",m:[2],room:"war",who:"brannoc",with:["aldric"],text:"Brannoc slams his fist on the map table. \"Vex has two hundred men! Pay him, smile, and buy a year.\"\n\nAcross the table, Aldric shakes his head. \"Your father never paid that man a copper,\" he says quietly. \"Nor should you.\"",
  choices:[{t:"Side with Brannoc",go:()=>{set("trustBrannoc");fx({men:4});return "Brannoc grins and claps your shoulder. Aldric leaves without a word. (Brannoc's drinking friends sign on: +4 soldiers.)"}},
   {t:"Side with Aldric",go:()=>{set("aldricTrusted");fx({favor:2});return "Aldric bows deeply. Brannoc's jaw tightens."}},
   {t:"Send Brannoc to hold the river fort",go:()=>{set("brannocAway");fx({men:-6});note("Sent Brannoc and six men to the river fort.");return "\"The fort? As you command.\" He takes six men and doesn't look back."}}]},
 {id:"marenTears",m:[2,3],room:"family",who:"maren",when:()=>has("marenBetrothed")&&!has("marenLoves"),text:"You hear crying behind Maren's door. She opens it before you knock. \"Is this what I am? A bargain for spears?\"",
  choices:[{t:"Sit with her until she sleeps",go:()=>{S.bond.maren++;return "You don't say much. You don't need to. She falls asleep holding your hand."}},
   {t:"\"Lords' daughters marry for their houses.\"",go:()=>{set("marenBitter");S.night.marenCold=1;return "She shuts the door. The lock turns."}},
   {t:"Promise her a say in it",go:()=>{S.bond.maren+=2;set("marenLoves");return "\"You mean it?\" For the first time in weeks, she smiles."}}]},
 {id:"marenLetters",m:[2,3],room:"family",who:"maren",when:()=>has("marenChoice"),text:"Maren has ink on her fingers. \"Edric, Lord Harwin's son, has written to me. May I write back?\"",
  choices:[{t:"\"Write as much as you like.\"",go:()=>{S.bond.maren++;return "Letters fly east every week. Harwin's riders start calling at Emberfall."}},
   {t:"\"Only if I read them first.\"",go:()=>"She rolls her eyes, but she brings you every letter."},
   {t:"\"No. Not yet.\"",go:()=>{fx({favor:-1});set("marenNoLetters");return "\"You said I could decide!\""}}]},
 {id:"grumble",m:[2,3],room:"war",who:"brannoc",when:()=>has("paidVex")&&!has("brannocAway")&&!has("brannocJailed"),text:"\"The men are grumbling, my lord. They say a lord who pays Vex won't fight Vex. Some are talking about leaving.\"",
  choices:[{t:"Double their rations",cost:{food:8},go:()=>{fx({food:-8});return "Full bellies, quieter mouths."}},
   {t:"Speak to them yourself",go:()=>{fx({favor:2});return "You tell them the gold bought time, not peace. Most of them believe you."}},
   {t:"Let the cowards go",go:()=>{fx({men:-5});return "Five men slip out before dawn."}}]},
 {id:"quarry",m:[2,3],room:"mason",who:"mason",when:()=>has("masonWalls"),text:"Hildra slaps a map on the table. \"Your walls need stone, and the best quarry is on Thornby common land. The villagers graze their sheep there.\"",
  choices:[{t:"Pay Thornby for the stone",cost:{gold:10},go:()=>{fx({gold:-10,favor:3});set("quarry");return "The villagers drive a hard bargain, and leave happy. (Walls cost 10 less.)"}},
   {t:"Take it. The walls protect them too.",go:()=>{fx({favor:-5});set("quarry");return "The sheep are moved at spearpoint. Hob does not wave when you pass. (Walls cost 10 less.)"}},
   {t:"Find stone elsewhere",go:()=>"\"Elsewhere costs more and takes longer, my lord.\""}]},
 {id:"tunnel",m:[3],room:"mason",who:"mason",text:"Hildra is covered in dust. \"My lord, we broke into a tunnel under the east wall, digging new footings. It runs all the way to the river. Smugglers, I'd guess. Your grandfather's day.\"",
  choices:[{t:"Seal it with stone",go:()=>{set("tunnelSealed");note("Sealed the smugglers' tunnel.");return "\"No one comes in that way now, my lord. No one goes out, either.\""}},
   {t:"Keep it open, and secret",go:()=>{set("tunnel");note("Kept the smugglers' tunnel open in secret.");return "Hildra taps her nose. \"A back door is a fine thing to have.\""}}]},
 {id:"fortRider",m:[3,4],room:"war",who:"aldric",when:()=>has("brannocAway")&&!has("brannocJailed"),text:"A rider from the river fort, soaked to the skin. \"Captain Brannoc meets men in Vex's colors at night, my lord. I saw it twice.\"",
  choices:[{t:"Recall Brannoc in chains",go:()=>{set("brannocJailed");fx({men:6});note("Arrested Brannoc on a rider's word.");return "Brannoc is dragged back through the gate. The six men come home with him."}},
   {t:"Let him think he's safe",go:()=>{set("brannocTrap");return "You send Brannoc a friendly letter, full of false plans."}},
   {t:"\"Rumors. Ignore it.\"",go:()=>"The rider looks at you a long moment, then goes."}]},
 {id:"witchWindow",m:[3,4],room:"family",who:"morwen",when:()=>has("witchPact"),text:"Something taps at the children's window. Morwen is perched on the sill, three floors up. \"Only looking at what you love, little lord. Don't fret.\"",
  choices:[{t:"Ask for her protection",go:()=>{set("witchCharm");note("Morwen hung a charm over your children's beds.");return "She hangs a knot of rowan and bone over the beds. \"Whatever happens, they'll live.\""}},
   {t:"Bar the window",go:()=>{fx({favor:1});return "She laughs as the shutters close. The laughter stays a while."}}]},
 {id:"loanAgent",m:[3],room:"treasury",who:"merchant",when:()=>has("loan"),text:"Osric himself, in your treasury, at night. \"Just checking on my investment, my lord. If July is... difficult, I could extend your loan to the harvest. 100 instead of 80.\"",
  choices:[{t:"Accept the extension",go:()=>{delete S.f.loan;set("loanAutumn");note("Extended the Guild loan to the harvest (100 gold).");return "\"A pleasure. See you at harvest.\""}},
   {t:"\"I'll pay in July as agreed.\"",go:()=>"\"Of course, of course.\" He counts your candlesticks on the way out."}]},
 {id:"chest",m:[4],room:"treasury",who:"aldric",when:()=>!has("knelt"),text:"Aldric sets a heavy chest on the table. \"Left at the gate at dusk. Vex's seal.\"\n\nInside: 60 gold, and a note. \"For when you kneel, young lord.\"",
  choices:[{t:"Keep the gold",go:()=>{fx({gold:60,favor:-10});set("tookBribe");note("Kept Baron Vex's gold.");return "The servants talk. By morning the whole city knows Vex's gold is in your vault."}},
   {t:"Give it to the people",go:()=>{fx({gold:10,favor:9});set("mockedVex");note("Gave Vex's gold to the city.");return "Vex's own coin buys bread in Thornby. They're singing rude songs about him in the taverns."}},
   {t:"Send it back across the river",go:()=>{fx({favor:3});return "Aldric seals the chest himself. \"Your father would have laughed.\""}}]},
 {id:"tobinWound",m:[4],room:"war",who:"tobin",when:()=>has("tobinRides")&&!has("knelt"),text:"Tobin limps into the war room with a bloody bandage on his leg. \"A skirmish at the mill. It's nothing!\"\n\nIt's not nothing.",
  choices:[{t:"Fetch the physician",cost:{gold:10},go:()=>{fx({gold:-10});return "Stitched and splinted. He'll ride again before July."}},
   {t:"Send for Morwen",req:()=>has("witchPact")||has("witchWarned"),go:()=>{S.bond.tobin++;return "By morning the wound is a pink scar. Tobin won't stop talking about it."}},
   {t:"Make him rest",go:()=>{S.bond.tobin=0;delete S.f.tobinRides;set("tobinStudy");return "He'll heal, but he'll sit out the summer with Aldric's ledgers."}}]},
 {id:"elinorFever",m:[4],room:"family",who:"elinor",when:()=>has("plague"),text:"The summer fever has crossed the castle walls. Elinor is burning hot and doesn't know your face.",
  choices:[{t:"Bring the city physician",cost:{gold:15},go:()=>{fx({gold:-15});return "Three long nights. On the fourth morning she asks for bread. She'll live."}},
   {t:"Send for Morwen",req:()=>has("witchPact")||has("witchWarned"),go:()=>{S.bond.elinor++;return "Morwen sits by the bed until dawn. The fever breaks. Elinor remembers green eyes and nothing else."}},
   {t:"Sit with her and pray",go:()=>{fx({favor:2});S.bond.elinor++;return "You don't leave her side. She lives, but she'll be weak all summer."}}]},
 {id:"refugeeLand",m:[4],room:"mason",who:"aldric",when:()=>has("refugees"),text:"The refugees' leader, a broad farmer named Garrow, asks for land outside the walls. \"We'll farm it, and we'll fight for it.\"",
  choices:[{t:"Grant them land",go:()=>{fx({men:4,food:-4});return "New houses rise along the river road. Four of Garrow's sons join the garrison."}},
   {t:"Put them to work on the walls",go:()=>{set("refugeeMasons");return "Hildra gains forty strong backs. (Walls cost 10 less.)"}}]},
 {id:"prisoner",room:"dungeon",who:"brannoc",when:()=>has("brannocJailed")&&!hasClue("brannoc"),text:"Brannoc sits chained in the dark. \"So. The boy lord comes to gloat.\"",
  choices:[{t:"Offer mercy for what he knows",go:()=>{set("intel");addClue("brannoc");note("Brannoc traded Vex's plans for his life.");return (S.month<BATTLE_MONTH?"He talks for an hour: Vex's numbers, his signals, the night he plans to cross.":"He talks for an hour, mostly about money and who paid it.")+" Then, quietly: \"And your father's wine, boy. That wasn't Vex. A man with Greymarch rings paid me for that. I never saw his face.\""}},
   {t:"Hold him for the King's justice",go:()=>{fx({favor:3});return "\"The King's justice,\" Brannoc spits. \"You'll have to live long enough to see it.\""}},
   {t:"Exile him across the river",go:()=>{set("brannocExiled");return has("vexLands")?"He's gone by dawn, east, past the Marches. At least he can't open any gates now.":has("vexDead")?"He's gone by dawn, into whatever is left of Vex's lands. At least he can't open any gates now.":"He's gone by dawn, back to Vex. At least he can't open any gates now."}}]},
 {id:"fletchers",m:[2,3],room:"war",who:"aldric",when:()=>!has("knelt")&&!has("arrows"),text:"Aldric has the fletchers' guild waiting in the war room. \"Ten barrels of good arrows by July, my lord, for 12 gold. Vex's men will have to cross that river under them.\"",
  choices:[{t:"Buy the arrows",cost:{gold:12},go:()=>{fx({gold:-12});set("arrows");return "The fletchers work by candlelight for two months. The barrels stack up in the gatehouse."}},
   {t:"\"We have arrows.\"",go:()=>"\"Some,\" Aldric says. \"Not many.\""}]},
 {id:"pitch",m:[3,4],room:"mason",who:"mason",when:()=>!has("knelt")&&!has("pitch"),text:"Hildra has a plan, and it smells terrible. \"Pitch and lamp oil, my lord, sunk in barrels at the ford. When Vex's men are in the water, one torch and the river burns. 15 gold.\"",
  choices:[{t:"\"Set the ford on fire. Do it.\"",cost:{gold:15},go:()=>{fx({gold:-15});set("pitch");note("Hildra laid pitch at the ford.");return "Her crew sinks the barrels by moonlight. \"Just don't stand downwind,\" she says."}},
   {t:"\"Too dangerous.\"",go:()=>"\"War usually is,\" says Hildra."}]},
 {id:"fallen",m:[6],room:"war",who:"wynn",when:()=>fought()&&!has("widowsPaid"),text:()=>`Wynn has chalked the names of the dead on the war room wall. ${has("outcome_pyrrhic")?"It covers the whole wall.":"It's a longer list than anyone wanted."} "Their families are asking what Emberfall will do for them, my lord."`,
  choices:[{t:"Pay every family",cost:{gold:15},go:()=>{fx({gold:-15,favor:7});note("Paid the families of the fallen.");return "Aldric writes every name into the ledger himself. At the market, people stop you to say thank you."}},

   {t:"\"My father never trusted you.\"",req:()=>hasClue("letter")&&!has("letterBurned"),go:()=>{TRIAL.sway+=1;return "You read his last letter aloud. Your father's voice, in a hall full of people who knew it. Old Rhun bows his head."}},

/* the evidence, one witness at a time */
function trialEvidence(){const steps=[];
 steps.push(["The Evidence",null,"You lay it out piece by piece, in front of the King:"+(S.clues||[]).map(k=>"\n• "+CLUES[k][0]).join("")]);
 if(hasClue("apothecary"))steps.push(["The Apothecary","ulric",`Master Ulric stands up in the gallery, shaking${has("ulricBrave")?", but with his daughters safe at last":""}. "I sold Lord Corvin nightshade. Twice. Once before Lord Roderick died, and once this autumn. I swear it on my life, Your Majesty, which is worth very little in Greymarch."`]);
 if(hasClue("brannoc")&&!has("brannocExiled")&&!has("brannocFell")&&!has("brannocSlain"))steps.push(["The Traitor","brannoc",`${has("brannocPardoned")?"Brannoc walks in a free man, his sword left at the door":"Brannoc is brought in, in chains"}. He grins at the lords. "Vex paid for the gate. The man with the Greymarch rings paid for the wine." He nods at Corvin's hands. "Those rings."`]);
 if(hasClue("cupbearer"))steps.push(["The Poisoned Cup",null,"Wynn lays the twist of green paper on the King's table: the poison sewn into the sleeve of Corvin's valet, at your harvest feast."]);
 steps.push(["The King's Hall","corvin",`Corvin is on his feet, backing toward the doors, where the King's guards are already waiting. "Cousin. Cousin, listen. We're family. Roderick wouldn't want..."`]);
 const go=i=>{const[t,w,x]=steps[i];if(i===steps.length-1)return bSay(t,w,x,[{t:"\"Chain him for the King's justice.\"",go:()=>{set("corvinJustice");return "The King nods once. They lead Corvin out in irons through a silent hall. Old Rhun, your father's friend, bows first. Then all of them do."}},
   {t:"\"Exile him. Let him live with it.\"",go:()=>{set("corvinExiled");fx({favor:3});return "\"Mercy,\" the King says, \"is a lord's to give.\" Corvin leaves with nothing: no will, no lands, no name."}}],trialAfter);
  bSay(t,w,x,[{t:i===0?"Call your witnesses":"Next",go:()=>""}],()=>go(i+1))};
 go(0)}
/* the vote: every lord stands, says a line, and votes. Nobody knows how it will fall until it does. */
function trialVote(){
 if(has("willExposed")){S.lords=S.lords||{};LORDS.forEach(L=>{if(lordStance(L)===0)S.lords[L.id]=1});if(has("corvinCaught")||clueCount()>=2)S.lords.garrick=1}
 if(has("accuseFailed")){S.lords=S.lords||{};LORDS.filter(L=>lordStance(L)===0).slice(0,2).forEach(L=>S.lords[L.id]=-1)}
 const p=Math.min(.9,Math.max(.1,(S.favor>=60?.7:S.favor>=45?.5:.3)+TRIAL.sway*.08+(S.b.greathall?.1:0)));
 const order=[...LORDS].sort((a,b)=>Math.abs(lordStance(b))-Math.abs(lordStance(a))||Math.random()-.5);
 // the undecided go last, and the last word belongs to an old friend of your father's if he's still undecided
 const votes=order.map(L=>{let s=lordStance(L),und=s===0;if(und)s=Math.random()<p?1:-1;return{L,s,und}});
 TRIAL.yes=0;TRIAL.no=0;
 bSay("The Vote","osmund",`"Enough. My lords, stand when your name is called, and say where Emberfall belongs."`,[{t:"Hold your breath",go:()=>""}],()=>voteStep(votes,0))}
function voteStep(V,i){const tally=()=>`For you ${TRIAL.yes} · For Corvin ${TRIAL.no}`;
 const pre=TRIAL.prev&&/hears you out|right ones/.test(TRIAL.prev)?TRIAL.prev+"\n\n":"";if(TRIAL.prev&&!pre){const pv=TRIAL.prev;setTimeout(()=>toast(pv.length<60?pv:pv.split(". ").pop()),300)}TRIAL.prev="";
 if(i>=V.length)return voteResult(pre);
 const{L,s,und}=V[i],k=LORD_C[L.id],line=und?LORD_UND[L.id][s>0?0:1]:(L.id==="rhun"&&s>0&&!has("rhunTold")&&!has("corvinExposed")?LORD_UND.rhun[0]:LORD_SAY[L.id][s>0?0:1]);
 const cast=()=>{if(V[i].s>0)TRIAL.yes++;else TRIAL.no++;SFX.seat&&SFX.seat();TRIAL.prev=`${L.n}: ${V[i].s>0?"for Emberfall.":"for Greymarch."}`};
 const ch=[{t:s>0?"Nod your thanks":"Let it stand",go:()=>{cast();return ""}}];
 if(s<0&&TRIAL.answered<2)ch.push({t:"Answer that",go:()=>{TRIAL.answered++;const ok=srand(["trial",TRIAL.answered,S.favor,S.gold,S.men,clueCount(),(S.chron||[]).length].join("|"))<.25+clueCount()*.05+(S.favor>=55?.15:0)+TRIAL.sway*.04;
  if(ok){V[i].s=1;cast();TRIAL.prev=`You say only a few words, but they're the right ones. ${L.n} looks at Corvin, then at you. "For Emberfall."`;return ""}
  cast();TRIAL.prev=`${L.n} hears you out, politely, and votes for Greymarch anyway.`;return ""}});
 bSay(L.n,k&&C[k]?k:null,`${pre}${L.n} of ${L.seat} stands. "${line}"`,ch,()=>voteStep(V,i+1));
 $("role").textContent=tally()}
function voteResult(pre=""){const won=TRIAL.yes>=6;if(!won)set("councilLost");else delete S.f.councilLost;
 const NUM=["None","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven"];bSay("The King's Word","osmund",pre+(won?`The King stands. "${NUM[TRIAL.yes]} of eleven. The lords have spoken, and so do I: Emberfall is yours, by their vote and by my word. Lord Corvin, go home to Greymarch, and stay there."`:`The King stands. "Only ${NUM[TRIAL.yes].toLowerCase()} of eleven. The lords have spoken. Lord Corvin, Emberfall is yours. Roderick's son, you'll leave your father's seat by the spring."`),
  [{t:won?"\"Thank you, Your Majesty. My lords.\"":"Bow, and walk out with your head high",go:()=>won?"The hall breaks into noise. Corvin rolls up his will very slowly, and is gone before the cheering stops.":"Corvin passes you in the doorway. He doesn't gloat. He doesn't have to."}],trialAfter)}

 /* ---------------- ELINOR ---------------- */
 e1:{text:"Later, Elinor is brushing out her hair. \"Your father scowled too, you know. Except at the fishwives. He'd stop his horse to argue the price of eels. They adored him for it.\"",
  choices:[{t:"\"I could learn to argue about eels.\"",go:()=>{fx({favor:1});return "\"Start with herring,\" she says. \"Work up to eels.\" She's smiling, but she means it."}},
   {t:"\"I'm not him, Elinor.\"",go:()=>{S.bond.elinor++;return "\"No,\" she says gently. \"You listen more. That isn't a weakness, love. Let them see it.\""}},
   {t:"\"What else did he do that I never knew?\"",go:()=>{S.bond.elinor++;set("fam_roderickStories");return "She talks until the candle gutters: the eels, the poems, the time he fell in the moat. You fall asleep laughing."}}]},
 e2:{text:()=>has("suspectClose")?"She lowers her voice. \"I made a list of everyone who had a key to his door that winter. It's short, love. Aldric is on it. So am I.\" She tries to smile and doesn't quite manage.":"Elinor checks the bolt twice, then sits on the bed. \"His last night, he asked for more wine and joked it tasted like a cellar floor. I laughed at him. I keep hearing myself laugh.\"",
  choices:[{t:"\"You're not on any list of mine.\"",req:()=>has("suspectClose"),go:()=>{S.bond.elinor++;return "She lets out a breath she's been holding for weeks. \"Good. Then I can stop watching myself, and watch everyone else.\""}},
   {t:"\"You couldn't have known.\"",req:()=>!has("suspectClose"),go:()=>{S.bond.elinor++;return "\"I know that,\" she says. \"I'd just like to hear it a few more times.\" You say it until she falls asleep."}},
   {t:"\"Then we find who it was. Together.\"",go:()=>{S.bond.elinor++;set("fam_elinorHunts");return "She takes your hand. Her grip is stronger than you expected. \"Together. And when we do, I want to be in the room.\""}}]},
 e3:{text:()=>has("familySafe")?"Before bed, Elinor takes her mother's ring out of the chest and presses it into your palm. \"If I have to go, you keep this. Then you'll have to come and fetch me to give it back.\"":"Elinor sits on the bed with her mother's ring in her hands. \"I'm frightened, love. I'll stay. I said I would. But I wanted you to know that I'm frightened.\"",
  choices:[{t:"\"I'll bring it back myself.\"",req:()=>has("familySafe"),go:()=>{S.bond.elinor++;return "\"You'd better,\" she says. \"It's the only thing I own that your father never called ugly.\""}},
   {t:"\"So am I.\"",req:()=>!has("familySafe"),go:()=>{S.bond.elinor++;return "She laughs, wet-eyed. \"Thank God. I thought it was only me.\" You sit together until the candle is out."}},
   {t:"\"Learn to shoot. Brannoc's sergeant, Wynn, will teach you.\"",go:()=>{set("fam_elinorBow");fx({favor:1});return "Wynn is horrified. Elinor is a natural. By July she can hit a turnip at forty paces, and she has named the turnip Vex."}}]},
 e4:{text:()=>has("outcome_peace")?"The wind picks up. \"Your father would have fought, you know. He called talking a coward's game.\" She looks at you sideways. \"He was wrong. Does it still feel like losing?\"":"The wind picks up. Elinor tucks her cold hands into your sleeve. \"Tobin asked me if you cried, after. I told him lords don't. Was I lying, love?\"",
  choices:[{t:"\"You were lying.\"",req:()=>!has("outcome_peace"),go:()=>{S.bond.elinor++;return "\"I know,\" she says. \"I just wanted you to tell me.\" She doesn't let go of your sleeve."}},
   {t:"\"Tell him the truth. He's old enough.\"",req:()=>!has("outcome_peace")&&famHere("tobin"),go:()=>{S.bond.tobin++;return "She nods. The next morning Tobin hugs you in the yard, in front of everyone, and doesn't explain why."}},
   {t:"\"A little. Every time Vex smirks.\"",req:()=>has("outcome_peace"),go:()=>{fx({favor:1});return "\"Let him smirk,\" she says. \"It's all he has left. You have a whole city of people who didn't die.\""}},
   {t:"\"No. It feels like breathing.\"",req:()=>has("outcome_peace"),go:()=>{S.bond.elinor++;return "\"Good,\" she says. \"Keep breathing. I've grown used to it.\""}}]},
 e5:{text:()=>has("elinorHurt")?"Past midnight, Elinor comes back for her shawl. She stops in the doorway. \"My family isn't a favor to be traded, love. They're mine. The same way yours are yours.\"":"Elinor seals the letter to Maud and starts to laugh. \"When we were nine, Maud and I stole a goose from the kitchens and hid it in a wardrobe. It was alive. That's the kind of friend she is.\"",
  choices:[{t:"\"I was wrong. I'm sorry.\"",req:()=>has("elinorHurt"),go:()=>{S.bond.elinor++;set("fam_elinorForgives");return "She's quiet a long while. \"I'll think about it.\" She takes the shawl, and leaves the door open behind her."}},
   {t:"\"Emberfall can't owe anyone.\"",req:()=>has("elinorHurt"),go:()=>"\"Everyone owes everyone,\" she says. \"That's what a family is.\" The door closes, very softly."},
   {t:"\"What happened to the goose?\"",req:()=>!has("elinorHurt"),go:()=>{S.bond.elinor++;return "\"It ate a cloak. Maud's mother's best cloak.\" She wipes her eyes. \"We were never caught. Maud still owes me for that.\""}},
   {t:"\"Remind Maud about the goose.\"",req:()=>!has("elinorHurt"),go:()=>{fx({favor:1});return "Elinor adds one line at the bottom: \"Remember the goose.\" Maud will know exactly what it means."}}]},
 e6:{text:()=>"Half asleep, Elinor murmurs, \"Do you remember our wedding feast? You tripped on my train and knocked over a whole candlestand.\" She giggles into the furs. \"I married you anyway.\"",
  choices:[{t:"\"The candlestand had it coming.\"",go:()=>{S.bond.elinor++;return "She laughs so hard the mead goes up her nose. It's undignified. It's the best sound you've heard all year."}},
   {t:"\"Why did you marry me anyway?\"",go:()=>{S.bond.elinor++;return "\"Because you apologized to the candlestand,\" she says, and she's asleep before you can argue."}}]},
 e7:{text:()=>has("rebelSeed")?"She burns your notes one by one in the candle. \"Gerrit's clerk eats his supper in our kitchen. He's sweet on the cook's daughter. The cook's daughter is fond of me.\" She smiles. \"Leave him to us.\"":"Elinor sits on the edge of the bed. \"Your father knelt once too, love, before you were born. To pay a debt, to a lord who's long dead. He hated every day of it. Then he stood up again.\"",
  choices:[{t:"\"Remind me never to cross you.\"",req:()=>has("rebelSeed"),go:()=>{S.bond.elinor++;return "\"Oh, you'll cross me,\" she says. \"Everyone does, once.\""}},
   {t:"\"Be careful. Please.\"",req:()=>has("rebelSeed"),go:()=>{S.bond.elinor++;return "\"I'm always careful,\" she says, and for once you believe her."}},
   {t:"\"How did he stand up again?\"",req:()=>!has("rebelSeed"),go:()=>{set("fam_kneltLore");S.bond.elinor++;return "\"Slowly,\" she says. \"Friends first. Then gold. Then the day nobody expected.\" She taps your chest. \"Start with friends.\""}},
   {t:"\"Maybe some lords stay down.\"",req:()=>!has("rebelSeed"),go:()=>"\"Not the ones I marry,\" she says, and blows out the candle."}]},

 /* ---------------- MAREN ---------------- */
 m1:{text:"Maren finds one more poem, folded small in the back of the book. It isn't funny. It's about a little boy who falls asleep on his father's shield. \"Father,\" she says quietly. \"I think it's about you.\"",
  choices:[{t:"Read it to the end",go:()=>{S.bond.maren++;return "The last line is plain: \"I am not good with words. I hope he knows.\" Maren slips it into your hand and says nothing at all."}},
   {t:"\"He never told me any of this.\"",go:()=>{S.bond.maren++;set("fam_poemKept");return "\"He told the book,\" Maren says. \"Maybe that's what poems are for. Can I keep reading them? To you?\""}}]},
 m2:{text:()=>has("marenPromise")?"Maren pins the map over her bed. \"Grandfather said he'd take me to the coast once, to see a whale. Then he got busy being a lord.\" She glances at you. \"Don't get busy.\"":"Maren rolls the map up very tight. \"Grandfather said he'd take me to the coast once, to see a whale. He never did. Lords never do, do they?\"",
  choices:[{t:"\"I'll take you myself. A whale.\"",go:()=>{S.bond.maren++;set("fam_whale");return "\"A whale,\" she says. \"An actual whale. I'm writing that down, Father. With the date.\""}},
   {t:"\"Whales are mostly smell, I'm told.\"",go:()=>{S.bond.maren++;return "\"You're impossible,\" she says, but she's laughing, and she adds a small, smelly whale to the edge of her map."}},
   {t:"\"Some lords keep their promises.\"",req:()=>!has("marenPromise"),go:()=>{set("fam_whale");return "She looks at you a long time. \"Prove it, then.\" It isn't a challenge. It's almost hope."}}]},
 m3:{text:()=>has("ysoldeCharmed")?"Late that night Maren is still glowing. \"Ysolde says my verses have 'a dangerous honesty.' Is that good? It sounds good. Father, I was so scared my hands shook. Did you see?\"":"Maren is at her desk, tearing a poem into very small pieces. \"I wrote that for Ysolde. It would have helped. I'm not a child, Father. I'm trying to keep our home too.\"",
  choices:[{t:"\"I didn't see a thing.\"",req:()=>has("ysoldeCharmed"),go:()=>{S.bond.maren++;return "\"Liar,\" she says happily. \"But a kind one.\""}},
   {t:"\"Mine shake at every council.\"",req:()=>has("ysoldeCharmed"),go:()=>{S.bond.maren++;return "Her eyes go wide. \"Truly?\" \"Truly.\" She looks at you as if you'd told her the best secret in Emberfall."}},
   {t:"\"You're right. I'm sorry.\"",req:()=>!has("ysoldeCharmed"),go:()=>{S.bond.maren++;return "She stops tearing. \"Say that again. Slowly. I want to remember it.\""}},
   {t:"Help her piece the poem back together",req:()=>!has("ysoldeCharmed"),go:()=>{S.bond.maren++;return "It takes an hour and most of a pot of paste. The poem is lumpy now, and somehow better. She pins it on her wall."}}]},
 m4:{text:()=>has("corvinPact")?"Maren stares at the fire. \"When Grandfather was ill, Corvin brought Edwy along. Edwy ate the honey cakes off the sickroom tray. Grandfather couldn't eat, and Edwy just... ate them.\"":"Much later, Maren is still holding your hand. \"Corvin will hate you now. Properly hate you.\" She sniffs. \"Good. I'd rather be hated with you than married to Edwy.\"",
  choices:[{t:"\"I'm sorry, Maren.\"",req:()=>has("corvinPact"),go:()=>{S.bond.maren++;return "\"Sorry is a start,\" she says. \"It isn't a finish.\""}},
   {t:"\"Tell me what else you saw then.\"",req:()=>has("corvinPact"),go:()=>{set("fam_marenSickroom");return "She does: who came and went, who carried the tray, who poured. She was only a child. She remembers all of it anyway."}},
   {t:"\"You'll marry whoever you like.\"",req:()=>!has("corvinPact"),go:()=>{S.bond.maren++;return "\"Whoever I like,\" she repeats. \"I'll hold you to that. In writing.\""}},
   {t:"\"We'll need every vote now.\"",req:()=>!has("corvinPact"),go:()=>{fx({favor:1});return "\"Then let me help win them,\" she says, and she's already reaching for paper."}}]},
 m5:{text:"Maren lowers her voice. \"Grandfather drank from anyone's cup. He'd steal yours if he liked it better. Corvin won't touch anyone's, not even his own. What kind of man is afraid of a cup?\"",
  choices:[{t:"\"One who knows what can be in it.\"",go:()=>{S.bond.maren++;set("fam_marenKnows");return "She goes very still. Then she nods once, like a lord. She doesn't ask anything else tonight."}},
   {t:"\"A careful one. Like you.\"",go:()=>{S.bond.maren++;return "\"I'm careful,\" she says. \"I'm not frightened of cups.\" She takes yours and drinks from it, to prove it."}}]},

 /* ---------------- TOBIN ---------------- */
 t1:{text:()=>has("tobinStudy")?"In the library, Tobin finds a ledger in Grandfather's hand. Every margin has a tiny drawing: horses, a fish, Aldric with an enormous nose. \"Father. Grandfather drew Aldric.\"":"Later, scraping off the mud, Tobin asks, \"Did Grandfather teach you to fight? Was he good?\" He's trying very hard to sound like it doesn't matter.",
  choices:[{t:"\"Don't tell Aldric.\"",req:()=>has("tobinStudy"),go:()=>{S.bond.tobin++;return "Tobin tells Aldric the next morning. Aldric studies the drawing a long time, says the nose is unfair, and keeps it."}},
   {t:"\"Draw one of me.\"",req:()=>has("tobinStudy"),go:()=>{S.bond.tobin++;return "He does. You have a very large crown and very small legs. It's annoyingly accurate."}},
   {t:"\"He knocked me in the mud too.\"",req:()=>!has("tobinStudy"),go:()=>{S.bond.tobin++;return "\"Every day. Then he'd pull me up and say: again.\" Tobin grins, and picks up his sword. \"Again.\""}},
   {t:"\"He was better than me.\"",req:()=>!has("tobinStudy"),go:()=>{S.bond.tobin++;set("fam_tobinRoderick");return "\"Then I'll be better than both of you,\" Tobin says, and he means it."}}]},
 t2:{text:()=>has("tobinAtGate")?"Later, Tobin knocks on your door in his nightshirt. \"Father? If I'm scared at the gate, and I run... would you still...\" He can't finish it.":"Later, Tobin knocks on your door in his nightshirt. \"Father? The most important post in the castle. You weren't just saying that?\"",
  choices:[{t:"\"Nothing you do could change that.\"",req:()=>has("tobinAtGate"),go:()=>{S.bond.tobin++;return "He nods, too fast, and hugs you, and goes back to bed. You don't sleep at all."}},
   {t:"\"You won't run. I know you.\"",req:()=>has("tobinAtGate"),go:()=>{S.bond.tobin++;set("fam_tobinSteady");return "\"How do you know?\" \"Because you came and asked.\" He thinks about that. He likes it."}},
   {t:"\"If the gate falls, you're the last wall.\"",req:()=>!has("tobinAtGate"),go:()=>{S.bond.tobin++;return "His face goes very serious. \"The last wall,\" he says. From then on he sleeps with his sword beside the bed."}},
   {t:"\"Your mother can outshoot you.\"",req:()=>!has("tobinAtGate")&&has("fam_elinorBow"),go:()=>{S.bond.tobin++;return "\"She can not!\" She can. He finds out the next day, and spends a week sulking and practicing."}},
   {t:"\"I was saying it. A little.\"",req:()=>!has("tobinAtGate")&&!has("fam_elinorBow"),go:()=>"\"I knew it!\" But he laughs, and he guards that door anyway, every night, all summer."}]},
 t3:{text:"Tobin holds out his hands. They've almost stopped shaking. \"Did you feel like this, Father? After your first fight? Does everyone?\"",
  choices:[{t:"\"This was my first real fight too.\"",go:()=>{S.bond.tobin++;return "He stares at you. \"You looked like you knew what you were doing.\" \"So did you.\" That's the secret, it turns out."}},
   {t:"\"I still feel like this.\"",go:()=>{S.bond.tobin++;return "\"Good,\" he says, which surprises you. \"I don't ever want to be someone who doesn't.\""}}]},
 t4:{text:()=>has("tobinEarn")?"Tobin pulls a straw out of his hair. \"Wynn says I swing like I'm angry at the sword. Am I angry, Father? I don't know what at.\"":"Tobin kicks at the straw. \"I know you needed me safe. But everyone looks at me like I'm still small. Even the cook's boy. Especially the cook's boy.\"",
  choices:[{t:"\"At not being there.\"",req:()=>has("tobinEarn"),go:()=>{S.bond.tobin++;return "He thinks. \"At not being there,\" he agrees. The next morning Wynn says he swings like a soldier."}},
   {t:"\"At the cook's boy, probably.\"",req:()=>has("tobinEarn"),go:()=>{S.bond.tobin++;return "Tobin laughs despite himself. \"He shows everyone his scar. It's barely a scratch.\""}},
   {t:"\"Then make them look again.\"",req:()=>!has("tobinEarn"),go:()=>{S.bond.tobin++;set("fam_tobinYard");return "A pause. \"Wynn trains anyone who's up before the cook's boy.\" He's in the yard at dawn."}},
   {t:"\"You'll be tall soon enough.\"",req:()=>!has("tobinEarn"),go:()=>"\"Mother says that,\" he grumbles. \"Mother also says carrots help.\" He eats all his carrots at supper anyway."}]},
 t5:{text:()=>has("rebelSeed")?"Tobin drops to a whisper that carries across the whole room. \"When we stand, Father, can I have a horse? A proper one? Not Old Barley?\"":"Tobin is quiet for a while. \"The stable boys say Grandfather would never have knelt. Not to anyone. Is that true?\"",
  choices:[{t:"\"Quieter. Your voice, not the horse.\"",req:()=>has("rebelSeed"),go:()=>{S.bond.tobin++;return "He whispers again, quieter. \"A proper horse.\" You promise him a proper horse. Old Barley looks offended."}},
   {t:"\"If you can keep a secret.\"",req:()=>has("rebelSeed"),go:()=>{set("fam_tobinSecret");return "He keeps it so well he stops talking to the stable boys entirely. It's very suspicious. You'll teach him that part later."}},
   {t:"\"He knelt once. Before you were born.\"",req:()=>!has("rebelSeed")&&has("fam_kneltLore"),go:()=>{S.bond.tobin++;return "Tobin's eyes go wide. \"And then?\" \"And then he stood up again.\" He sleeps better that night."}},
   {t:"\"He'd have fought. And lost.\"",req:()=>!has("rebelSeed"),go:()=>{S.bond.tobin++;return "\"And then I wouldn't have a father,\" Tobin says slowly. \"I'd rather have a father.\""}},
   {t:"\"I don't know. I wish I could ask him.\"",req:()=>!has("rebelSeed")&&!has("fam_kneltLore"),go:()=>{S.bond.tobin++;return "\"Me too,\" Tobin says, and leans on you. \"He'd have shouted. Then he'd have helped.\""}}]},
 t6:{text:"Tobin sits on the bed, blanket still round his shoulders. \"Father, the vow says 'defend the weak.' But how do you tell who's weak? Mother looks gentle, and she terrifies the whole Guild.\"",
  choices:[{t:"\"Defend whoever needs it tonight.\"",go:()=>{S.bond.tobin++;return "\"Tonight,\" he says slowly. \"And then again tomorrow.\" He's going to be a good knight. You can see it already."}},
   {t:"\"Never defend anyone from your mother.\"",go:()=>{S.bond.tobin++;return "\"Obviously,\" he says. \"I'm not stupid.\""}}]},
};

const TALK_NEW={
 elinor:[
  {id:"fam_e8",when:()=>S.month>=2&&S.month<=4&&famHere("maren")&&(has("marenBetrothed")||has("marenChoice")||has("refusedHarwin")),
   text:()=>has("marenBitter")?"Elinor brushes her hair hard enough to hurt. \"Maren won't speak to me either. She thinks I agreed to Harwin's boy. I didn't argue, love. To her, that's the same thing.\""
    :has("marenLoves")||has("marenChoice")?(has("marenNoLetters")?"Elinor brushes out her hair, smiling. \"Maren is still writing to Edric, you know. In secret. Four letters this week. I counted.":"Elinor brushes out her hair, smiling. \"Maren has written to Edric four times this week. I counted.")+" I met you two days before our wedding, love. Imagine getting to choose.\""
    :has("marenBetrothed")?"Elinor brushes out her hair. \"I met you two days before our wedding. I cried for a week first. Now Maren is crying, and I don't know if I should tell her it turned out well.\""
    :"Elinor brushes out her hair. \"Maren thanked me today, for refusing Harwin. I didn't have the heart to tell her it was you.\" She smiles in the mirror. \"Was it the right thing?\"",
   choices:[{t:"\"Did it turn out well?\"",go:()=>{S.bond.elinor++;return "\"Mostly,\" she says. \"You still snore. But mostly.\" She puts down the brush and kisses your forehead."}},
    {t:"\"Talk to her. You, not me.\"",go:()=>{S.bond.maren++;return "Elinor goes that night. Through the wall you hear them talking, then laughing at something. Possibly you."}}],
   then:{text:"Elinor sets the brush down. \"Do you know what frightened me most, when I married you? Not you. Leaving my mother's table, and knowing she'd go on setting it without me.\"",
    choices:[{t:"\"Maren will always have a place here.\"",go:()=>{S.bond.maren++;set("fam_marenPlace");return "\"Tell her that,\" Elinor says. \"Not me. Her.\" You do, the next morning. Maren pretends not to care, and doesn't."}},
     {t:"\"Do you miss your mother's table?\"",go:()=>{S.bond.elinor++;return "\"Every feast day,\" she says. \"Then I look down this one and see all of you, and it's bearable.\""}}]}},
  {id:"fam_e9",when:()=>has("corvinClaim")&&S.month>=7&&S.month<=9,
   text:()=>has("corvinGuest")?"After supper Elinor shuts the door with her hip. \"Corvin praised my soup three times tonight. Nobody praises my soup, love. My soup is not good. What does he want from me?\""
    :"Elinor stirs the fire. \"When Corvin came to dinner, back when your father was alive, he always sat by me. He asked about everything. I thought he was charming. I told him so much.\"",
   choices:[{t:"\"Whatever you'll let slip.\"",req:()=>has("corvinGuest"),go:()=>{S.bond.elinor++;set("fam_elinorWary");return "\"Then he'll get soup,\" she says grimly. \"Only soup. All the soup he can eat.\""}},
    {t:"\"Your soup is wonderful.\"",req:()=>has("corvinGuest"),go:()=>{S.bond.elinor++;return "She gives you a long look. \"Now I'm worried about you as well.\""}},
    {t:"\"What did you tell him?\"",req:()=>!has("corvinGuest"),go:()=>{set("fam_elinorWary");return "She goes pale, counting it up. Which room was Roderick's. Who carried his tray. When the guard changed. \"Everything, love.\""}},
    {t:"\"You couldn't have known.\"",req:()=>!has("corvinGuest"),go:()=>{S.bond.elinor++;return "\"No,\" she says. \"But I know now.\""}}],
   then:{text:"Elinor sits on the bed. \"Your father loved Corvin, you know. Taught him to ride. When Corvin was seven he fell off a pony into the moat, and Roderick jumped in after him. In his good boots.\"",
    choices:[{t:"\"And Corvin repaid him with poison.\"",req:()=>hasClue("vial")||hasClue("wine"),go:()=>{S.bond.elinor++;return "Elinor takes your hand. \"Then make sure the lords hear that story too. The boots, and how it ended.\""}},
     {t:"\"People change.\"",go:()=>"\"Or they don't,\" Elinor says. \"And we just stop looking.\""},
     {t:"\"Tell me more about Father.\"",go:()=>{S.bond.elinor++;set("fam_roderickStories");return "She tells you about the boots, the pony, and the dog he smuggled into chapel. It's very late when she stops."}}]}},
  {id:"fam_e10",when:()=>S.month>=11&&has("corvinFight")&&!has("councilLost"),
   text:"Elinor is mending your good cloak for Kingsreach. She is very bad at mending. \"If the vote goes wrong,\" she says without looking up, \"where would we go?\"",
   choices:[{t:"\"The Marches. Harwin owes us.\"",req:()=>has("harwinAlly")||has("marenWed"),go:()=>{S.bond.elinor++;return "\"Harwin's wife hates me,\" she says. \"But she hates everyone. We'd manage.\""}},
    {t:"\"A little farm. With geese.\"",go:()=>{S.bond.elinor++;set("fam_geese");return "\"Geese,\" she says. \"You'd be terrified of them.\" \"I would.\" \"I'd protect you.\" She's smiling now."}},
    {t:"\"It won't go wrong.\"",go:()=>{fx({favor:1});return "\"Say it at Kingsreach exactly like that,\" she says. \"Even if you don't believe it.\""}}],
   then:{text:()=>has("fam_geese")?"\"I'd name the geese after the lords,\" Elinor decides. \"The loud one is Pell.\" She bites off the thread. The cloak has a lump in it now. \"There. Fit for a King.\""
     :"Elinor bites off the thread. The cloak has a lump in it now. \"There. Fit for a King. Your father wore this to Kingsreach once. He spilled a jug of wine on the floor and blamed the dog.\"",
    choices:[{t:"Wear the lumpy cloak anyway",go:()=>{S.bond.elinor++;fx({favor:1});return "You wear it to Kingsreach. Nobody notices the lump. Elinor knows it's there, and that's the point."}},
     {t:"\"Will you come with me?\"",go:()=>{S.bond.elinor++;set("fam_elinorKingsreach");return "\"Try and stop me,\" she says. \"Somebody has to stand behind you and glare at Corvin.\""}}]}},
 ],
 maren:[
  {id:"fam_m6",when:()=>famHere("maren")&&S.month>=6&&S.month<=8,
   text:"Maren has found a box under Grandfather's bed: letters, dozens of them, all addressed to you, none of them sent. \"He wrote to you, Father. For years. He just never gave them to you.\"",
   choices:[{t:"Read one together",go:()=>{S.bond.maren++;return "It's about a fish you caught when you were six. It's three pages long. Maren reads the fish part twice, with feeling."}},
    {t:"\"Keep them for me. Not yet.\"",go:()=>{set("fam_lettersKept");return "She ties them up again with the old ribbon, very carefully. \"Whenever you're ready,\" she says."}}],
   then:{text:()=>has("corvinClaim")?"One letter slips from the bundle. The hand is shaky. \"It only says: 'Corvin sits with me again tonight. He is kind to come. I wish it were you.'\"":"One letter slips from the bundle. The hand is shaky. \"It only says: 'Tired today. The boy would laugh at my poems. I wish he were here to laugh.'\"",
    choices:[{t:"\"I wish it had been me.\"",go:()=>{S.bond.maren++;return "Maren puts her arms round you, the way she did when she was small, and holds on."}},
