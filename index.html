<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Emberfall: My Lord</title>
<style>
@font-face{font-family:'Pixelify Sans';src:url('fonts/PixelifySans.ttf') format('truetype');font-weight:400 700;font-display:block}
@font-face{font-family:'Cinzel';src:url('fonts/Cinzel.ttf') format('truetype');font-weight:400 900;font-display:block}
@font-face{font-family:'Alegreya';src:url('fonts/Alegreya.ttf') format('truetype');font-weight:400 900;font-display:block}
@font-face{font-family:'Alegreya';src:url('fonts/Alegreya-Italic.ttf') format('truetype');font-weight:400 900;font-style:italic;font-display:block}
:root{--pixel:'Pixelify Sans',monospace;--display:'Cinzel',Georgia,serif;--book:'Alegreya',Georgia,serif;--ink:#2a1810;--parch:#efdcb2;--parch2:#e2c896;--gold:#f2c14e;--blood:#8a1f2a;--night:#0b0710}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--night);font-family:var(--book);overflow:hidden;color:var(--ink)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.px{image-rendering:pixelated}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:#120b16;overflow:hidden}
/* HUD */
#hud{background:#1a1220;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;border-bottom:3px solid #000;box-shadow:inset 0 -2px 0 #5a4020;z-index:2}
#stats{display:flex;justify-content:space-between}
.stat{font-family:var(--pixel);display:flex;align-items:center;gap:5px;color:#f4e2c0;font-size:20px;font-weight:700;position:relative;min-width:64px}
.stat img{width:24px;height:24px}
.stat small{display:block;font-size:10px;font-weight:400;color:#b8a080;letter-spacing:1px;line-height:1}
.stat b{line-height:1;display:inline-block;font-family:var(--book);font-weight:800;font-size:22px;font-variant-numeric:lining-nums tabular-nums}
.stat.bump b{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.45)}}
.float{font-family:var(--book);font-variant-numeric:lining-nums;position:absolute;left:28px;top:-2px;font-weight:700;font-size:16px;pointer-events:none;animation:up 1.4s forwards;text-shadow:2px 2px 0 #000}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
#hudrow{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
#daylbl{font-family:var(--pixel);color:var(--gold);font-size:14px;letter-spacing:2px;line-height:1.15}#daylbl small{display:block;color:#ff8a6a;font-size:11px;letter-spacing:1px}
.council{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:420px;margin:-4px 0 10px}.council span{font-size:13px;color:#c8b498;background:#1e1424;border:2px solid #000;padding:3px 8px}.council b{font-family:var(--display);color:#f2c14e;font-size:12px;margin-right:4px}.council span.away{opacity:.5}
.ch .cost.agent{color:#3a5a8a}.ch .cost.sub{color:#8a2a5a;font-style:italic}
.hb{font-family:var(--pixel);background:#2e2234;color:#f4e2c0;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;font-size:13px;padding:3px 9px;margin-left:6px;cursor:pointer}
/* scene */
#scene{display:none}
#sceneWide{display:block;width:100%;aspect-ratio:192/120;height:auto;background:#000}
/* dialog */
#dialog{flex:1;margin:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--parch);border:4px solid var(--ink);
 box-shadow:inset 0 0 0 3px #c9a46a,inset 0 0 30px rgba(140,90,30,.35),0 4px 0 #000;padding:12px 12px 10px;overflow-y:auto;position:relative}
.head{display:flex;gap:10px;align-items:center}
#pbox{width:84px;height:84px;flex:none;background:#2a1d2e;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #6a4a2a;position:relative;overflow:hidden}
#pbox::after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(0,0,0,.35))}
#portrait{width:78px;height:78px}
#who{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px;color:var(--blood);line-height:1.1}
#role{font-style:italic;font-size:16px;color:#6a4a2a;margin-top:2px}
#txt{font-size:20px;line-height:1.38;margin:10px 2px 8px;min-height:4.2em;white-space:pre-line}
#txt.wait{color:#8a6a4a;font-style:italic}
#choices{display:flex;flex-direction:column;gap:9px;padding-bottom:4px}
.ch{font-family:var(--book);font-size:18.5px;line-height:1.25;text-align:left;padding:10px 12px 10px 28px;background:#fff4dc;color:var(--ink);border:3px solid var(--ink);
 box-shadow:0 4px 0 var(--ink);cursor:pointer;position:relative;animation:slide .3s backwards}
.ch::before{content:"▸";position:absolute;left:10px;color:#a03020}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ch:disabled{opacity:.45}
.ch .cost{font-variant-numeric:lining-nums;display:flex;gap:8px;font-size:13px;color:#7a4a2a;margin-top:3px;align-items:center}
.ch .cost img{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.ch.go{font-family:var(--display);font-size:17px;background:#a8322a;color:#fff4dc;text-align:center;padding-left:12px;font-weight:700;letter-spacing:1px}
.ch.go::before{content:""}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
/* overlays */
#overlay,#modal{position:absolute;inset:0;display:none;flex-direction:column;background:var(--night);z-index:10;overflow-y:auto}
#modal{z-index:20;background:rgba(5,3,8,.82);align-items:center;justify-content:center;padding:20px}
.cwrap{position:relative;flex:none}
#castle{width:100%;height:auto}
.logo{position:absolute;left:0;right:0;top:3%;text-align:center;pointer-events:none;animation:fade 1.6s}
.logo h1{font-family:var(--pixel);margin:0;font-size:min(13vw,62px);font-weight:700;color:var(--gold);letter-spacing:3px;
 text-shadow:2px 0 #120604,-2px 0 #120604,0 2px #120604,0 -2px #120604,2px 2px #120604,-2px 2px #120604,2px -2px #120604,-2px -2px #120604,0 5px #6a220c,0 0 16px rgba(255,140,40,.32)}
.logo h1{font-family:var(--display);font-weight:900;letter-spacing:4px;padding-left:4px}
.logo h2{font-family:var(--pixel);margin:4px 0 0;color:#f4e2c0;letter-spacing:9px;font-size:18px;text-shadow:2px 2px 0 #000}
.ovb{flex:1;padding:18px 22px calc(env(safe-area-inset-bottom) + 20px);text-align:center;color:#f4e2c0;display:flex;flex-direction:column;align-items:center;animation:fade .8s}
.ovb h3{font-family:var(--display);font-weight:700;font-size:26px;color:var(--gold);margin:4px 0 8px;text-shadow:3px 3px 0 #000}
.ovb p{font-size:19px;line-height:1.4;max-width:440px;margin:6px 0}
.ovb .dim{opacity:.65;font-size:15px}
.pb{font-family:var(--display);font-size:17px;font-weight:700;min-width:240px;margin:6px;padding:11px 16px;background:#a8322a;color:#fff4dc;border:3px solid #000;
 box-shadow:inset 0 0 0 2px #e0705a,0 4px 0 #000;cursor:pointer;letter-spacing:1px}
.pb.alt{background:#3a2c40;box-shadow:inset 0 0 0 2px #6a5070,0 4px 0 #000}
.pb:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #e0705a,0 1px 0 #000}
.sumrow{font-variant-numeric:lining-nums tabular-nums;display:flex;justify-content:space-between;width:250px;font-size:18px;margin:3px 0}
.sumrow img{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.box{background:#1e1424;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a4020;padding:18px;color:#f4e2c0;max-width:420px;width:100%;max-height:85%;overflow:auto;text-align:center;animation:fade .3s}
.box h3{font-family:var(--display);color:var(--gold);margin:0 0 12px;font-size:24px}
.box ul{text-align:left;padding-left:18px;font-size:16px;line-height:1.45}
.elist div{padding:7px 4px;border-bottom:1px dashed #4a3a50;font-size:16px;text-align:left}
.elist .lock{opacity:.68}
.bld{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:400px;background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 10px;margin:4px 0;text-align:left}
.bld b{font-family:var(--display);color:#f2c14e;font-size:16px}.bld small{display:block;color:#b8a488;font-size:13px}
.bld button{font-family:var(--book);font-variant-numeric:lining-nums;font-size:16px;font-size:14px;font-weight:700;background:#a8322a;color:#fff4dc;border:2px solid #000;padding:6px 10px;cursor:pointer;white-space:nowrap}
.bld button:disabled{opacity:.4}.bld.done{opacity:.55}
.resbar{display:flex;justify-content:space-between;width:100%;max-width:420px;background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 14px;margin:0 0 12px;position:sticky;top:0;z-index:2}
.resbar div{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;color:#f4e2c0;font-variant-numeric:lining-nums tabular-nums}
.resbar img{width:20px;height:20px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;margin:6px 0}
.room{font-family:var(--book);text-align:left;background:#2a1d2e;color:#f4e2c0;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a4020,0 4px 0 #000;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:100px;position:relative}
.room:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #5a4020,0 1px 0 #000}
.room .rh{display:flex;align-items:center;gap:8px}.room img{width:26px;height:26px}
.room b{font-family:var(--display);color:#f2c14e;font-size:15px;line-height:1.1}
.room small{color:#c8b498;font-size:15px;line-height:1.25}
.room em{position:absolute;top:6px;right:8px;font-style:normal;color:#9ef08a;font-weight:800}
.room em.bang{color:#fff4dc;background:#a8322a;border:2px solid #000;width:22px;height:22px;display:flex;align-items:center;justify-content:center;animation:bob 1s infinite alternate}
.room.story{box-shadow:inset 0 0 0 2px #f2c14e,0 4px 0 #000}.room em.bang.gold{background:#f2c14e;color:#2a1810}.must{color:#f2c14e!important;font-weight:700}
.evc.story{box-shadow:inset 0 0 0 2px #f2c14e}.evc .sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.evc .sh canvas{width:48px;height:48px;background:#2a1d2e;border:2px solid #000}.evc .sh b{font-family:var(--display);color:var(--blood);font-size:18px}.evc p{white-space:pre-line}
.pb:disabled{opacity:.45}
.panel{display:flex;flex-direction:column;align-items:center;width:100%}.panel .dim{color:#b8a488;font-size:15px;margin:0 0 8px}.panel h3.sm{font-size:19px;margin:14px 0 6px}
#castle.map{cursor:pointer}
.room.done{box-shadow:inset 0 0 0 2px #3e8a34,0 4px 0 #000}.room.ev{box-shadow:inset 0 0 0 2px #e0705a,0 4px 0 #000}
@keyframes bob{to{transform:translateY(-3px)}}
.ovb h3.sm{font-size:19px;margin:14px 0 6px}
.ledger{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.taxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin-bottom:10px}
.tx{font-family:var(--book);background:#2a1d2e;color:#f4e2c0;border:3px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tx b{font-family:var(--display);color:#f2c14e}.tx small{font-size:13px;color:#b8a488;line-height:1.2}
.tx.on{background:#5a2420;box-shadow:inset 0 0 0 2px #f2c14e}
.bld .gain{color:#9ec88a!important}.btns.sq{display:grid!important;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.btns.sq button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;font-family:var(--book);line-height:1.15}
.btns.sq button b{font-family:var(--display);font-size:12px;color:#fff4dc}.btns.sq button span{font-size:13px;color:#f4d8c0}
.btns.sq em{font-style:normal;font-size:12px;font-weight:700;margin-top:2px}.btns.sq em.good{color:#b8f0a0}.btns.sq em.ok{color:#f2d080}.btns.sq em.meh{color:#f0a860}.btns.sq em.bad{color:#ffb0a0}
.bld.col{flex-direction:column;align-items:stretch}.bld .btns{display:flex;gap:6px;flex-wrap:wrap}
.fam{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;margin:8px 0}
.famb{background:#2a1d2e;border:3px solid #000;box-shadow:inset 0 0 0 1px #5a4020,0 4px 0 #000;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#f2c14e;font-family:var(--display)}
.famb canvas{width:72px;height:72px;background:#1c1420}
.famtxt,.evc{width:100%;max-width:420px;background:var(--parch);color:var(--ink);border:3px solid #000;box-shadow:inset 0 0 0 2px #c9a46a;padding:12px 14px;margin:6px 0 10px;text-align:left}
.famtxt p,.evc p{color:var(--ink)!important;margin:0 0 8px}.famtxt .dim{color:#7a4a2a!important;font-style:italic;opacity:1}
.evc .ch{width:100%;margin-top:8px}.evc.done{opacity:.85}
.summary{width:100%;max-width:420px;text-align:left}.summary h3.sm{text-align:center}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nums div{background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 4px;text-align:center}.nums b{display:block;font-size:24px;color:#f2c14e;font-variant-numeric:lining-nums}.nums small{font-size:13px;color:#b8a488;line-height:1.15;display:block}.summary ul{font-size:16px;line-height:1.4;color:#d8c8a8;padding-left:20px}
.elist .lock small{display:block;font-size:14px;font-style:italic;opacity:.9}
.siege p{opacity:0;animation:appear 1s forwards}
@keyframes appear{to{opacity:1}}
#tip{position:absolute;inset:0;z-index:35;background:rgba(5,3,8,.7);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s}#tip .box{text-align:left}#tip h3{text-align:center}#tip p{font-size:17px;line-height:1.45}#tip .pb{display:block;margin:12px auto 0}
.stat{cursor:pointer}
.bigtext #txt{font-size:23px}.bigtext .ch{font-size:20.5px}.bigtext .ovb p,.bigtext .box p{font-size:20px}.bigtext #role{font-size:17px}.bigtext .room small{font-size:16px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 44px);bottom:auto;transform:translate(-50%,-12px);background:#1a1220;color:#f4e2c0;border:2px solid #000;box-shadow:inset 0 0 0 1px #c9a46a;padding:10px 14px;font-size:16px;z-index:40;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.toastlow #toast{top:auto;bottom:calc(env(safe-area-inset-bottom) + 70px)}
#card{font-family:var(--pixel);position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,3,8,.85);color:var(--gold);pointer-events:none}
#card b{font-size:54px;text-shadow:4px 4px 0 #3a1408;animation:pop .6s}
#pips{display:flex;gap:4px;margin-top:16px}#pips i{width:14px;height:14px;border:2px solid #000;display:block}#pips i.now{outline:2px solid #fff4dc;transform:scale(1.25)}#pips i.past{opacity:.35}
#card span{color:#f4e2c0;font-size:16px;letter-spacing:4px;margin-top:6px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}}
@keyframes fade{from{opacity:0}}
/* ---------- Landscape: the hall fills the screen, a text box runs along the bottom with the choices on its right ---------- */

 #stats{flex:1;justify-content:flex-start;gap:clamp(14px,3vw,34px)}

  padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1.35fr) minmax(230px,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:12px;opacity:.97}

}

 /* title: the castle fills the screen, logo on top, the menu along the bottom */
 #overlay.ts,#overlay.fb{display:block;overflow:hidden}

/* Battery: while nothing on screen moves quickly, only every other frame is painted (30 fps). The skipped frame
   still runs every update (ticks, particles, walkers, random flicker) against a context that draws nothing, so
   every animation keeps its speed and every painted frame is the same picture it would have been at 60 fps. */
const NUL=(()=>{const n={},P=CanvasRenderingContext2D.prototype,gr={addColorStop(){}};
 for(const k of Object.getOwnPropertyNames(P)){const d=Object.getOwnPropertyDescriptor(P,k);if(typeof d.value==="function")n[k]=()=>{};else if(d.get&&k!=="canvas")n[k]=wctx[k]}
 n.createLinearGradient=n.createRadialGradient=n.createConicGradient=()=>gr;n.createPattern=()=>null;n.measureText=()=>({width:0});n.getLineDash=()=>[];n.isPointInPath=n.isPointInStroke=()=>false;
 n.getTransform=()=>new DOMMatrix();n.getContextAttributes=()=>({});return n})();
const LOOP={n:0,nul:false,off:false,full:true,drawn:new WeakSet()};
// anything quick enough to judder at 30 fps (the limits are in each canvas's own pixels, about 2 screen points per frame)
const fastParts=(a,lim)=>{if(a)for(const p of a)if(Math.abs(p.vx||0)+Math.abs(p.vy||0)>lim)return true;return false};
function busy(full,cc,wm,nm){
 const w=SC.walker;// a petitioner standing still only breathes and blinks
 if((w&&(w.waitDoor||Math.abs(w.target-w.x)>.5))||SC.fade>0||SC.shake>0||SC.emote||SC.talk||SC.cere||Math.abs(SC.door-SC.doorT)>.005||BT.on||(TY&&TY.typing)||WMAP.march)return true;
 if(!full&&fastParts(SC.parts,.6))return true;
 if(cc&&(CS.mode.startsWith("world")||fastParts(CS.parts,.38)))return true;
 if(nm&&fastParts(NM.parts,.55))return true;
 if(wm&&fastParts(WMAP.parts,.55))return true;
 return false}
function loop(){
 if(document.hidden){LOOP.off=true;return}// stopped while the app is in the background; visibilitychange restarts it
 // a drawing error must never stop the loop: the frame is skipped and the next one carries on
 try{loopFrame()}catch(e){LOOP.nul=false;if((LOOP.errs=(LOOP.errs||0)+1)<4)console.error(e)}
 requestAnimationFrame(loop)}
function loopFrame(){
 /* a screen that covers everything doesn't need the hall painted underneath it */
 const ov=$("overlay"),full=ov.style.display==="flex"&&/^(nm|wm|ts|fb|pl)$/.test(ov.className);
 const skip=(++LOOP.n&1)===1&&!busy(full,$("castle"),$("wmap"),$("nmap"));
 LOOP.nul=skip&&!(LOOP.full&&!full);// the hall is always painted on the first frame it shows again
 if(!full)drawScene();else SC.t++;
 LOOP.full=full;
 if(SC.t%6===0)fitDialog();
 // looked up again: the scene may have just opened an overlay. A canvas that was just created is painted at once.
 const ctxOf=c=>{if(skip&&LOOP.drawn.has(c))return NUL;LOOP.drawn.add(c);return c.getContext("2d")};
 const cc=document.getElementById("castle"),wm=document.getElementById("wmap"),nm=document.getElementById("nmap");
 if(cc){const cx=ctxOf(cc);cx.setTransform(2,0,0,2,0,0);cx.imageSmoothingEnabled=false;drawCastle(cx)}
 if(wm){const wx=ctxOf(wm);wx.setTransform(2,0,0,2,0,0);wx.imageSmoothingEnabled=false;wmFrame(wx)}
 if(nm&&S){const nx=ctxOf(nm);nx.setTransform(2,0,0,2,0,0);nx.imageSmoothingEnabled=false;drawNightMap(nx)}
 LOOP.nul=false;
 drawPortrait(pctx,PCHAR,{mouth:SC.talk?mouthOf():0,blink:((SC.t)%200)<6})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&LOOP.off){LOOP.off=false;requestAnimationFrame(loop)}});

{m:5,who:"eastlord",req:()=>has("marenBetrothed")&&!has("knelt"),text:"Harwin has ridden ahead of his men. \"Maren marries my Edric at harvest. That makes us family. My forty lances are on the road behind me.\"",
 choices:[{t:"\"Emberfall is grateful.\"",go:()=>{set("harwinAlly");fx({favor:3});note("Lord Harwin pledged his lances.");return "He clasps your arm. \"Family is family.\""}}]},
{m:4,who:"aldric",req:()=>has("refusedHarwin"),text:"A letter from Lord Harwin, three lines long. \"You refused my son. The Marches will remember the insult.\"",
 choices:[{t:"Send gold as an apology",cost:{gold:20},go:()=>{fx({gold:-20});return "Harwin's answer is one line: \"Gold mends pride, if not friendship.\""}},
  {t:"\"So be it.\"",go:()=>{set("harwinEnemy");return "You burn the letter. Nobody mentions the Marches again."}}]},
{m:4,who:"herald",req:()=>!has("knelt"),text:"Hear the word of King Osmund! The crown is aware of strife between Emberfall and Vex. The King will favor whichever lord keeps the King's peace... or wins.",
 choices:[{t:"Send the King a gift",cost:{gold:15},go:()=>{fx({gold:-15});set("kingFavor");return "\"His Majesty will hear of Emberfall's loyalty.\""}},
  {t:"Ask the King for aid",go:()=>"\"The King's armies are in the north. You stand alone.\""}]},
{m:5,who:"morwen",req:()=>has("witchPact")&&!has("knelt"),text:"Later has come, little lord. My price: when the fire comes, you'll let me burn Baron Vex myself. And afterward, the fen is mine. No priests. No laws.",
 choices:[{t:"Honor the pact",go:()=>{set("witchFire");note("Honored Morwen's pact.");return "\"Good. The river will run red... with his blood, not yours.\""}},
  {t:"Break it",go:()=>{set("witchCurse");fx({food:-15,favor:-5});note("Broke Morwen's pact.");return "By noon the grain is rotting. Her laughter echoes in the walls."}}]},
{m:5,who:"tobin",req:()=>has("tobinRides")&&!has("knelt"),text:()=>"Tobin bursts into the war room, still in his riding cloak. \"Father! The patrol you let me ride with caught Vex's scouts at the mill this morning. We drove them back over the river! "+((S.doneScenes||[]).includes("tobinWound")?"And this time I didn't bleed!\"":"I... my hands won't stop shaking.\""),
 choices:[{t:"Hold him",go:()=>{set("tobinHardened");S.bond.tobin++;return "He shakes. Then he stops shaking. He's not a boy anymore."}},
  {t:"\"You did well.\"",go:()=>{set("tobinProud");fx({men:3});return "The men cheer him. He looks back at you for a long time."}}]},
{m:4,who:"tobin",req:()=>has("tobinStudy")&&!has("knelt")&&!has("tunnel")&&!has("tunnelSealed"),text:"Father, I went through the old ledgers with Aldric. There's a tunnel under the east wall. Great-grandfather used it for smuggling!",
 choices:[{t:"Use it to raid Vex's supplies",go:()=>{set("tunnelRaid");fx({food:15});note("Raided Vex's camp through the tunnel.");return "By noon your men bring back three wagons of Vex's grain."}},
  {t:"Keep it as an escape route",go:()=>{set("tunnel");return "If the walls fall, your family can live."}}]},
{m:5,who:"elinor",req:()=>!has("knelt"),text:()=>S.favor>=50&&!has("harsh")?"Whatever happens when Vex comes... I want you to know. You're a kinder lord than you give yourself credit for.":"Whatever happens when Vex comes... I want you to know. I'd marry you again. Every time.",
 choices:[{t:"\"Take the children and leave.\"",go:()=>{set("familySafe");return "\"I'll stay until the last moment. Then I'll go.\""}},
  {t:"\"We stand together.\"",go:()=>{set("familyStays");fx({favor:5});return "She takes your hand. It doesn't tremble."}}]},
{m:5,who:"aldric",req:()=>has("knelt"),text:"My lord... Vex's banners on the river. He hasn't come to fight. He wants your oath again, in person, in front of the whole city.",
 choices:[{t:"Kneel with your head high",go:()=>{fx({favor:3});return "You kneel in the square like a man doing a hard job well. Some of your people bow their heads with you."}},
  {t:"Kneel and say nothing",go:()=>"The words of the oath are short. The silence afterward is very long."}]},
{m:5,who:"aldric",req:()=>!has("knelt"),text:()=>"Aldric comes back from the wall walk, out of breath. \"My lord... Vex's banners are on the river. He's come at last. The council is waiting for your word, and so is every soul in Emberfall.\" (Our defenses look "+defenseWord(battlePower()).toLowerCase()+".)",
 choices:[{t:"Hold the walls",sub:"A steadier defense",go:()=>{set("plan_wall");return "Stones stacked, oil boiled. Let him come."}},
  {t:"Ride out and attack",sub:"Bold, and risky if your army is small",go:()=>{set("plan_attack");return "\"For Emberfall!\" The gates open."}},
  {t:"Parley with Vex",get sub(){return (has("kingFavor")&&S.favor>=50)||battlePower()>=70?"He'll have to listen to you":"Weak as you are, he'll demand your knee"},go:()=>{set("plan_parley");return "You ride out under a white banner."}},
  {t:"Flee through the tunnel",sub:"Abandon Emberfall for good",req:()=>has("tunnel"),go:()=>{set("plan_flee");return "Into the tunnel, family first. You don't look back."}}]},
/* ================= CHAPTER TWO: August to February ================= */
/* ---- AUGUST: after the battle ---- */
{m:6,who:"aldric",text:()=>has("outcome_peace")?"My lord. Not one grave dug this summer. Vex rode home with his tail between his legs, and he won't forget it. Now we hold the city through the winter.":has("vassal")?"My lord. Vex's banner flies over the gate. We are alive, and we are his. The people are waiting to see what kind of lord you'll be now.":has("vexWounded")?"My lord. We held, but the bells haven't stopped ringing for the dead. Vex limped home across the river. He'll be back.":"My lord. The bells are ringing for the dead and for the living. Emberfall is still yours. Now we must hold it through the winter.",
 choices:[{t:"Feed the city, whoever's banner flies",req:()=>has("vassal"),cost:{food:10},go:()=>{fx({food:-10,favor:5});return "Long tables in the square. Nobody toasts the Baron."}},
  {t:"Hold a feast for the fallen",req:()=>!has("vassal"),cost:{food:10},go:()=>{fx({food:-10,favor:6});return "Long tables in the square. They drink to the dead until the candles gutter."}},
  {t:"Pay the widows a pension",req:()=>!has("vassal"),cost:{gold:15},go:()=>{set("widowsPaid");fx({gold:-15,favor:8});note("Paid pensions to the widows of the battle.");return "Aldric writes their names into the ledger himself."}},
  {t:"\"Back to work. Winter won't wait.\"",go:()=>{fx({favor:-2});return "The city goes back to work. Quietly."}}]},
{m:6,who:"vexenvoy",req:()=>has("vexDead")&&!has("vassal"),text:"Sir Gerrit kneels in the dust of your hall, his helm in his hands. \"My master is dead, my lord. His men are leaderless and hungry on the far bank. What will you do with us?\"",
 choices:[{t:"Take them into your service",go:()=>{fx({men:15,favor:-3});set("vexMenSworn");note("Vex's soldiers swore to Emberfall.");return "Fifteen of Vex's soldiers swear on your banner. Your own soldiers watch them closely."}},
  {t:"Let them go home",go:()=>{fx({favor:4});return "They cross the river in silence. On the far bank, one of them raises a hand in thanks."}},
  {t:"Ransom them to their families",go:()=>{fx({gold:30,favor:-2});return "Thirty gold, paid in copper and tears."}}]},
{m:6,who:"vexenvoy",req:()=>has("vexWounded")&&!has("vexDead"),text:"Sir Gerrit, his arm in a sling. \"The Baron lives, my lord, and he remembers. He offers a truce until spring. Forty gold, and he stays on his side of the river.\"",
 choices:[{t:"Pay for the truce",cost:{gold:40},go:()=>{fx({gold:-40});set("vexTruce");note("Bought a truce from Vex until spring.");return "\"A wise purchase.\" He bows a little lower than last time."}},
  {t:"Send the Whisper across the river",agent:"spy",go:()=>{send("spy");set("vexRevenge");set("winterIntel");return "The Whisper comes back with Vex's plans for winter, and a scar of his own."}},
  {t:"\"Tell him to come back and finish it.\"",go:()=>{set("vexRevenge");fx({favor:4});note("Refused Vex's truce.");return "\"He will. When the river freezes.\""}}]},
{m:6,who:"vexenvoy",req:()=>has("vassal"),text:"Sir Gerrit sits beside your throne now, on a chair he brought himself. \"By the Baron's command, three of every ten coins in Emberfall's taxes go across the river. Starting this month.\"",
 choices:[{t:"\"As the Baron commands.\"",go:()=>{fx({favor:-3});return "Gerrit smiles. Your people don't."}},
  {t:"Smile, and start planning",go:()=>{set("rebelSeed");note("Began quietly planning against Vex.");return "You smile back. Aldric catches your eye across the hall, and nods."}}]},
{m:6,who:"morwen",req:()=>has("witchCourt"),text:"Morwen has taken the east tower. Green light burns in its windows all night. \"Tell your priest to stop crying, little lord. I saved your city. Now I'm staying.\"",
 choices:[{t:"Welcome her to court",go:()=>{set("morwenCourt");fx({favor:-3,food:8});note("Gave Morwen a place at court.");return "She curtsies, badly, on purpose. Cuthbert walks out of the hall. (The fen-folk bring eels and grain to your hall: +8 grain.)"}},
  {t:"Give her the fen, and nothing more",go:()=>{set("fenOnly");return "\"The fen, then. For now.\" She takes the stairs down two at a time."}},
  {t:"Order her gone",go:()=>{set("morwenBanished");set("witchCurse");note("Banished Morwen from Emberfall.");return "She laughs all the way to the gate. That night, the milk sours in every house in the city."}}]},
{m:6,who:"herald",req:()=>has("kingFavor")&&has("vexDead")&&!has("vassal"),text:"Hear the word of King Osmund! For breaking Baron Vex, the lands across the river are granted to the lord of Emberfall.",
 choices:[{t:"Rule them gently",go:()=>{set("vexLands");fx({favor:3});note("King Osmund granted you Vex's lands.");return "Vex's old villages send a cart of apples and a cautious welcome. (+10 gold a month)"}},
  {t:"Tax them hard. They followed Vex.",go:()=>{set("vexLands");set("landsHarsh");fx({gold:20,favor:-3});note("King Osmund granted you Vex's lands.");return "Gold flows across the river. So does resentment. (+16 gold a month)"}}]},
{m:6,who:"elinor",req:()=>has("marenBetrothed")&&has("harwinAlly"),text:"Elinor spreads a list across your lap. \"Harwin wants the wedding at harvest. Maren and Edric. The question is how much of the treasury you'd like to spend on it.\"",
 choices:[{t:"A grand wedding",cost:{gold:40},go:()=>{fx({gold:-40,favor:8});set("weddingSet");set("weddingGrand");return "Minstrels from three cities, and a cake taller than Tobin."}},
  {t:"A modest wedding",cost:{gold:15},go:()=>{fx({gold:-15,favor:3});set("weddingSet");return "\"Modest,\" Elinor repeats, unconvinced. \"Maren will understand.\""}},
  {t:"Delay it until spring",go:()=>{set("weddingDelay");delete S.f.harwinAlly;fx({favor:-2});return "Harwin's reply is short and very polite. Too polite. (Harwin's lances ride home to the Marches.)"}}]},
/* ---- SEPTEMBER: harvest ---- */
{m:7,who:"peasant",text:()=>has("fedThornby")?"M'lord! The seed you gave us in the spring came up gold. Best harvest Thornby's seen in ten years. The barns are bursting!":has("refusedThornby")?"The harvest's in, m'lord. What there is of it. Half our fields lay bare without seed. We remember why.":"The harvest's in, m'lord. Not the best year, not the worst. How much will the castle take?",
 choices:[{t:"Take a double share",go:()=>{fx({food:15,favor:-6});return "The castle granary fills. Thornby's doesn't."}},
  {t:"Take the usual share",go:()=>{fx({food:6});return "\"Fair's fair, m'lord.\""}},
  {t:"Leave them extra this year",go:()=>{fx({favor:6});return "Hob grins all the way back to Thornby."}}]},
{m:7,who:"cuthbert",text:"The abbey asks for its tenth of the harvest, my lord, as it has for two hundred years. The poor will eat from it all winter.",
 choices:[{t:"Give the abbey its tenth",cost:{food:12},go:()=>{fx({food:-12,favor:4});set("church");return "\"Bless you, my lord. The soup kitchens will open at first frost.\""}},
  {t:"Give half",cost:{food:6},go:()=>{fx({food:-6,favor:1});return "Cuthbert thanks you, a little stiffly."}},
  {t:"\"The castle needs every grain.\"",go:()=>{fx({favor:-4});set("churchAngry");return "Cuthbert preaches about greedy lords on Sunday. He doesn't name names. He doesn't need to."}}]},
{m:7,who:"merchant",req:()=>has("loanAutumn"),text:"Harvest time, my lord! One hundred gold, as we agreed in the spring.",
 choices:[{t:"Repay 100 gold",cost:{gold:100},go:()=>{fx({gold:-100});delete S.f.loanAutumn;set("loanRepaid");return "\"Always a pleasure doing business with Emberfall.\""}},
  {t:"Pay in grain instead",cost:{food:40},go:()=>{fx({food:-40});delete S.f.loanAutumn;return "Osric sniffs the grain sacks. \"Acceptable.\" His wagons leave heavy."}},
  {t:"\"Tell the Guild to wait.\"",go:()=>{delete S.f.loanAutumn;set("guildEnemy");fx({favor:-6,food:-10});note("Refused to repay the Guild's harvest loan.");return "Osric's smile doesn't move. A week later the Guild seizes grain wagons on the road, and prices in Emberfall double."}}]},
{m:7,who:"vexenvoy",req:()=>has("vassal"),text:"\"The Baron would like your son at his court, my lord. As a ward. To learn proper manners.\" Gerrit doesn't bother pretending it isn't a hostage.",
 choices:[{t:"Send Tobin",go:()=>{set("tobinHostage");S.bond.tobin=0;fx({favor:-5});note("Sent Tobin to Vex's court as a hostage.");return "Tobin doesn't cry until he's out of sight of the gate. Elinor doesn't stop."}},
  {t:"Refuse",go:()=>{set("rebelSeed");set("vexAngry");return "Gerrit's smile goes thin. \"The Baron will hear of this.\""}}]},
{m:7,who:"cuthbert",req:()=>has("morwenCourt"),text:"\"My lord, the Ferrywoman is teaching children in the market to talk to crows. The abbey or the fen. You cannot keep both.\"",
 choices:[{t:"Choose the abbey",go:()=>{delete S.f.morwenCourt;set("morwenBanished");set("witchCurse");fx({favor:4});note("Sent Morwen away at the abbey's demand.");return "Morwen leaves at dawn. The crows follow her. So does a curse on your granary."}},
  {t:"Choose the fen",go:()=>{set("witchRealm");set("churchAngry");fx({favor:-6});note("Sided with Morwen against the abbey.");return "Cuthbert takes off his abbot's ring and leaves it on your throne."}},
  {t:"\"Learn to live with each other.\"",go:()=>{fx({favor:-2});return "Neither of them speaks to you for a week."}}]},
/* ---- OCTOBER: the cousin and the King ---- */
{m:8,who:"tobin",req:()=>!has("tobinHostage"),text:()=>tbl().marshal==="tobin"?"\"I command your guard, Father, and I'm still not a knight. The old soldiers notice. Will you knight me before the winter?\"":"\"Father, I'll be of age by the first snow. Will you knight me before the winter? I've been practicing. Ask anyone. Well, don't ask the stable boys.\"",
 choices:[{t:"\"Before the snow. I promise.\"",go:()=>{set("tobinPromise");S.bond.tobin++;return "He hugs you so hard your crown slips."}},
  {t:"\"Earn it first.\"",go:()=>{S.bond.tobin++;set("tobinEarn");return "\"I will!\" He's in the yard with a sword before you've finished your sentence."}}]},
{m:8,who:"eastlord",req:()=>false,text:"Lord Harwin, in his finest, with tears in his beard. \"Maren and my Edric are wed, my friend. Our houses are one blood now.\"",
 choices:[{t:"Toast the couple",go:()=>{S.f.lanterns=S.month+1;set("marenWed");fx({favor:5});note("Maren married Edric of the Marches.");return "The whole hall drinks. Edric reads a poem. It's terrible. Maren laughs until she cries."}},
  {t:"Give them a dowry of 20 gold",cost:{gold:20},go:()=>{set("marenWed");set("harwinBound");fx({gold:-20,favor:3});note("Maren married Edric of the Marches.");return "Harwin clasps both your hands. \"Whatever comes, the Marches stand with Emberfall.\""}}]},
{m:8,who:"elinor",req:()=>has("marenBitter")&&!has("marenWed")&&S.bond.maren<3,text:"Elinor's face is white. \"Maren's gone. Her room is empty, and so is the traveling minstrel who's been singing under her window all summer.\"",
 choices:[{t:"Send riders after her",go:()=>{fx({men:-3});set("marenReturned");return "They bring her back three days later, furious, muddy, and safe."}},
  {t:"Let her go",go:()=>{set("marenGone");if(has("marenBetrothed")){delete S.f.harwinAlly;delete S.f.harwinBound;set("harwinEnemy");set("harwinJilted")}fx({favor:-3});note("Maren ran away from Emberfall.");return "\"She'll write,\" Elinor says. She says it every day after."}}]},
{m:9,who:"aldric",req:()=>has("harwinJilted"),text:"A letter from Lord Harwin, three lines long. \"My son was promised a bride and got a minstrel's leavings. The Marches will remember Emberfall.\"",
 choices:[{t:"Send an apology, and gold (20)",cost:{gold:20},go:()=>{fx({gold:-20});delete S.f.harwinEnemy;return "Harwin keeps the gold and doesn't answer. At least he isn't your enemy anymore."}},
  {t:"\"She chose for herself.\"",go:()=>"Aldric folds the letter away. \"So she did, my lord. Harwin won't forget it.\""}]},
{m:8,who:"vexenvoy",req:()=>has("vassal")&&!has("freed")&&has("corvinClaim"),text:"Sir Gerrit, almost apologetic. \"Your cousin Corvin has written to the Baron. He offers four coins in ten, not three, if Emberfall is his. The King will hear the claim, but the Baron will tell his friends how to vote.\"",
 choices:[{t:"Match his offer",cost:{gold:30},go:()=>{fx({gold:-30});set("gerritBought");return "Gerrit counts it twice. \"The Baron will be pleased. I'll make sure of it.\""}},
  {t:"\"Tell the Baron Corvin poisoned my father.\"",go:()=>{if(clueCount()>=2){set("gerritBought");return "Gerrit's face goes still. \"Poison. The Baron hates poisoners. He says it's a coward's weapon.\""}return "\"Proof, my lord,\" says Gerrit. \"The Baron likes proof.\""}},
  {t:"Say nothing",go:()=>"Gerrit shrugs and writes something down."}]},
{m:7,who:"wynn",req:()=>!has("vassal")&&!has("ironLaw"),text:"Sergeant Wynn, stiff and formal. \"My lord, between your cousin and the winter, we need more spears. Give me the right to take every able man in Thornby and the farms. It won't be popular.\"",
 choices:[{t:"\"Do it. Every able man.\"",go:()=>{set("ironLaw");fx({men:15,favor:-10});note("Passed the Iron Law: every able man was called to arms.");return "By the end of the week, the farms are full of women and old men, and the castle yard is full of farmers with spears. Nobody sings in the taverns."}},
  {t:"\"Volunteers only.\"",go:()=>{fx({men:4,favor:1});return "Four men come forward. Wynn says it's four more than he expected."}}]},
/* ---- NOVEMBER ---- */
{m:9,who:"whisper",req:()=>has("spy")&&has("corvinClaim")&&!has("corvinSecret")&&!has("corvinPact"),text:"\"The will your cousin carries was written by a clerk in Greymarch, my lord. For a price. I can bring you the clerk before the council... for 20 gold.\"",
 choices:[{t:"Pay the Whisper",cost:{gold:20},go:()=>{fx({gold:-20});set("corvinSecret");set("clerkFound");addClue("clerk");note("The Whisper found the clerk who forged Corvin's will.");return "\"He'll be in your dungeon before the council. Singing.\""}},
  {t:"Decline",go:()=>"\"Your throne, my lord. Your gamble.\""}]},
{m:9,who:"aldric",text:"Winter's close, my lord. We'll need firewood for four months, or we'll be burning furniture by February.",
 choices:[{t:"Buy firewood now",cost:{gold:10},go:()=>{fx({gold:-10});set("firewood");return "Wagons of oak stacked to the rafters. (No firewood costs this winter.)"}},
  {t:"Cut the Ashwood",go:()=>{set("firewood");fx({favor:-4});return "The royal forest rings with axes. The hunters are not pleased. (No firewood costs this winter.)"}},
  {t:"\"We'll manage.\"",go:()=>"Aldric writes \"firewood: 4 gold a month\" in the ledger, and underlines it."}]},
{m:9,who:"vexenvoy",req:()=>has("vexRevenge")&&!has("vexDead"),text:"Gerrit again, thinner than before. \"The Baron is gathering men. He'll cross when the river freezes. I'm told to say that this is your last chance: fifty gold, and he stays home.\"",
 choices:[{t:"Pay fifty gold",cost:{gold:50},go:()=>{fx({gold:-50});set("vexTruce");delete S.f.vexRevenge;return "\"Wise,\" Gerrit says, and sounds relieved."}},
  {t:"\"Let him come.\"",go:()=>{fx({favor:3});return `${leader()} starts doubling the watches on the river.`}}]},
{m:9,who:"eastlord",req:()=>has("vassal")&&has("rebelSeed")&&has("harwinAlly"),text:"Harwin, cloaked, at night. \"The Marches are tired of Vex's taxes too. Raise your banner at midwinter and forty lances will ride with you.\"",
 choices:[{t:"\"We rise in December.\"",go:()=>{set("rebellion");note("Agreed with Harwin to rise against Vex.");return "Harwin grips your hand. \"December, then. Sharpen everything.\""}},
  {t:"\"Not yet.\"",go:()=>"\"Don't wait too long. Chains get comfortable.\""}]},
{m:9,who:"aldric",req:()=>has("vassal")&&has("rebelSeed")&&!has("harwinAlly"),text:"Aldric closes the door behind him. \"My lord, the guild masters, the abbey and half the guard are sick of Vex. If you raise the banner at midwinter, they'll follow.\"",
 choices:[{t:"\"We rise in December.\"",go:()=>{set("rebellion");note("Planned an uprising against Vex.");return "Aldric bows. His hands are shaking, and he's smiling."}},
  {t:"\"Not yet.\"",go:()=>"\"As you say, my lord.\" He looks older than yesterday."}]},
{m:9,who:"wynn",req:()=>!!winterFoes()&&!has("spy"),text:()=>winterFoes().cor?"Sergeant Wynn, stamping snow off his boots. \"My lord, the Greymarch smiths are working day and night, and Corvin is hiring sellswords. He says it's for the King's war. The King's war is in the north. Greymarch is west of us.\"":"Sergeant Wynn, stamping snow off his boots. \"Fishermen say there are lights at Blackmoor again, my lord. Vex is gathering what's left of his army. When the river freezes, he won't need the ford.\"",
 choices:[{t:"\"Send scouts. I want to know when.\"",cost:{gold:6},go:()=>{fx({gold:-6});set("winterIntel");return "The scouts come back a week later, half frozen. \"The Longest Night, my lord. When the river is thickest and the dark is longest.\""}},
  {t:"\"Double the watch on the river.\"",go:()=>{fx({favor:1});return "Torches on the riverbank every night now. The city sleeps a little easier, and so does Wynn."}}]},
/* ---- DECEMBER ---- */
{m:9,who:"whisper",req:()=>has("spy")&&!!winterFoes(),text:()=>winterFoes().cor?"\"Corvin is buying sellswords in Greymarch, my lord. Wagons of pitch. Sledges. He isn't planning to wait for any council.\"":"\"Baron Vex is gathering what's left of his army, my lord. Sledges, pitch, ladders. He means to cross when the river freezes.\"",
 choices:[{t:"\"Find out when, and where.\"",go:()=>{set("winterIntel");return "\"The Longest Night,\" the Whisper says, three days later. \"Across the ice, at the ford. They'll bring their oil wagons onto the river.\""}},
  {t:"\"They wouldn't dare.\"",go:()=>`"${foeName()}," says the Whisper, "dares everything that might work."`}]},

{m:10,who:"eastlord",req:()=>has("rebellion")&&has("harwinAlly"),text:"Harwin's lances at your gate, steam rising from the horses. \"It's December, my friend. Is Emberfall still with us?\"",
 choices:[{t:"Raise the banner",go:()=>rebel()},{t:"Call it off",go:()=>{delete S.f.rebellion;fx({favor:-6});return "Harwin turns his horse without a word."}}]},
{m:10,who:"aldric",req:()=>has("rebellion")&&!has("harwinAlly"),text:"\"The guild masters are armed, the abbey bells are ready. Say the word, my lord.\"",
 choices:[{t:"Raise the banner",go:()=>rebel()},{t:"Call it off",go:()=>{delete S.f.rebellion;fx({favor:-6});return "The bells stay silent. People stop looking you in the eye."}}]},
{m:10,who:"cuthbert",req:()=>!has("witchRealm"),text:()=>winterFoes()?"The Feast of the Longest Night is tonight, my lord, the very night they mean to come. Emberfall has always lit every window. Do we light them tonight?":"The Feast of the Longest Night is upon us, my lord. The darkest night of the year. Emberfall has always lit every window.",
 choices:[{t:"A great feast for the whole city",cost:{food:15,gold:10},go:()=>{S.f.lanterns=S.month+1;fx({food:-15,gold:-10,favor:10});note("Held a great midwinter feast.");return winterFoes()?"Every window will burn tonight, and every soldier on the wall will have hot bread in his belly. Let them see that Emberfall isn't afraid of the dark.":"Every window burns. You dance with Elinor in the square, badly. Nobody minds."}},
  {t:"A simple feast in the hall",cost:{food:5},go:()=>{fx({food:-5,favor:3});return "Candles, bread, and the old songs."}},
  {t:"\"We can't afford it this year.\"",go:()=>{fx({favor:-5});set("windowsDark");return "The windows stay dark. It's a very long night."}}]},
/* ---- JANUARY ---- */
{m:11,who:"herald",req:()=>has("sentKing"),text:()=>has("sentKingBack")?"Hear the word of King Osmund! The northern raiders are broken, and the soldiers of Emberfall held the line at Saltmere. The King names their lord a Champion of the Realm.":"Hear the word of King Osmund! The northern raiders are broken. The soldiers of Emberfall held the line at Saltmere, and the King names their lord a Champion of the Realm.",
 choices:[{t:"\"Emberfall is honored.\"",go:()=>{set("kingChampion");set("kingFavor");if(has("sentKingBack")){fx({gold:30,favor:6});note("Named Champion of the Realm by King Osmund.");return "Royal silver, a sealed letter, and a banner for the great hall."}fx({men:14,gold:30,favor:6});note("Named Champion of the Realm by King Osmund.");return "Fourteen of the fifteen march back through the gate with royal silver in their packs."}}]},
{m:11,who:"herald",req:()=>has("kingAngry"),text:"The royal herald stands in your hall, with the King's tax collector, a ledger and six guards. \"For refusing the King's call: thirty gold.\"",
 choices:[{t:"Pay",cost:{gold:30},go:()=>{fx({gold:-30});delete S.f.kingAngry;return "He counts every coin twice."}},
  {t:"\"Tell the King to come and collect it.\"",go:()=>{set("kingEnemy");fx({favor:4});note("Defied King Osmund's tax collector.");return "The hall cheers. Somewhere, a royal clerk writes your name on a list."}}]},
{m:11,who:"tobin",req:()=>false,text:"Tobin kneels in the cold chapel in his first real armor. It's too big. \"I'm ready, Father.\"",
 choices:[{t:"Knight him yourself",go:()=>{set("tobinKnight");fx({favor:4});note("Knighted Sir Tobin of Emberfall.");return "Your sword touches each shoulder. \"Rise, Sir Tobin.\" Elinor is crying. So, it turns out, are you."}},
  {t:"Ask Lord Harwin to knight him",req:()=>has("harwinAlly"),go:()=>{set("tobinKnight");set("harwinBound");note("Lord Harwin knighted Sir Tobin.");return "Harwin's old sword, Harwin's booming voice. \"Rise, Sir Tobin, friend of the Marches!\""}},
  {t:"\"Not this year.\"",go:()=>{S.bond.tobin=0;return "He stands up slowly, and walks out without a word."}}]},
{m:11,who:"vexenvoy",req:()=>has("tobinHostage")&&!has("freed"),text:"Gerrit, almost kindly. \"Your son is well, my lord. He's learning to read Vex's ledgers. He asks about you.\"",
 choices:[{t:"Send him a letter",go:()=>{S.bond.tobin++;return "You write three pages. Gerrit promises to deliver them unopened. You almost believe him."}}]},
{m:11,who:"peasant",text:"The winter cough is back, m'lord, worse in the cold. Children first, then the old folk.",
 choices:[{t:"Pay the physicians",cost:{gold:15},go:()=>{fx({gold:-15,favor:5});return "Hot broth, willow bark and clean blankets. Most of them pull through."}},
  {t:"Send for Morwen",agent:"witch",go:()=>{send("witch");fx({favor:3});set("witchHealed");return "Morwen walks through Thornby in the snow. The coughing stops behind her."}},
  {t:"Open the castle stores",cost:{food:10},go:()=>{fx({food:-10,favor:4});return "Warm bellies fight the cold better than prayers."}}]},
{m:11,who:"herald",req:()=>has("corvinFight"),text:()=>has("corvinAttacked")?"Hear the word of King Osmund! The King has heard that blood was spilled on the ice at midwinter, and that two men claim Emberfall. Both are summoned to Kingsreach at the end of February, to answer before the King and the eleven lords of the river. Until then, the King's peace holds. No more swords.":"Hear the word of King Osmund! Two men claim Emberfall: its lord, and Lord Corvin of Greymarch. By the old law, the King will hear them both in his hall at Kingsreach at the end of February, and the eleven lords of the river will vote.",
 choices:[{t:"\"Tell the King I'll be there.\"",go:()=>{note("Summoned to Kingsreach to answer Corvin's claim before the King.");return "The herald bows. \"Bring your proof, my lord. The King likes proof.\""}},
  {t:"\"Corvin should be in chains, not in a hall.\"",req:()=>has("corvinAttacked"),go:()=>{note("Summoned to Kingsreach to answer Corvin's claim before the King.");return "\"Then prove it at Kingsreach, my lord,\" the herald says. \"In front of everyone. That's how chains get made.\""}}]},
{m:11,who:"corvin",req:()=>has("corvinFight")&&!has("corvinAttacked")&&!has("corvinEnemy"),text:"\"We ride north for Kingsreach next month, cousin. The lords are already on the roads, and some are already drinking my wine.\" He raises his cup. \"Your health.\"",
 choices:[{t:"Host a feast for the visiting lords",cost:{gold:30},go:()=>{fx({gold:-30,favor:5});set("lordsFeasted");return "Your wine is better than his. The lords notice. (The city eats the leftovers for a week: +5 favor.)"}},
  {t:"Ride out to each lord yourself",cost:{food:8},go:()=>{fx({food:-8});set("lordsVisited");S.bond.elinor=Math.max(0,S.bond.elinor-1);return "Two weeks in the snow, eleven halls, eleven handshakes. (Two weeks away from home: Elinor is cooler toward you.)"}},
  {t:"\"My year speaks for itself.\"",go:()=>"Corvin laughs. \"It does. Loudly.\""}]},
{m:11,who:"elinor",req:()=>has("marenGone"),text:"Elinor has a letter in her hands, and she's been crying. \"It's from Maren. She's in Saltmere, with the minstrel. They're married. She says she's happy, and she's sorry, and she isn't sorry at all.\"",
 choices:[{t:"\"Write back. Tell her to come home.\"",go:()=>{set("marenForgiven");S.bond.elinor++;return "Elinor writes all night. You add one line at the bottom, and it takes you longer than all of hers."}},
  {t:"\"She made her choice.\"",go:()=>"Elinor folds the letter very small, and keeps it anyway."}]},
{m:12,who:"corvin",req:()=>has("corvinPact")&&clueCount()>=4,text:"Corvin, all smiles, with the wedding contract in his hand. \"Maren and my Edwy, at midsummer. I've burned the will, as promised. Family is family, cousin.\"\n\nYou have enough in your strongbox to hang him.",
 choices:[{t:"Keep the bargain",go:()=>"You sign. Corvin pats your shoulder. Your hand doesn't shake. Maren's will, at the wedding."},
  {t:"Tear it up. See him at Kingsreach.",go:()=>{delete S.f.corvinPact;set("corvinFight");note("Tore up the marriage pact with Corvin.");return "The contract goes into the fire. Corvin watches it burn, and stops smiling. \"Then the King will hear us both, cousin.\""}}]},
/* ---- FEBRUARY: the last month ---- */
{m:12,who:"aldric",text:()=>has("corvinFight")?"The last month of your first year, my lord. At the end of it we ride north to Kingsreach, and the lords will say what they think of you in front of the King himself.":"The last month of your first year, my lord. When the snow breaks, the lords gather for the Lords' Council. Whatever they think of you, they'll say it then.",
 choices:[{t:"\"Then let's finish strong.\"",go:()=>{fx({favor:2});return "Aldric smiles. \"Your father used to say that. He rarely did.\""}},
  {t:"\"I need a drink first.\"",go:()=>"Aldric pours two."}]},
{m:12,who:"elinor",text:()=>has("reluctant")?"Elinor finds you on the battlements, watching the snow. \"A year ago you told Aldric you never wanted this throne. Do you still feel that way?\"":"Elinor finds you on the battlements, watching the snow. \"One year. Was it what you thought it would be, when you first sat on that throne?\"",
 choices:[{t:"\"I was wrong. I want it.\"",go:()=>{set("wantsThrone");fx({favor:2});return "She takes your arm. \"Good. So do they.\""}},
  {t:"\"Every single day.\"",go:()=>{S.bond.elinor++;return "\"That's why you're good at it,\" she says."}}]},
{m:12,who:"maren",req:()=>has("marenWed"),text:()=>"A letter from the Marches, in Maren's hand. \"Edric's poems are getting better. Slightly. I'm happy, Father. Truly. "+(famHere("tobin")?"Tell Tobin I can still beat him at chess.\"":"Is there any word from Tobin?\""),
 choices:[{t:"Read it twice",go:()=>{fx({favor:2});return "You read it three times, actually."}}]},
{m:12,who:"morwen",req:()=>has("witchRealm")||has("morwenCourt"),text:"Morwen walks up the carpet like she owns it, and doesn't bow. She looks past you at the throne. \"The fen wants a lord, little lord. Give Emberfall to the green, and you'll rule a hundred years.\"",
 choices:[{t:"\"Then let it be the fen's.\"",go:()=>{set("witchThrone");note("Gave Emberfall to the fen.");return "She smiles, and the candles turn green, one by one."}},
  {t:"\"Leave Emberfall. Tonight.\"",go:()=>{delete S.f.witchRealm;delete S.f.morwenCourt;set("morwenBanished");fx({favor:5});return "She goes, slowly, and the torches flicker as she passes. \"You'll miss me, little lord.\""}}]},
/* ---- CHAPTER TWO: the Midwinter Crown ---- */
{m:6,who:"corvin",text:()=>(fought()?"\"Cousin! You remember me? Corvin of Greymarch. I sat with your father through his last nights. I rode the moment I heard about the battle. Poor, dear Roderick. Such a shame. He was always so generous with other men's land.\"":"\"Cousin! You remember me? Corvin of Greymarch. I sat with your father through his last nights. And now I hear about your... arrangement with Baron Vex. Poor, dear Roderick. Such a shame.\"")+" He unrolls a parchment with a flourish. \"His will. He named me his heir. When the snow breaks in February, the eleven lords of the river meet before the King, as the old law says, to confirm a new lord's first year. Let them decide which of us it should be.\"",
 choices:[{t:"Welcome him as family",go:()=>{set("corvinGuest");set("corvinClaim");set("corvinFight");note("Lord Corvin arrived with a will naming him heir. The lords will decide in February.");setTimeout(()=>showTip("council"),600);return "He takes the best guest room, praises the wine, and writes eleven letters before supper. Aldric counts the silverware."}},
  {t:"Demand to see the will",go:()=>{set("willSeen");set("corvinClaim");set("corvinFight");note("Lord Corvin arrived with a will naming him heir. The lords will decide in February.");setTimeout(()=>showTip("council"),600);return "You read every line. It's your father's seal. You're almost sure it's not your father's hand."}},
  {t:"Throw him out of Emberfall",go:()=>{set("corvinEnemy");set("corvinClaim");set("corvinFight");fx({favor:2});S.lords=S.lords||{};note("Turned Lord Corvin away from the gate. The lords will decide in February.");setTimeout(()=>showTip("council"),600);return "\"As you wish, cousin.\" He smiles all the way to the gate. \"I'll tell the lords how warmly Emberfall greets its family.\""}}]},
{m:6,who:"wynn",req:()=>(has("vexDead")||has("vexWounded"))&&!hasClue("vexLetters"),text:"Sergeant Wynn drops a muddy chest at your feet. \"Vex's war chest, my lord, dragged out of the river. Silver, maps... and these.\" A bundle of letters, each sealed with one initial: C.",
 choices:[{t:"Read every one",go:()=>{addClue("vexLetters");return "\"Strike before the harvest, and the ford is yours. The boy will not last the summer.\" No name. Just C. Someone wanted Vex to ruin you."}},
  {t:"Keep the silver, burn the rest",go:()=>{fx({gold:20});return "The letters curl in the fire. The silver goes in the strongbox. Aldric watches the ashes for a long time."}}]},
{m:6,who:"brannoc",req:()=>has("brannocTrap")&&fought()&&!hasClue("brannoc"),text:"Brannoc, in chains, his face bruised from the night of the battle. \"You let me open that gate onto your spears. Clever boy. Go on, then. Ask me.\"",
 choices:[{t:"\"Who paid you to kill my father?\"",go:()=>{set("brannocJailed");addClue("brannoc");return "He laughs, then stops. \"Vex paid for the gate. Someone else paid for the old lord's wine. Rings from Greymarch on every finger. I never saw his face.\""}},
  {t:"Hang him at dawn",go:()=>{set("brannocExiled");fx({favor:3});return "He walks to the rope without a word. Whatever he knew, he takes with him."}}]},
/* ---- SEPTEMBER ---- */
{m:7,who:"herald",text:"Hear the word of King Osmund! Raiders burn the northern coast at Saltmere. Every lord owes the King soldiers or silver. What does Emberfall send?",
 choices:[{t:"Send 15 soldiers north",cost:{men:15},go:()=>{fx({men:-15});set("sentKing");note("Sent 15 soldiers to the King's war.");return "Fifteen soldiers march north to the King's war. They'll be back by midwinter, if they come back."}},
  {t:"Pay 35 gold instead",cost:{gold:35},go:()=>{fx({gold:-35});set("kingPaid");set("kingFavor");return "\"The King will remember Emberfall's silver.\""}},
  {t:"Refuse",go:()=>{set("kingAngry");set("refusedSaltmere");fx({favor:2});return "The herald writes your answer down very carefully."}}]},
{m:7,who:"ysolde",req:()=>!has("ysoldeCharmed"),text:"Lady Ysolde of Saltmere, salt on her cloak. \"The raiders burned half my harbor. The King's men are slow. My people need grain to get through the winter, my lord, and I'll remember who sent it. At the council, I mean.\"",
 choices:[{t:"Send 15 grain",cost:{food:15},go:()=>{fx({food:-15});set("ysoldeCharmed");note("Sent grain to Saltmere.");return "\"Emberfall feeds Saltmere,\" she says, and kisses both your cheeks. \"I won't forget it.\""}},
  {t:"\"Emberfall has its own winter coming.\"",go:()=>{set("ysoldeSnubbed");return "\"Of course.\" She is very polite on her way out. Too polite."}}]},
{m:7,who:"teague",text:"Lord Teague of the Coast Road, all rings and smiles. \"I'll be frank, my lord. My vote at the council is a ship. It sails where the wind blows, and Corvin's wind smells of gold. Thirty gold would turn it around.\"",
 choices:[{t:"Pay him 30 gold",cost:{gold:30},go:()=>{fx({gold:-30});set("teaguePaid");note("Bought Lord Teague's vote.");return "\"A pleasure doing business.\" He bites one of the coins. You suspect he bites everything."}},
  {t:"\"I don't buy lords.\"",go:()=>{fx({favor:3});return "\"Then you'll lose them, my lord.\" Word of your answer gets around the market, and people like it."}}]},
/* ---- OCTOBER: the harvest feast ---- */
{m:8,who:"aldric",text:()=>`The harvest feast. Halfway through the toasts, ${has("boyPage")||has("pipSquire")?"Pip, promoted to cupbearer, sips from your cup as a joke, and drops":"your new cupbearer tastes your wine and drops"} like a stone. Purple lips. Aldric is white. "My lord... that's how your father looked."`,
 choices:[{t:"\"Seal the gates. No one leaves.\"",go:()=>{set("poisonHunt");fx({favor:-2});note("Someone tried to poison you at the harvest feast.");return has("boyPage")||has("pipSquire")?"Pip lives, barely: he only sipped. "+(has("corvinEnemy")?"The guests grumble all night behind locked gates.":"The guests grumble all night behind locked gates. Corvin grumbles loudest."):"The cupbearer lives, barely. "+(has("corvinEnemy")?"The guests grumble all night behind locked gates.":"The guests grumble all night behind locked gates. Corvin grumbles loudest.")}},
  {t:"Hush it up. Carry on with the feast.",go:()=>{set("poisonQuiet");set("lordsFeasted");note("Someone tried to poison you at the harvest feast.");return "Your cupbearer is carried out, still breathing. The music starts again. Somebody in your hall is very disappointed."}}]},
{m:8,who:"corvin",req:()=>has("corvinClaim")&&!has("corvinEnemy")&&!has("marenWed")&&!has("marenGone")&&!has("marenBetrothed")&&famHere("maren"),text:"\"Cousin, let's be sensible. Marry Maren to my son Edwy. Join our claims, and I'll burn this will in your own fireplace. No vote, no council, no unpleasantness.\"",
 choices:[{t:"Agree",go:()=>{set("corvinPact");delete S.f.corvinFight;S.bond.maren=0;note("Promised Maren to Corvin's son to end his claim.");return "Corvin beams. Maren hears the news from a servant and doesn't come down to dinner."}},
  {t:"\"Never.\"",go:()=>"\"Then the lords will decide.\" He leaves smiling. He's always smiling."}]},
/* ---- NOVEMBER ---- */
{m:9,who:"rhun",req:()=>!has("corvinPact"),text:"Lord Rhun of the Hills, old and broad, leaning on a sword he no longer needs. \"I fought beside your father at Saltmere, and for forty years after. Tell me true, boy: did Roderick die in his sleep?\"",
 choices:[{t:"\"No. He was murdered.\"",go:()=>{if(clueCount()>=2){set("rhunTold");note("Told Lord Rhun the truth about your father.");return "You show him what you've found. He reads it twice, very slowly. \"Then I know how I'll vote. And I'll be watching your cousin.\""}return "\"Murdered? By whom?\" You have suspicions, not proof. \"Bring me proof, boy. Then I'm yours.\""}},
  {t:"\"So they tell me.\"",go:()=>"He looks at you for a long moment. \"Your father would have looked harder.\""}]},
{m:9,who:"anselm",req:()=>!has("corvinPact"),text:()=>"Bishop Anselm, in purple"+(has("witchRealm")?", without Brother Cuthbert, who left you for the abbey in Greymarch. ":", with Brother Cuthbert one step behind. ")+"\"The church will vote at the council with its conscience, my lord. My conscience is troubled by the state of the abbey bell tower.\"",
 choices:[{t:"Pay for the bell tower",cost:{gold:25},go:()=>{fx({gold:-25,favor:3});set("anselmWon");return "The bells ring for an hour the day the scaffolding comes down. The Bishop's conscience is greatly eased."}},
  {t:"\"The church shouldn't sell its vote.\"",go:()=>{if(has("church")&&!has("churchAngry"))return "\"Quite right,\" says the Bishop, unexpectedly. \"You've already been generous to the abbey. I simply wanted to see if you'd say it.\"";set("churchAngry");return has("witchRealm")?"The Bishop's smile doesn't move at all.":"Cuthbert winces. The Bishop's smile doesn't move at all."}}]},
/* ---- DECEMBER ---- */
{m:9,who:"corvin",req:()=>has("corvinClaim")&&!has("corvinPact")&&!has("corvinEnemy")&&!has("corvinValet"),text:"\"The river will freeze any day now, cousin, and the roads with it. My honor guard has ridden in from Greymarch. Forty good men. Surely they can sleep inside the walls? It's so very cold.\"",
 choices:[{t:"Let them in",go:()=>{set("corvinGuardIn");return "Forty men in Greymarch grey file through your gate. Wynn counts them twice. They count your soldiers too."}},
  {t:"\"They can camp by the river.\"",go:()=>{fx({favor:1});return "\"How hospitable.\" Corvin's men pitch their tents in the snow below the walls, and glare at the gate all night."}}]},
{m:10,who:"ulric",req:()=>!hasClue("apothecary")&&(clueCount()>=3||has("spy")||has("ulricLead")),text:"A thin, shaking man in a Greymarch apothecary's apron, smuggled in under a cart of turnips. \"Master Ulric, my lord. Lord Corvin bought nightshade from me twice: once before your father died, and once this autumn. He'll kill me next. Please.\"",
 choices:[{t:"Grant him sanctuary",go:()=>{set("ulricSafe");addClue("apothecary");note("Master Ulric, Corvin's apothecary, asked for sanctuary.");return "Aldric hides him in the treasury vault, with a candle, a blanket and a very large guard."}},
  {t:"\"Why should I trust you?\"",go:()=>{if(has("spy")&&agentFree("spy")){addClue("apothecary");set("ulricSafe");return "The Whisper steps out of the shadows. \"He's telling the truth, my lord. I've watched his shop for a month.\""}return "He weeps and swears on everything he can think of. Within the hour he's gone. You'll never know."}}]},
/* ---- JANUARY ---- */
{m:11,who:"garrick",req:()=>has("corvinClaim")&&!has("garrickTurned")&&(has("corvinCaught")||has("corvinAttacked")),text:"Lord Garrick of the North Road, gruff and uneasy. \"Corvin's been my friend for thirty years. But I hear ugly stories about him and your castle. Tell me what's going on in this house, my lord.\"",
 choices:[{t:"Tell him everything you know",go:()=>{if(clueCount()>=3){set("garrickTurned");return "He listens to every word, and goes grey. \"Thirty years,\" he says. \"Thirty years I called that man my friend.\""}return "He listens. \"That's a lot of suspicion and not much proof, my lord.\" He leaves unconvinced."}},
  {t:"\"Ask your friend.\"",go:()=>"\"I will,\" he says, and you can see that he will."}]},
/* ---- The Fox: what happens to the bread thief you had flogged in May ---- */
{m:6,who:"peasant",req:()=>has("harsh"),text:"Bandits hit the Thornby road last week, m'lord. Folk say their leader's a skinny lad with flogging scars on his back. Calls himself the Fox.",
 choices:[{t:"Send the Marshal after him",agent:"general",go:()=>{send("general");if(roll(.5)){set("foxCaught");fx({favor:5});note("The Marshal caught the Fox.");return "Your Marshal drags him back in chains. It's Pip. The boy who stole bread in May. He doesn't say a word."}set("foxBold");return "Your Marshal finds an empty camp and a rude message scratched into a tree."}},
  {t:"Post a bounty",cost:{gold:10},go:()=>{fx({gold:-10});set("foxBounty");return "Wanted posters go up on every tavern door. Someone draws a mustache on his."}},
  {t:"\"Bandits come and go.\"",go:()=>{set("foxBold");fx({favor:-3});return "Hob looks at his boots. \"If you say so, m'lord.\""}}]},
{m:8,who:"merchant",req:()=>has("harsh")&&!has("foxCaught")&&!has("osricCaught"),text:"My lord! The Fox has blockaded the salt road with forty men. My wagons sit idle in the rain. He'll let them pass for 30 gold. Every month.",
 choices:[{t:"Pay him this once",cost:{gold:30},go:()=>{fx({gold:-30});set("foxPaid");return "The wagons roll. Osric glares at you as if this were your fault. It is, a little."}},
  {t:"Send the Whisper to find his camp",agent:"spy",go:()=>{send("spy");set("foxFound");return "\"Old mill on the Ashwood creek,\" the Whisper reports. \"Forty men, two cooks, and one very nervous boy.\""}},
  {t:"Send the Marshal to break the blockade",agent:"general",go:()=>{send("general");if(roll(.4)){set("foxCaught");fx({men:-2,favor:4});note("Broke the Fox's blockade.");return "A hard fight in the rain. The blockade breaks, and the Fox is taken alive."}fx({men:-5});set("foxBlockade");return "The Fox melts into the forest. Five of your soldiers don't come back. The road stays shut. (−5 gold a month)"}},
  {t:"Refuse to deal with bandits",go:()=>{set("foxBlockade");return "The salt road stays closed. Trade withers. (−5 gold a month until it's settled)"}}]},
{m:10,who:"pip",req:()=>has("harsh")&&!has("foxCaught"),text:"A thin young man walks in under a white rag. The scars on his back show through his shirt. \"Remember me, my lord? You had me flogged for a loaf of bread. I'm the Fox now. I want a pardon. And a job. Or the castle granary burns this winter.\"",
 choices:[{t:"Pardon him and make him a scout",go:()=>{set("foxPardoned");delete S.f.foxBlockade;fx({men:6,favor:-2});note("Pardoned the Fox and took his men into service.");return "He kneels. His six best join your garrison, and the rest go back to the woods as your eyes and ears. The old guards mutter about it for weeks."}},
  {t:"Arrest him, here and now",go:()=>{if(has("foxFound")){set("foxCaught");delete S.f.foxBlockade;fx({favor:5});return "His camp was already surrounded, thanks to the Whisper. The Fox's men surrender without a fight."}set("foxCaught");delete S.f.foxBlockade;fx({food:-20,favor:2});return "You have him. That night, his men burn half the castle granary in revenge."}},
  {t:"Apologize, and pay him to go",cost:{gold:25},go:()=>{fx({gold:-25,favor:2});delete S.f.foxBlockade;set("foxGone");return "\"An apology,\" he says, \"from a lord.\" He takes the gold, and something else you can't name, and goes."}}]},
];
/* everyday petitions: s = season ("any" fits all). One or two are mixed into each month. */
const R=[
 {s:"any",who:"widow",text:"Wolves took my goats, m'lord. Will you send hunters?",choices:[
  {t:"Send two soldiers hunting",req:()=>S.men>=2,go:()=>{fx({favor:4});return "The pelts hang in the square by nightfall."}},{t:"Send the Marshal",agent:"general",go:()=>{send("general");fx({favor:6});return "Your Marshal rides out personally. The widow tells everyone in Thornby for a year."}},{t:"\"Buy a dog.\"",go:()=>{fx({favor:-2});return "She mutters something unrepeatable."}}]},
 {s:"any",who:"merchant",req:()=>!has("osricCaught"),text:"A shipment of fine southern wine, my lord. For the lord's table. 10 gold.",choices:[
  {t:"Buy it",cost:{gold:10},go:()=>{fx({gold:-10,favor:2});return "Supper is merrier all week."}},{t:"Pass",go:()=>"\"Your loss.\""}]},
 {s:"any",who:"peasant",text:"The bridge at Thornby is rotting. Wagons can't cross to market.",choices:[
  {t:"Repair it",cost:{gold:12},go:()=>{fx({gold:-12,food:8});return "Trade flows again."}},{t:"Later",go:()=>{fx({favor:-2});return "Hob nods, unconvinced."}}]},
 {s:"any",who:"brannoc",req:()=>warHost()==="brannoc",text:"Two of the guards were drunk on watch. What punishment?",choices:[
  {t:"Extra night watches",go:()=>{fx({favor:-1});return "Sergeant Wynn, Brannoc's second, sets the watches himself. Nobody drinks on watch again."}},{t:"Dock their pay",go:()=>{fx({gold:3});return "Grumbles, but they understand."}}]},

function buildStats(){$("stats").innerHTML=[["gold","Gold"],["food","Grain"],["men","Army"],["favor","Favor"]].map(([k,l])=>`<div class="stat" id="s-${k}" onclick="statInfo('${k}')" role="button" aria-label="${l}"><img class="px" src="${ICONURL[k]}"><div><b>0</b><small>${l.toUpperCase()}</small></div></div>`).join("")}
function render(){for(const k of["gold","food","men","favor"])$("s-"+k).querySelector("b").textContent=S[k];
 $("s-food").classList.toggle("warn",S.food<=5||!!S.hunger);$("s-gold").classList.toggle("warn",S.gold<0);$("s-favor").classList.toggle("warn",S.favor<=15);$("daylbl").innerHTML=`${MONTHS[S.month-1].toUpperCase()}<span class="se"> · ${SEASON(S.month).toUpperCase()}</span><small>${threatText()}</small>`}
function floatStat(k,v){const el=$("s-"+k);const f=document.createElement("span");f.className="float";f.textContent=(v>0?"+":"")+v;f.style.color=v>0?"#9ef08a":"#ff7a6a";
 el.appendChild(f);setTimeout(()=>f.remove(),1400);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function buildMonth(){delete S.newMonth;
 if(S.month===2)setTimeout(()=>showTip("journal"),1500);
 S.queue=E.map((e,i)=>i).filter(i=>E[i].m===S.month);
 if(S.month!==BATTLE_MONTH&&S.month!==12&&!warDay()){const se=SEASON(S.month);const pool=R.map((r,i)=>i).filter(i=>(R[i].s===se||R[i].s==="any")&&!S.usedR.includes(i)&&!(R[i].grp&&rUsed(R[i].grp)));
  for(let k=0;k<(S.month<=2?2:S.month<=4?3:2)&&pool.length;k++){const j=pool.splice(Math.floor(Math.random()*pool.length),1)[0];if(R[j].req&&!R[j].req()){k--;continue}S.usedR.push(j);S.queue.splice(Math.min(S.queue.length,(S.month===1?3:1)+k*2),0,"r"+j)}}
 {const isAg=q=>typeof q==="number"&&WHO_AGENT[E[q].who];S.queue=[...S.queue.filter(isAg),...S.queue.filter(q=>!isAg(q))]}
 S.queue.unshift(...seatQueue());
 if(warDay())S.queue.unshift("war:intro");
 if(S.month===3&&!has("knelt")&&!has("vexMet"))S.queue.splice(Math.min(2,S.queue.length),0,"cere:vex");
 if(S.month===8&&has("weddingSet")&&!has("marenWed")&&famHere("maren"))S.queue.splice(Math.min(2,S.queue.length),0,"cere:wedding");
 if(S.month===9&&(has("tobinPromise")||has("tobinEarn"))&&!has("tobinKnight")&&famHere("tobin"))S.queue.splice(Math.min(2,S.queue.length),0,"cere:knight");
 if((S.unrest||0)>=2&&S.month!==BATTLE_MONTH&&!warDay()&&(S.lastRiot||0)<S.month-1){S.queue.unshift("riot");S.riots=(S.riots||0)+1;S.lastRiot=S.month}
 S.qi=0}
function rUsed(g){return (S.usedR||[]).some(u=>R[u]&&R[u].grp===g)}
function current(){const q=S.queue[S.qi];return typeof q==="string"&&q.startsWith("cere:")?{cere:q.slice(5),who:q==="cere:wedding"?"maren":q==="cere:vex"?"vex":"tobin"}:q==="war:intro"?warIntro():q==="riot"?RIOT:typeof q==="string"?(q.startsWith("seat:")?SEAT_EV[q.slice(5)]:R[+q.slice(1)]):E[q]}
function next(){
 while(S.qi<S.queue.length){const e=current();if(!e.req||e.req())break;S.qi++}
 if(S.qi>=S.queue.length){if(warDay()){SC.room=null;SC.cast=[];SC.walker=null}return endMonth()}
 const e=current();save();render();
 PCHAR=null;$("who").textContent="";$("role").textContent="";$("choices").innerHTML="";
 const t=$("txt");t.className="wait";
 if(e.cere)return ceremony(e.cere,()=>{S.qi++;next()});
 if(warDay())return warStep(e);
 t.textContent="The great doors creak open...";
 SC.enter(e.who,()=>present(e));
}

  B("maren",132,103,1);B("edric",146,103,-1);

   if(t%6===0)part({x:158+Math.random()*6,y:84+Math.random()*6,vx:(Math.random()-.5)*.4,vy:-.3,life:30,max:30,col:"#ffe890",glow:1,sz:.5})}}}

function pageHeight(){const el=$("txt");if(LANDSCAPE.matches)return el.clientHeight;const d=$("dialog");return Math.max(90,d.clientHeight-150)}
function paginate(str){const el=$("txt"),H=pageHeight();if(!(H>24)||!el.clientWidth)return[str];
 if(!MEAS){MEAS=document.createElement("div");MEAS.setAttribute("aria-hidden","true");document.body.appendChild(MEAS)}
 const cs=getComputedStyle(el);MEAS.style.cssText=`position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre-line;width:${el.clientWidth}px;font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};letter-spacing:${cs.letterSpacing};font-weight:${cs.fontWeight};font-style:${cs.fontStyle};padding:${cs.paddingTop} ${cs.paddingRight} ${cs.paddingBottom} ${cs.paddingLeft}`;
 const fits=t=>{MEAS.textContent=t.trimEnd()+" ▼";return MEAS.offsetHeight<=H+1};
 if(fits(str))return[str];
 const words=str.match(/\S+\s*/g)||[str],pages=[];let cur="";
 for(const w of words){if(cur&&!fits(cur+w)){
   // prefer to break after the last full sentence on this page
   const m=cur.match(/^([\s\S]*[.!?…]["”’)]?\s+)(\S[\s\S]*)$/);
   if(m&&m[1].length>cur.length*.45){pages.push(m[1].trimEnd());cur=m[2]+w}else{pages.push(cur.trimEnd());cur=w}}
  else cur+=w}
