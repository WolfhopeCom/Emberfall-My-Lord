<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Emberfall: My Lord</title>
<style>
@font-face{font-family:'Pixelify Sans';src:url('fonts/PixelifySans.ttf') format('truetype');font-weight:400 700;font-display:block}
:root{--ink:#2a1810;--parch:#efdcb2;--parch2:#e2c896;--gold:#f2c14e;--blood:#8a1f2a;--night:#0b0710}

html,body{margin:0;height:100%;background:var(--night);font-family:'Pixelify Sans',monospace;overflow:hidden;color:var(--ink)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:#120b16;overflow:hidden}
/* HUD */
#hud{background:#1a1220;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;border-bottom:3px solid #000;box-shadow:inset 0 -2px 0 #5a4020;z-index:2}
#stats{display:flex;justify-content:space-between}
.stat{display:flex;align-items:center;gap:5px;color:#f4e2c0;font-size:20px;font-weight:700;position:relative;min-width:64px}
.stat img{width:24px;height:24px}
.stat small{display:block;font-size:10px;font-weight:400;color:#b8a080;letter-spacing:1px;line-height:1}
.stat b{line-height:1;display:inline-block}
.stat.bump b{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.45)}}
.float{position:absolute;left:28px;top:-2px;font-weight:700;font-size:16px;pointer-events:none;animation:up 1.4s forwards;text-shadow:2px 2px 0 #000}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
#hudrow{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
#daylbl{color:var(--gold);font-size:14px;letter-spacing:2px}
.hb{font-family:inherit;background:#2e2234;color:#f4e2c0;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;font-size:13px;padding:3px 9px;margin-left:6px;cursor:pointer}
/* scene */
#scene{width:100%;height:auto;background:#000}
/* dialog */
#dialog{flex:1;margin:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--parch);border:4px solid var(--ink);
 box-shadow:inset 0 0 0 3px #c9a46a,inset 0 0 30px rgba(140,90,30,.35),0 4px 0 #000;padding:12px 12px 10px;overflow-y:auto;position:relative}
.head{display:flex;gap:10px;align-items:center}
#pbox{width:84px;height:84px;flex:none;background:#2a1d2e;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #6a4a2a;position:relative;overflow:hidden}
#pbox::after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(0,0,0,.35))}
#portrait{width:78px;height:78px}
#who{font-weight:700;font-size:21px;color:var(--blood);line-height:1.05}
#role{font-size:14px;color:#6a4a2a;margin-top:3px}
#txt{font-size:18px;line-height:1.32;margin:10px 2px 8px;min-height:4.2em;white-space:pre-line}
#txt.wait{color:#8a6a4a;font-style:italic}
#choices{display:flex;flex-direction:column;gap:9px;padding-bottom:4px}
.ch{font-family:inherit;font-size:17px;text-align:left;padding:10px 12px 10px 28px;background:#fff4dc;color:var(--ink);border:3px solid var(--ink);
 box-shadow:0 4px 0 var(--ink);cursor:pointer;position:relative;animation:slide .3s backwards}
.ch::before{content:"▸";position:absolute;left:10px;color:#a03020}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ch:disabled{opacity:.45}
.ch .cost{display:flex;gap:8px;font-size:13px;color:#7a4a2a;margin-top:3px;align-items:center}
.ch .cost img{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.ch.go{background:#a8322a;color:#fff4dc;text-align:center;padding-left:12px;font-weight:700;letter-spacing:1px}
.ch.go::before{content:""}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
/* overlays */
#overlay,#modal{position:absolute;inset:0;display:none;flex-direction:column;background:var(--night);z-index:10;overflow-y:auto}
#modal{z-index:20;background:rgba(5,3,8,.82);align-items:center;justify-content:center;padding:20px}
.cwrap{position:relative;flex:none}
#castle{width:100%;height:auto}
.logo{position:absolute;left:0;right:0;top:3%;text-align:center;pointer-events:none;animation:fade 1.6s}
.logo h1{margin:0;font-size:min(13vw,62px);font-weight:700;color:var(--gold);letter-spacing:3px;
 text-shadow:3px 0 #3a1408,-3px 0 #3a1408,0 3px #3a1408,0 -3px #3a1408,3px 3px #3a1408,-3px 3px #3a1408,3px -3px #3a1408,-3px -3px #3a1408,0 7px #7a2a10,0 0 30px rgba(255,140,40,.5)}
.logo h2{margin:4px 0 0;color:#f4e2c0;letter-spacing:9px;font-size:18px;text-shadow:2px 2px 0 #000}
.ovb{flex:1;padding:18px 22px calc(env(safe-area-inset-bottom) + 20px);text-align:center;color:#f4e2c0;display:flex;flex-direction:column;align-items:center;animation:fade .8s}
.ovb h3{font-size:28px;color:var(--gold);margin:4px 0 8px;text-shadow:3px 3px 0 #000}
.ovb p{font-size:18px;line-height:1.4;max-width:440px;margin:6px 0}
.ovb .dim{opacity:.65;font-size:15px}
.pb{font-family:inherit;font-size:19px;font-weight:700;min-width:240px;margin:6px;padding:11px 16px;background:#a8322a;color:#fff4dc;border:3px solid #000;
 box-shadow:inset 0 0 0 2px #e0705a,0 4px 0 #000;cursor:pointer;letter-spacing:1px}
.pb.alt{background:#3a2c40;box-shadow:inset 0 0 0 2px #6a5070,0 4px 0 #000}
.pb:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #e0705a,0 1px 0 #000}
.sumrow{display:flex;justify-content:space-between;width:250px;font-size:18px;margin:3px 0}
.sumrow img{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.box{background:#1e1424;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a4020;padding:18px;color:#f4e2c0;max-width:420px;width:100%;max-height:85%;overflow:auto;text-align:center;animation:fade .3s}
.box h3{color:var(--gold);margin:0 0 12px;font-size:24px}
.box ul{text-align:left;padding-left:18px;font-size:16px;line-height:1.45}
.elist div{padding:7px 4px;border-bottom:1px dashed #4a3a50;font-size:16px;text-align:left}
.elist .lock{opacity:.4}
.bld{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;max-width:400px;background:#1e1424;border:2px solid #000;box-shadow:inset 0 0 0 1px #5a4020;padding:8px 10px;margin:4px 0;text-align:left}
.bld b{color:#f2c14e;font-size:16px}.bld small{display:block;color:#b8a488;font-size:13px}
.bld button{font-family:inherit;font-size:14px;font-weight:700;background:#a8322a;color:#fff4dc;border:2px solid #000;padding:6px 10px;cursor:pointer;white-space:nowrap}
.bld button:disabled{opacity:.4}.bld.done{opacity:.55}
.siege p{opacity:0;animation:appear 1s forwards}
@keyframes appear{to{opacity:1}}
#card{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,3,8,.85);color:var(--gold);pointer-events:none}
#card b{font-size:54px;text-shadow:4px 4px 0 #3a1408;animation:pop .6s}
#pips{display:flex;gap:4px;margin-top:16px}#pips i{width:14px;height:14px;border:2px solid #000;display:block}#pips i.now{outline:2px solid #fff4dc;transform:scale(1.25)}#pips i.past{opacity:.35}
#card span{color:#f4e2c0;font-size:16px;letter-spacing:4px;margin-top:6px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}}
@keyframes fade{from{opacity:0}}
</style>
</head>

 </div>

  <div class="head"><div id="pbox"><canvas id="portrait" width="32" height="32"></canvas></div><div><div id="who"></div><div id="role"></div></div></div>
  <div id="txt"></div>

</div>

 granary:{n:"Granary",cost:30,d:"+5 grain every month"},

/* =========================================================
   ENGINE
   ========================================================= */
function buildStats(){$("stats").innerHTML=[["gold","Gold"],["food","Grain"],["men","Army"],["favor","Favor"]].map(([k,l])=>`<div class="stat" id="s-${k}"><img class="px" src="${ICONURL[k]}"><div><b>0</b><small>${l.toUpperCase()}</small></div></div>`).join("")}
function render(){for(const k of["gold","food","men","favor"])$("s-"+k).querySelector("b").textContent=S[k];$("daylbl").textContent=`${MONTHS[S.month-1].toUpperCase()} · ${SEASON(S.month).toUpperCase()} · YEAR 1`}
function floatStat(k,v){const el=$("s-"+k);const f=document.createElement("span");f.className="float";f.textContent=(v>0?"+":"")+v;f.style.color=v>0?"#9ef08a":"#ff7a6a";
 el.appendChild(f);setTimeout(()=>f.remove(),1400);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function buildMonth(){
 S.queue=E.map((e,i)=>i).filter(i=>E[i].m===S.month);
 if(S.month<=3){const se=SEASON(S.month);const pool=R.map((r,i)=>i).filter(i=>(R[i].s===se||R[i].s==="any")&&!S.usedR.includes(i));
  for(let k=0;k<(S.month===3?1:2)&&pool.length;k++){const j=pool.splice(Math.floor(Math.random()*pool.length),1)[0];S.usedR.push(j);S.queue.splice(1+k*2,0,"r"+j)}}
 S.qi=0}
function current(){const q=S.queue[S.qi];return typeof q==="string"?R[+q.slice(1)]:E[q]}
function next(){
 while(S.qi<S.queue.length){const e=current();if(!e.req||e.req())break;S.qi++}
 if(S.qi>=S.queue.length)return endMonth();
 const e=current();save();render();
 PCHAR=null;$("who").textContent="";$("role").textContent="";$("choices").innerHTML="";
 const t=$("txt");t.className="wait";t.textContent="The great doors creak open...";
 SC.enter(e.who,()=>present(e));
}
function present(e){
 const c=C[e.who];PCHAR=c;$("who").textContent=c.n;$("role").textContent=c.r;$("txt").className="";
 typeText(e.text,c.voice,()=>{
  const ch=$("choices");ch.innerHTML="";
  e.choices.filter(o=>!o.req||o.req()).forEach((o,i)=>{const b=document.createElement("button");b.className="ch";b.style.animationDelay=i*70+"ms";
   b.innerHTML=o.t+(o.cost?`<span class="cost">${Object.entries(o.cost).map(([k,v])=>`<span><img class="px" src="${ICONURL[k]}">−${v}</span>`).join("")}${can(o)?"":"<span>(not enough)</span>"}</span>`:"");
   b.disabled=!can(o);b.onclick=()=>choose(e,o);ch.appendChild(b)})});
}
function choose(e,o){
 SFX.click();$("choices").innerHTML="";LAST={};const reply=o.go();render();react();
 typeText(reply,C[e.who].voice,()=>{const b=document.createElement("button");b.className="ch go";b.textContent="Continue";
  b.onclick=()=>{SFX.click();$("choices").innerHTML="";if(fail())return;S.qi++;PCHAR=null;$("txt").className="wait";$("txt").textContent="";$("who").textContent="";$("role").textContent="";SC.exit(next)};
  $("choices").appendChild(b)});
}
function react(){
 const L=LAST,w=SC.walker;let emo="dots";const px=w?w.x:112;
 const burst=(col,n,up)=>{for(let i=0;i<n;i++)part({x:px+(Math.random()-.5)*10,y:84,vx:(Math.random()-.5)*1.2,vy:up?-.6-Math.random():-1.4-Math.random(),grav:up?0:.06,life:50,max:50,col,sz:Math.random()<.4?2:1})};
 if((L.favor||0)>=4){emo="heart";SFX.heart();burst("#ff7a8a",14,1)}
 else if((L.favor||0)<=-5){emo="anger";SFX.bad();SC.shake=3;burst("#5a5060",10,1)}
 else if((L.men||0)<0){emo="skull";SFX.bad();SC.shake=4}
 else if(L.gold){emo="coin";SFX.coin();burst("#f2c14e",16,0)}
 else if(L.food||L.men){emo="bang";SFX.good()}
 SC.emote={type:emo,t:0};
}
let TY=null;
function typeText(str,voice,done){
 if(TY)clearTimeout(TY.to);const el=$("txt");el.textContent="";let i=0;SC.talk=true;TY={str,done};
 if(FAST)return finishType();
 const step=()=>{if(!TY||TY.str!==str)return;i++;el.textContent=str.slice(0,i);const ch=str[i-1];
  if(i%2===0&&/\w/.test(ch))SFX.blip(voice);
  if(i>=str.length)return finishType();
  TY.to=setTimeout(step,/[.!?]/.test(ch)&&str[i]===" "?160:/[,;:]/.test(ch)?70:17)};
 step()}
function finishType(){if(!TY)return;clearTimeout(TY.to);$("txt").textContent=TY.str;SC.talk=false;const d=TY.done;TY=null;d&&d()}
$("dialog").addEventListener("click",e=>{if(!e.target.closest("button"))finishType()});

function ledgerRows(){const b=S.b,se=SEASON(S.month);
 const tax=Math.round(S.favor/5)+4+(b.market?8:0)-(has("guildEnemy")?4:0);
 const crops={spring:4,summer:7,autumn:30,winter:0}[se]+(has("fedThornby")?3:has("halfThornby")?1:0)+(b.granary?5:0)-(has("witchCurse")?3:0);
 const eat=Math.ceil(S.men/6)+4,pray=b.chapel?2:0;return{tax,crops,eat,pray}}
function endMonth(){
 if(S.month>=LAST_MONTH)return siege();
 const L=ledgerRows();LAST={};fx({gold:L.tax,food:L.crops-L.eat,favor:L.pray});render();
 const se=SEASON(S.month);setPhase("night");Music.play("night");SFX.toll();setCastle(se==="winter"?"snow":se);
 S.built=false;showLedger(L);
}
function showLedger(L){
 const row=(ic,l,v)=>`<div class="sumrow"><span><img class="px" src="${ICONURL[ic]}">${l}</span><b>${v>=0?"+":"−"}${Math.abs(v)}</b></div>`;
 const builds=Object.entries(BUILD).map(([k,o])=>{const cost=k==="walls"&&has("masonWalls")?o.cost-10:o.cost;
  return S.b[k]?`<div class="bld done"><div><b>${o.n}</b><small>Built</small></div></div>`:
  `<div class="bld"><div><b>${o.n}</b><small>${o.d}</small></div><button onclick="build('${k}',${cost})" ${S.built||S.gold<cost?"disabled":""}><img class="px" src="${ICONURL.gold}" style="width:12px;height:12px;vertical-align:-1px"> ${cost}</button></div>`}).join("");
 overlay(`${castleHTML()}</div><div class="ovb"><h3>The end of ${MONTHS[S.month-1]}</h3>
  ${row("gold","Taxes",L.tax)}${row("food","Fields &amp; stores",L.crops)}${row("food","The castle eats",-L.eat)}${L.pray?row("favor","Chapel",L.pray):""}
  <p class="dim">${S.food<15?"The granary is nearly empty, my lord.":S.favor<20?"There is muttering in the taverns.":S.month===4?"Scouts say Vex's army is on the march.":"Emberfall sleeps."}</p>
  <h3 style="font-size:20px;margin-top:10px">Hildra's Works</h3><p class="dim" style="margin-top:0">${S.built?"The masons are busy until next month.":"Choose one thing to build this month."}</p>
  ${builds}<br><button class="pb" id="nextBtn">Begin ${MONTHS[S.month]}</button></div>`);
 $("nextBtn").onclick=()=>{SFX.click();closeOverlay();if(fail())return;S.month++;S.built=false;const war=S.month>=LAST_MONTH;
  setPhase(war?"dusk":"day",SEASON(S.month));Music.play(war?"battle":"hall");monthCard(()=>{buildMonth();next()})};
}
function build(k,cost){if(S.built||S.gold<cost)return;S.b[k]=1;S.built=true;LAST={};fx({gold:-cost});if(k==="barracks")fx({men:8});
 note(`Hildra's masons built the ${BUILD[k].n}.`);SFX.thud();SFX.coin();render();save();
 const sc=$("overlay").scrollTop;showLedger(ledgerRows());$("overlay").scrollTop=sc}
function monthCard(cb){render();const c=$("card"),se=SEASON(S.month);c.querySelector("b").textContent=MONTHS[S.month-1].toUpperCase();
 c.querySelector("b").style.color=SCOL[se];c.querySelector("span").textContent=S.month>=LAST_MONTH?"THE BANNERS COME":`${se.toUpperCase()} · MONTH ${S.month} OF 12`;
 $("pips").innerHTML=MONTHS.map((_,i)=>`<i class="${i+1===S.month?"now":i+1<S.month?"past":""}" style="background:${SCOL[SEASON(i+1)]}"></i>`).join("");
 c.style.display="flex";setTimeout(()=>{c.style.display="none";cb()},FAST?0:1700)}
function fail(){if(S.food<0)return ending("famine");if(S.favor<=0)return ending("revolt");if(S.gold<-20)return ending("debt");return false}
function battle(){
 if(has("plan_flee"))return"exile";if(has("knelt"))return"vassal";
 if(has("plan_parley")){if(has("kingFavor")&&S.favor>=50)return"peace";if(has("paidVex2"))return"vassal"}
 let p=S.men+(S.b.walls?20:0)+(has("harwinAlly")?40:0)+(has("refugees")?5:0)+(has("tunnelRaid")?10:0)+(has("plan_wall")?25:0)+(has("plan_attack")?(has("tobinProud")?15:5):0);
 if(has("harwinEnemy"))p-=10;if(has("brannocTrap"))p+=30;else if(!has("brannocJailed"))p-=35;
 if(has("witchFire"))return p>30?"witchQueen":"witchFall";
 if(p>=75)return has("kingFavor")?"crowned":"victory";if(p>=45)return"pyrrhic";return has("familySafe")?"lastStandSafe":"fallen"}
function siege(){
 const k=battle(),calm=["exile","vassal","peace"].includes(k);
 setCastle(calm?"night":"burn");Music.play(calm?"night":"battle");if(!calm)SFX.war();
 const plan=has("plan_flee")?"Torches gutter in the tunnel as Emberfall grows small behind you.":has("plan_parley")?"You ride out beneath a white banner to meet the Baron.":has("plan_attack")?"The gates swing wide. You lead the charge into the river.":(S.b.walls?"Arrows rain from Hildra's new stone walls.":"Arrows rain from the old walls of Emberfall.");
 const twist=has("brannocTrap")?"The postern gate opens... onto a wall of your spears. Brannoc's treachery becomes Vex's trap.":(!has("brannocJailed")&&!calm)?"Behind you, a postern gate swings open that should have been barred.":has("witchFire")?"Green fire crawls up out of the fen.":"";
 overlay(`${castleHTML()}</div><div class="ovb siege"><h3>High Summer</h3><p style="animation-delay:.3s">Baron Vex's host crosses the ford at dusk.</p>
  <p style="animation-delay:1.3s">${plan}</p>${twist?`<p style="animation-delay:2.3s">${twist}</p>`:""}
  <button class="pb" style="opacity:0;animation:appear 1s ${FAST?0:3}s forwards" id="fateBtn">Face your fate</button></div>`);
 $("fateBtn").onclick=()=>{SFX.click();ending(k)};
}
const ENDINGS={
 famine:["The Hungry Winter","The granaries ran empty. By midwinter your people ate the seed grain, then the horses. In spring, Emberfall was a city of ghosts."],
 revolt:["The Pitchfork Crown","Your people had enough. They broke down the doors of the hall. Hob the Miller rules Emberfall now, and he is not kind."],
 debt:["Owned by the Guild","The Merchant Guild bought your debts and then your castle. You still sit on the throne, but Osric Fairweather tells you when to stand."],
 exile:["The Lord in Exile","You escaped through grandfather's tunnel with your family. Emberfall burned behind you. Somewhere far away, you raise your children in peace, and in shame."],
 vassal:["The Kneeling Lord","You kept your castle and lost your name. Emberfall flies Vex's banner now, and your son will grow up bowing."],
 peace:["The King's Peace","King Osmund's herald arrived at the parley. Vex was ordered to stand down. Emberfall will be remembered as the house that won without blood."],
 crowned:["Lord of the River","Vex's army broke on your walls. King Osmund granted you the Baron's lands. The lord who never wanted a throne now holds two."],
 victory:["The Ford Holds","Vex fell on the riverbank. Emberfall stands free. In the hall that night, they sing your name."],
 pyrrhic:["A Bitter Victory","You held, barely. Half your soldiers lie in the mud by the ford. Emberfall is free, and quiet, and grieving."],
 fallen:["The Fall of Emberfall","The gates broke. Vex found you on your father's throne. The chronicles forget your name."],
 lastStandSafe:["The Last Stand","You fell at the gate, sword in hand. Elinor and the children reached the Marches safely. Maren tells her children of you."],
 witchQueen:["The Witch's Fire","Green fire swallowed Vex's army whole. Emberfall is safe. But the fen grows closer every year, and Morwen sits at your table now."],
 witchFall:["Fire Without End","Morwen's fire did not stop at Vex's army. It took the ford, the city, the abbey. You won, and there is nothing left to rule."],
};
const CONTINUES=["peace","crowned","victory","pyrrhic","witchQueen","vassal"];
const GOOD=["peace","crowned","victory"],BAD=["revolt","fallen","witchFall","debt"];
function gotEndings(){try{return JSON.parse(localStorage.getItem("ef_end")||"[]")}catch(e){return[]}}
function ending(k){
 const[t,d]=ENDINGS[k];const got=gotEndings();if(!got.includes(k))got.push(k);
 try{localStorage.setItem("ef_end",JSON.stringify(got));localStorage.removeItem("ef_save2")}catch(e){}
 setCastle(k==="famine"?"snow":GOOD.includes(k)?"dawn":BAD.includes(k)?"burn":"night");
 Music.play(GOOD.includes(k)?"hall":"night");GOOD.includes(k)?SFX.fanfare():SFX.doom();
 overlay(`${castleHTML()}</div><div class="ovb ending"><div class="dim">— AN ENDING —</div><h3>${t}</h3><p>${d}</p>
  ${CONTINUES.includes(k)?`<p style="color:#f2c14e">Chapter One is complete. Your reign continues into autumn and winter in the next update.</p>`:""}
  <p class="dim">Endings discovered: ${got.length} / ${Object.keys(ENDINGS).length}</p>
  <button class="pb" onclick="newGame()">Begin a New Reign</button><button class="pb alt" onclick="openChron()">Read the Chronicle</button><button class="pb alt" onclick="title()">Title Screen</button></div>`);
 return true}
function overlay(h){const o=$("overlay");o.innerHTML=h;o.style.display="flex";o.scrollTop=0}
function closeOverlay(){$("overlay").style.display="none";$("overlay").innerHTML=""}
function modal(h){const m=$("modal");m.innerHTML=`<div class="box">${h}</div>`;m.style.display="flex"}
function closeModal(){$("modal").style.display="none"}
function openChron(){SFX.page();modal(`<h3>The Chronicle of Emberfall</h3><ul>${(S&&S.chron||[]).map(c=>`<li>${c}</li>`).join("")||"<li>Nothing yet written.</li>"}</ul><button class="pb" onclick="closeModal()">Close</button>`)}
function savePrefs(){try{localStorage.setItem("ef_prefs",JSON.stringify({m:AU.musicOn,s:AU.sfxOn}))}catch(e){}}
function openSettings(){SFX.click();modal(`<h3>Settings</h3>
 <button class="pb alt" onclick="AU.musicOn=!AU.musicOn;if(AU.mg)AU.mg.gain.value=AU.musicOn?.5:0;savePrefs();openSettings()">Music: ${AU.musicOn?"On":"Off"}</button>
 <button class="pb alt" onclick="AU.sfxOn=!AU.sfxOn;if(AU.sg)AU.sg.gain.value=AU.sfxOn?.6:0;savePrefs();openSettings()">Sound: ${AU.sfxOn?"On":"Off"}</button>
 <button class="pb alt" onclick="closeModal();title()">Save &amp; Quit to Title</button>
 <button class="pb" onclick="closeModal()">Back</button>`)}
function openEndings(){SFX.page();const got=gotEndings();modal(`<h3>Endings ${got.length} / ${Object.keys(ENDINGS).length}</h3><div class="elist">${Object.keys(ENDINGS).map(k=>got.includes(k)?`<div>👑 ${ENDINGS[k][0]}</div>`:`<div class="lock">??? Undiscovered</div>`).join("")}</div><br><button class="pb" onclick="closeModal()">Close</button>`)}
function save(){try{localStorage.setItem("ef_save2",JSON.stringify(S))}catch(e){}}
function newGame(){AU.init();SFX.click();closeModal();S=fresh();closeOverlay();setPhase("day","spring");SC.walker=null;Music.play("hall");monthCard(()=>{buildMonth();next()})}
function cont(){AU.init();SFX.click();let s=null;try{s=JSON.parse(localStorage.getItem("ef_save2"))}catch(e){}if(!s)return newGame();if(!s.month)return newGame();S=s;closeOverlay();const war=S.month>=LAST_MONTH;setPhase(war?"dusk":"day",SEASON(S.month));SC.walker=null;Music.play(war?"battle":"hall");render();next()}
function title(){
 if(TY){clearTimeout(TY.to);TY=null}SC.walker=null;SC.talk=false;
 let hasSave=false;try{hasSave=!!localStorage.getItem("ef_save2")}catch(e){}
 setCastle("title");Music.play("night");
 overlay(`${castleHTML()}<div class="logo"><h1>EMBERFALL</h1><h2>MY LORD</h2></div></div><div class="ovb">
  <p class="dim">The throne is yours. So is everything that follows.</p>
  ${hasSave?'<button class="pb" onclick="cont()">Continue Reign</button>':""}<button class="pb ${hasSave?"alt":""}" onclick="newGame()">New Reign</button>
  <button class="pb alt" onclick="openEndings()">Endings (${gotEndings().length}/${Object.keys(ENDINGS).length})</button>
  <button class="pb alt" onclick="openSettings()">Settings</button></div>`)}

buildStats();S=fresh();render();setPhase("day","spring");title();loop();
</script>
</body>
</html>
